    <div class="question-nav" aria-label="Question navigation">
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
        <strong>Questions</strong><span class="mini">${answeredCount}/${exam.list.length} answered</span>
      </div>
      ${nav}
      <div class="nav-legend" style="width:100%">
        <span><i class="nav-dot"></i>Not answered</span>
        <span><i class="nav-dot answered"></i>Correct</span><span><i class="nav-dot wrong"></i>Wrong</span>
        <span><i class="nav-dot current"></i>Current</span>

      <div class="question" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><span>${esc(q.question)}</span><div style="display:flex;gap:7px;flex:0 0 auto"><button type="button" class="btn" onclick="openQuestionReport()" title="Report this question" aria-label="Report this question">⚑</button><button type="button" class="btn" data-favorite-id="${attrJs(q.id)}" onclick='toggleFavorite(${JSON.stringify(q.id)})' title="${isFavorite(q)?'Remove from favourites':'Mark as favourite'}" aria-label="${isFavorite(q)?'Remove from favourites':'Mark as favourite'}">${isFavorite(q)?'★':'☆'}</button></div></div>
      ${q.imageUrl ? `<img class="question-illustration" src="${esc(q.imageUrl)}" alt="Question illustration" loading="eager">` : ''}

    ${examAI.open?examAIHTML(q,answeredNow):`<div class="exam-ai-wrap"><div class="exam-ai-trigger"><div><strong>Need an explanation?</strong><div class="mini">Ask AI about this question before or after answering.</div></div><button class="btn primary" onclick="openExamAI()">✦ Ask AI</button></div></div>`}
    <div class="quiz-footer"><button class="btn" onclick="prevQ()" ${exam.index===0?'disabled':''}>Previous</button>
    <button class="btn primary" onclick="${exam.index===exam.list.length-1?'submitExam(false)':'nextQ()'}">${exam.index===exam.list.length-1?'Submit Exam':'Next'}</button></div>
  </div></div>`;
  document.getElementById('app').innerHTML=layout('Exam','Use the numbered buttons to move between questions. You can open Ask AI at any time for a question-specific explanation.',body);
  setTimeout(()=>{initExamDrawing();},0);
}

function openQuestionReport(){
  if(!exam||exam.submitted)return;
  reportPanelOpen=true;
  renderQuiz();
}
function closeQuestionReport(){
  reportPanelOpen=false;
  renderQuiz();
}
function questionReportHTML(q){
  return `<div class="report-panel" id="questionReportPanel"><h4>Report this question</h4><div class="mini">Tell the MedEx team what is wrong with this question. Your report will be reviewed by an administrator.</div><div class="grid two" style="margin-top:10px"><div class="field"><label>Reason</label><select id="reportReason"><option value="Wrong answer">Wrong answer / key</option><option value="Wrong options">Wrong or missing option</option><option value="Unclear question">Question is unclear</option><option value="Typo">Typo / spelling</option><option value="Other">Other</option></select></div><div class="field"><label>Comment</label><textarea id="reportComment" style="min-height:90px;font-family:var(--font-sans);font-size:14px" placeholder="Describe the problem…"></textarea></div></div><div class="report-actions"><button class="btn primary" onclick="submitQuestionReport()">Send report</button><button class="btn" onclick="closeQuestionReport()">Cancel</button></div></div>`;
}
async function submitQuestionReport(){
  if(!exam||exam.submitted||!SUPABASE_ENABLED){toast('Reporting requires Supabase connection.','error');return;}
  const q=exam.list[exam.index];
  const reason=(document.getElementById('reportReason')?.value||'Other').trim();
  const comment=(document.getElementById('reportComment')?.value||'').trim();
  if(!comment){toast('Please add a comment before sending the report.','error');return;}
  const {error}=await supabaseClient.from('question_reports').insert({
    question_id:String(q.id), question_text:q.question, reason, comment,
    selected_option:exam.answers[q.id]!==undefined?String(q.options[exam.answers[q.id]]||''):null,
    user_id:currentUser?.id||null, visitor_id:currentUser?null:getVisitorId(),
    reporter_email:currentUser?.email||null, status:'open'
  });
  if(error){toast('Could not send report: '+error.message,'error');return;}
  reportPanelOpen=false;
  renderQuiz();
  toast('Thank you. Your question report was sent to the MedEx team.','ok');
}

function examAIHTML(q, answered){
  const status=answered
    ? `Your answer: <b>${esc(q.options[exam.answers[q.id]])}</b> · ${exam.answers[q.id]===q.correctIndex?'Correct':'Incorrect'}`
    : 'You have not answered this question yet.';
  const quick=answered
    ? `<button class="btn" onclick="examAIQuick('explain-answer')">Explain my answer</button><button class="btn" onclick="examAIQuick('explain-correct')">Explain the correct answer</button>`
    : `<button class="btn" onclick="examAIQuick('explain-without-answer')">Explain without giving the answer</button><button class="btn" onclick="examAIQuick('hint')">Give me a hint</button>`;
  const log=examAI.messages.length
    ? examAI.messages.map(m=>`<div class="chat-msg ${m.role==='ai'?'ai':m.role==='error'?'error':'user'}">${esc(m.text)}</div>`).join('')
    : `<div class="empty" style="padding:22px 8px">Ask about this question before or after answering. Before you answer, AI can explain the concept or give a hint without revealing the answer.</div>`;
  return `<div class="exam-ai-wrap" id="examAI">
    <div class="exam-ai-trigger"><div><strong>AI explanation for this question</strong><div class="mini">${answered?'You have answered — ask AI to explain your reasoning or the correct answer.':'Not answered yet — ask for a concept explanation or hint without revealing the answer.'}</div></div>${examAIButtonForPanel()}</div>
    <div class="exam-ai-panel">
      <div class="exam-ai-head"><div><strong>✦ Ask AI</strong><div class="mini">Groq · GPT-OSS 120B</div></div><button class="btn" onclick="closeExamAI()">Close</button></div>
      <div class="exam-ai-context"><b>Question:</b> ${esc(q.question)}<br>${status}</div>
      <div class="exam-ai-actions">${quick}</div>
      <div class="exam-ai-log" id="examAILog">${log}</div>
      ${examAIBusy?'<div class="exam-ai-status"><span class="spinner" style="border-color:rgba(12,124,140,.25);border-top-color:var(--primary);margin-right:5px"></span>AI is preparing an explanation…</div>':''}
      <div class="exam-ai-input"><textarea id="examAIInput" placeholder="Ask about this question…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendExamAI();}"></textarea><button class="btn primary" id="examAISendBtn" onclick="sendExamAI()" ${examAIBusy?'disabled':''}>${examAIBusy?'…':'Send'}</button></div>
    </div>
  </div>`;
}
function examAIButtonForPanel(){ return `<button class="btn" onclick="closeExamAI()">Close AI</button>`; }
function openExamAI(){
  if(!exam||exam.submitted)return;
  const q=exam.list[exam.index];
  examAI={open:true,questionId:q.id,messages:[]};
  renderQuiz();
  setTimeout(()=>document.getElementById('examAIInput')?.focus(),0);
}
function closeExamAI(){
  examAI={open:false,questionId:null,messages:[]};
  renderQuiz();
}
function examAIPush(role,text){
  examAI.messages.push({role,text});
}
function examAIPrompt(mode,q){
  const selected=exam.answers[q.id];
  const answered=selected!==undefined;
  const answerInfo=answered
    ? `The student selected option ${String.fromCharCode(65+selected)}: "${q.options[selected]}". The correct option is ${String.fromCharCode(65+q.correctIndex)}: "${q.options[q.correctIndex]}".`
    : 'The student has not answered yet.';
  const rules=answered
    ? 'Explain the student\'s answer and the correct answer. State whether the selected option is correct, explain why the correct option is best, and briefly explain why the other options are less appropriate. Be educational and concise.'
    : mode==='hint'
      ? 'Give a useful clinical/exam reasoning hint that helps the student solve the question, but do NOT reveal the correct option or quote the correct answer.'
      : 'Explain the key concept, reasoning approach, and important clues needed to solve the question, but do NOT reveal the correct option or quote the correct answer.';
  if(mode==='explain-correct') return `You are the MedEx exam AI assistant. ${rules}\n\nQuestion: ${q.question}\nOptions:\n${q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join('\n')}\n\n${answerInfo}`;
  if(mode==='explain-answer') return `You are the MedEx exam AI assistant. ${rules}\n\nQuestion: ${q.question}\nOptions:\n${q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join('\n')}\n\n${answerInfo}`;
  return `You are the MedEx exam AI assistant. ${rules}\n\nQuestion: ${q.question}\nOptions:\n${q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join('\n')}\n\n${answerInfo}`;
}
async function examAIQuick(mode){
  if(!exam||exam.submitted||examAIBusy)return;
  const q=exam.list[exam.index];
  const label=mode==='hint'?'Give me a hint':mode==='explain-without-answer'?'Explain this question without giving the answer':mode==='explain-answer'?'Explain my answer':'Explain the correct answer';
  examAIPush('user',label);
  await sendExamAIPrompt(examAIPrompt(mode,q));
}
async function sendExamAI(){
  if(!exam||exam.submitted||examAIBusy)return;
  const q=exam.list[exam.index];
  const input=document.getElementById('examAIInput');
  const text=input?.value.trim();
  if(!text)return;
  input.value='';
  examAIPush('user',text);
  const prompt=`You are the MedEx exam AI assistant. Answer the student's question about the current exam question clearly and educationally. If the student has not answered yet, do not reveal the correct option unless they explicitly ask you to reveal it. If they have answered, you may explain whether their answer is correct and why.\n\nCurrent question: ${q.question}\nOptions:\n${q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join('\n')}\n\n${exam.answers[q.id]!==undefined?`Student selected ${String.fromCharCode(65+exam.answers[q.id])}: ${q.options[exam.answers[q.id]]}. Correct option: ${String.fromCharCode(65+q.correctIndex)}: ${q.options[q.correctIndex]}.`:'Student has not answered yet.'}\n\nStudent asks: ${text}`;
  await sendExamAIPrompt(prompt);
}
async function sendExamAIPrompt(prompt){
  if(examAIBusy)return;
  examAIBusy=true;
  renderQuiz();
  try{
    const contents=[{role:'user',parts:[{text:`Answer in ordinary readable text. Do not return JSON or code. Use short paragraphs or bullets when useful.\n\n${prompt}`}]}];
    const reply=await callAI(contents,{maxOutputTokens:1800,responseMimeType:'text/plain'},{provider:'groq',model:'openai/gpt-oss-120b',accessCode:aiSettings.accessCode||''});
    examAIPush('ai',formatAIChatReply(reply));
  }catch(e){
    examAIPush('error','Error: '+e.message);
  }finally{
    examAIBusy=false;
    renderQuiz();
    setTimeout(()=>{const log=document.getElementById('examAILog');if(log)log.scrollTop=log.scrollHeight;document.getElementById('examAIInput')?.focus();},0);
  }
}

function jumpToQuestion(i){
  if(!exam||exam.submitted||i<0||i>=exam.list.length)return;
  exam.index=i;
  saveActiveExam();
  renderQuiz();
}
function updateAnswerFeedback(q,selected){
  // Update only the option/feedback DOM nodes. Do NOT replace #app here:
  // replacing the quiz markup forces the illustration <img> to download again.
  const reveal=exam.answerMode==='immediate';
  document.querySelectorAll('.quiz .option').forEach((btn,i)=>{
    btn.classList.remove('selected','correct','wrong');
    btn.setAttribute('aria-pressed', selected===i ? 'true' : 'false');
    if(selected!==undefined){
      if(reveal && i===q.correctIndex) btn.classList.add('correct');
      else if(reveal && i===selected) btn.classList.add('wrong','selected');
      else if(!reveal && i===selected) btn.classList.add('selected');
    }
  });
  document.querySelectorAll('.qnav-btn').forEach((btn,i)=>{
    const item=exam.list[i], a=exam.answers[item.id];
    btn.classList.remove('answered','wrong');
    if(a!==undefined){
      if(reveal && a!==item.correctIndex) btn.classList.add('wrong');
      else btn.classList.add('answered');
    }
  });
  const count=exam.list.filter(item=>exam.answers[item.id]!==undefined).length;
  const countEl=document.querySelector('.question-nav > div:first-child .mini');
  if(countEl) countEl.textContent=`${count}/${exam.list.length} answered`;
  const review=document.querySelector('.quiz .review');
  if(review && exam.answerMode==='immediate' && selected!==undefined){
    review.className=`review ${selected===q.correctIndex?'good':'bad'}`;
    review.innerHTML=`<b>${selected===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}`;
  }else if(exam.answerMode==='immediate' && selected!==undefined){
    const options=document.querySelector('.quiz .options');
    if(options){
      options.insertAdjacentHTML('afterend',`<div class="review ${selected===q.correctIndex?'good':'bad'}"><b>${selected===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}</div>`);
    }
  }
}
function chooseAnswer(i){

  if(exam.answerMode==='immediate' && exam.answers[q.id]!==undefined)return;

async function submitExam(auto){
  if(!exam)return;
  if(!auto && !confirm('Submit this exam now?'))return;
  clearInterval(timerId);
  let correct=0;
  const answeredQuestionsForReview=[];
  exam.list.forEach(q=>{
    const a=exam.answers[q.id];
    if(a===undefined)return;
    const k=key(q);
    if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
    progress[k].attempts++;
    if(a===q.correctIndex){progress[k].correct++;correct++;progress[k].last='correct';}
    else {progress[k].wrong++;progress[k].last='wrong';}
    updateSpacedRepetition(q,a===q.correctIndex);
    answeredQuestionsForReview.push(q);
    recordStudyAnswer(q.id, a===q.correctIndex);
  });
  saveState();
  await syncReviewSchedulesToSupabase(answeredQuestionsForReview);
  const unanswered=exam.list.filter(q=>exam.answers[q.id]===undefined).length;
  const durationSec=Math.round((Date.now()-exam.started)/1000);
  const result={
    id:'exam_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    date:new Date().toISOString(),
    label:exam.label||'Exam',
    moduleFilter:exam.moduleFilter||'',
    subjectFilter:exam.subjectFilter||'',
    lectureFilter:exam.lectureFilter||'',
    total:exam.list.length,
    answered:exam.list.length-unanswered,
    correct,
    unanswered,
    answerMode:exam.answerMode||'finish',
    accuracy:pct(correct,exam.list.length-unanswered),
    durationSec,
    list:exam.list,
    answers:exam.answers,
    auto
  };

  if(SUPABASE_ENABLED){
    await recordExamForAnalytics(result);
  }
  if(SUPABASE_ENABLED && currentUser){
    await saveExamToSupabase(result);
    for(const q of exam.list){
      const a=exam.answers[q.id];
      if(a===undefined)continue;
      await recordAttemptToSupabase(q,a,a===q.correctIndex,result.id);
    }
    await syncLocalProgressToSupabase();
    await loadGlobalAnalytics();
  }
  // Drawings, highlights and notes are exam-only and are intentionally discarded on submission.
  if(exam){ exam.annotations={}; }
  exam=null;
  clearActiveExam();
  localStorage.setItem(CONFIG.lastResultKey,JSON.stringify(result));
  saveHistory(result);
  // v41.27: submitting an exam must not create a toast/site notification.
  document.getElementById('toast')?.classList.add('hidden');
  go('results');
}

    reviews:0, intervalMinutes:0, nextAt:0, lastRating:'', lastReviewedAt:0,
    favorite:false, difficult:false, suspended:false, leech:false

function flashcardDayKey(ts=Date.now()){

}
function flashcardDailyStats(){

function flashcardItems(filters=flashcardFilter){
  let list=bank.filter(q=>q.question&&Array.isArray(q.options)&&q.options.length);
  if(filters.module)list=list.filter(q=>String(q.module)===String(filters.module));
  if(filters.subject)list=list.filter(q=>String(q.subject)===String(filters.subject));
  if(filters.lecture)list=list.filter(q=>String(q.lecture)===String(filters.lecture));
  const now=Date.now();
  if(filters.mode==='due') list=list.filter(q=>{const p=flashcardRecord(q);return !p.suspended&&p.state!=='new'&&Number(p.due||0)<=now;});
  if(filters.mode==='new') list=list.filter(q=>{const p=flashcardRecord(q);return !p.suspended&&p.state==='new';});

function flashcardIntervalLabel(days){
  days=Math.max(0,Number(days)||0);
  if(days<1){const minutes=Math.max(1,Math.round(days*1440));return minutes<60?`${minutes}m`:`${Math.round(minutes/60)}h`;}
  if(days<30)return `${Math.max(1,Math.round(days))}d`;

}
function flashcardDueLabel(q){
  const p=flashcardRecord(q); if(p.state==='new')return 'New'; if(p.suspended)return 'Suspended';
  const t=Number(p.due||0); if(!t)return 'Due now';
  const diff=t-Date.now(); if(diff<=0)return 'Due now';
  if(diff<3600000)return `Due in ${Math.max(1,Math.round(diff/60000))}m`;
  if(diff<86400000)return `Due in ${Math.max(1,Math.round(diff/3600000))}h`;

  const daily=flashcardDailyStats(), row=daily.row;
  p.lastRating=rating; p.lastReviewedAt=Date.now(); p.reviews=Number(p.reviews||0)+1; p.reps=Number(p.reps||0)+1;

  const learnSteps=[1,10], relearnSteps=[10];
  if(wasNew || wasLearning){

    }else if(rating==='hard'){
      const base=wasLearning?(learnSteps[Math.min(p.learningStep||0,learnSteps.length-1)]||10):6;
      flashcardSchedule(p,Math.max(6,base),p.state);
    }else if(rating==='good'){
      if((p.learningStep||0)<learnSteps.length-1){ p.learningStep=(p.learningStep||0)+1; flashcardSchedule(p,learnSteps[p.learningStep],p.state); }
      else { p.state='review'; p.intervalDays=1; p.due=Date.now()+86400000; p.intervalMinutes=1440; p.ease=Math.max(2.3,Number(p.ease||2.5)); }
    }else if(rating==='easy'){
      p.state='review'; p.learningStep=0; p.intervalDays=4; p.due=Date.now()+4*86400000; p.intervalMinutes=4*1440; p.ease=Math.min(3.0,Number(p.ease||2.5)+0.15);

    const old=Math.max(1,Number(p.intervalDays||1));
    if(rating==='again'){
      p.lapses=Number(p.lapses||0)+1; p.ease=Math.max(1.3,Number(p.ease||2.5)-0.20); p.intervalDays=Math.max(1,Math.round(old*0.2)); p.learningStep=0; p.state='relearning'; flashcardSchedule(p,10,'relearning');

      p.intervalDays=Math.max(1,old*1.2); flashcardSchedule(p,Math.max(1440,Math.round(p.intervalDays*1440)),'review');
    }else if(rating==='good'){
      p.intervalDays=Math.max(1,old*Number(p.ease||2.5)); flashcardSchedule(p,Math.round(p.intervalDays*1440),'review');
    }else if(rating==='easy'){

function flashcardQueueForSession(){
  const mode=flashcardFilter.mode==='new'?'new':'due';
  let list=flashcardItems({...flashcardFilter,mode});
  // Keep Anki's queue separation: time-sensitive learning/relearning first, then mature reviews.
  if(mode==='due') list.sort((a,b)=>{
    const pa=flashcardRecord(a), pb=flashcardRecord(b);
    const rank=x=>x.state==='learning'||x.state==='relearning'?0:1;
    return rank(pa)-rank(pb) || Number(pa.due||0)-Number(pb.due||0);
  });

  return list;
}
function startFlashcardSession(){
  const mode=flashcardFilter.mode==='new'?'new':'due';
  let list=flashcardQueueForSession();
  if(!list.length){toast(mode==='due'?'There are no due or learning cards in this selection.':'There are no new cards in this selection.','error');return;}
  // Only NEW cards are subject to the daily new-card limit. Due/relearning cards are not.
  if(mode==='new'){
    const daily=flashcardDailyStats().row;
    const newRemaining=Math.max(0,20-Number(daily.newCards||0));
    if(newRemaining<=0){toast('Your daily new-card limit (20) is reached. Review due cards or continue tomorrow.','ok');return;}
    list=list.slice(0,newRemaining);
  }
  const count=Number(flashcardFilter.count||0); if(count>0)list=list.slice(0,count);
  if(!list.length){toast('No cards are available for this selection and limit.','error');return;}
  flashcardSession={list,index:0,revealed:false,ratings:{again:0,hard:0,good:0,easy:0},startedAt:Date.now()};
  renderFlashcardSession();
}

function runFocusTimer(){clearInterval(focusTimerId);if(!focusTimerState.running)return;focusTimerState.startedAt=Date.now();focusTimerId=setInterval(()=>{if(!focusTimerState.running){clearInterval(focusTimerId);return;}const elapsed=Math.floor((Date.now()-focusTimerState.startedAt)/1000);const remain=Math.max(0,Number(focusTimerState.remaining||0)-elapsed);focusTimerState.remaining=remain;focusTimerState.startedAt=Date.now();saveFocusState();const el=document.getElementById('focusTimerDisplay');if(el)el.textContent=formatTime(remain);if(remain<=0){focusTimerState.running=false;saveFocusState();clearInterval(focusTimerId);focusTimerId=null;toast('Focus session complete. Nice work.','ok');if('Notification' in window&&Notification.permission==='granted')navigator.serviceWorker?.ready.then(r=>r.showNotification('MedEx Focus complete',{body:focusTimerState.label||'Your study session is complete.'})).catch(()=>{});}} ,1000);}
function focusPreset(seconds){focusTimerState.preset=seconds;focusTimerState.remaining=seconds;focusTimerState.running=false;focusTimerState.startedAt=0;saveFocusState();renderStudyTools();}
function requestFocusNotifications(){if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});}
function focusTimerHTML(){const remain=Math.max(0,Number(focusTimerState.remaining||1500));const presets=[1500,3000,3600];return `<section class="study-tools-card focus-timer-card"><span class="study-eyebrow">FOCUS MODE</span><h3 style="margin-top:5px">One task. No distractions.</h3><input class="field" style="max-width:320px;width:100%;margin-top:8px;text-align:center" value="${esc(focusTimerState.label||'Focused study')}" onchange="focusLabelChanged(this.value)" placeholder="What are you studying?"><div id="focusTimerDisplay" class="focus-timer">${formatTime(remain)}</div><div class="focus-status">${focusTimerState.running?'Session running':'Ready to focus'}</div><div class="focus-presets">${presets.map(x=>`<button class="btn focus-preset ${focusTimerState.preset===x?'active':''}" onclick="focusPreset(${x})">${x/60} min</button>`).join('')}</div><div class="actions" style="margin-top:12px;justify-content:center"><button class="btn primary" onclick="${focusTimerState.running?'pauseFocusTimer()':'startFocusTimer()'}">${focusTimerState.running?'Pause':'Start focus'}</button><button class="btn" onclick="resetFocusTimer()">Reset</button><button class="btn" onclick="requestFocusNotifications()">Allow completion alert</button></div></section>`;}
function studyHubHTML(){const modules=getModules().filter(isModuleVisible);const qs=studyHubQuestions();const imageCount=qs.filter(q=>q.imageUrl).length;const due=qs.filter(q=>{const p=flashcardRecord(q);return !p.suspended&&p.state!=='new'&&Number(p.due||0)<=Date.now();}).length;const mistakes=qs.filter(q=>Number(progress[key(q)]?.wrong||0)>0).length;return `<section class="study-tools-card"><div class="study-card-heading"><div><span class="study-eyebrow">LECTURE STUDY HUB</span><h3>Study one topic from every angle</h3><p>Select a module, subject and lecture, then jump directly to questions, images, written answers or spaced review.</p></div><span class="study-count-badge"><b>${qs.length}</b><span>QUESTIONS</span></span></div><div class="study-filter-grid"><div class="field"><label>Module</label><select id="studyHubModule" onchange="updateStudyHubSubjects()"><option value="">All modules</option>${modules.map(m=>`<option value="${attrJs(m)}" ${studyHubFilter.module===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>Subject</label><select id="studyHubSubject" onchange="updateStudyHubLectures()"><option value="">All subjects</option>${getSubjects(studyHubFilter.module||undefined).map(x=>`<option value="${attrJs(x)}" ${studyHubFilter.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Lecture</label><select id="studyHubLecture" onchange="updateStudyHubLecture()"><option value="">All lectures</option>${getLectures(studyHubFilter.module||undefined,studyHubFilter.subject||undefined).map(x=>`<option value="${attrJs(x)}" ${studyHubFilter.lecture===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="study-hub-grid"><button class="study-hub-action" onclick="startStudyHubExam()"><b>❓ Practice questions</b><span>${qs.length} questions in this selection.</span></button><button class="study-hub-action" onclick="startStudyHubImageReview()"><b>🖼️ Image review</b><span>${imageCount} image-based questions.</span></button><button class="study-hub-action" onclick="startStudyHubWritten()"><b>✍️ Written answers</b><span>Write answers and get AI feedback.</span></button><button class="study-hub-action" onclick="go('mistakes')"><b>❌ Review mistakes</b><span>${mistakes} questions with previous wrong answers.</span></button><button class="study-hub-action" onclick="startStudyHubFlashcards()"><b>🧠 Flashcards</b><span>${due} due cards in the current selection.</span></button><button class="study-hub-action" onclick="go('progress')"><b>📊 View progress</b><span>Module → subject → lecture analytics.</span></button></div></section>`;}
function renderWrittenPractice(){if(!writtenPractice)return go('tools');const q=writtenPractice.list[writtenPractice.index];if(!q)return go('tools');const body=`<div class="written-practice-shell"><div class="card"><div class="qhead"><span class="pill">${writtenPractice.index+1} / ${writtenPractice.list.length}</span><span class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</span></div><h2 style="margin-top:14px">${esc(q.question)}</h2>${q.imageUrl?`<img class="phase2-image-review" src="${esc(q.imageUrl)}" alt="Question illustration">`:''}<textarea id="writtenAnswerInput" class="written-answer-box" style="width:100%;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg)" placeholder="Write your answer in your own words…"></textarea><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="gradeWrittenAnswer()" ${writtenPractice.busy?'disabled':''}>${writtenPractice.busy?'Grading…':'Check with AI'}</button><button class="btn" onclick="go('tools')">Exit</button></div>${writtenPractice.feedback?`<div class="review good written-answer-feedback">${writtenPractice.feedback}</div>`:''}</div></div>`;document.getElementById('app').innerHTML=layout('Written Answer Practice','Explain the concept in your own words, then compare with AI feedback.',body);}
async function gradeWrittenAnswer(){if(!writtenPractice||writtenPractice.busy)return;const q=writtenPractice.list[writtenPractice.index],input=document.getElementById('writtenAnswerInput');const answer=(input?.value||'').trim();if(!answer){toast('Write an answer first.','error');return;}writtenPractice.busy=true;renderWrittenPractice();try{const prompt=`You are a medical education tutor grading a student's written answer. Be concise but specific. Do not invent facts. Question: ${q.question}\nExpected correct option: ${q.options?.[q.correctIndex]||''}\nExplanation: ${q.explanation||'No explanation provided.'}\nStudent answer: ${answer}\nGive: 1) a brief verdict, 2) what the student got right, 3) what is missing or incorrect, 4) one improved model answer. Use plain text and bullets.`;const reply=await callAI([{role:'user',parts:[{text:prompt}]}],{maxOutputTokens:1200,responseMimeType:'text/plain'});writtenPractice.feedback=esc(formatAIChatReply(reply));}catch(e){writtenPractice.feedback=`AI grading failed: ${esc(e.message||String(e))}`;}finally{writtenPractice.busy=false;renderWrittenPractice();}}

function detailedProgressTreeHTML(){
  const modules=[...new Set(bank.map(q=>String(q.module||'Uncategorized')))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
  return `<div class="progress-tree">${modules.map((module,mi)=>{
    const mqs=bank.filter(q=>String(q.module||'Uncategorized')===module);
    const mAttempts=mqs.reduce((n,q)=>n+Number(progress[key(q)]?.attempts||0),0);
    const mCorrect=mqs.reduce((n,q)=>n+Number(progress[key(q)]?.correct||0),0);
    const mProgress=progressFor(mqs);
    const subjects=[...new Set(mqs.map(q=>String(q.subject||'Uncategorized')))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
    return `<details class="progress-tree-module" ${mi===0?'open':''}><summary><div style="min-width:0;flex:1"><b>${esc(module)}</b><div class="mini">${mqs.length} questions · ${mqs.filter(q=>Number(progress[key(q)]?.attempts||0)>0).length} practiced · ${mAttempts} attempts</div><div class="bar" style="margin-top:8px"><i style="width:${mProgress}%"></i></div></div><div style="display:flex;align-items:center;gap:10px"><span class="pill">${mAttempts?pct(mCorrect,mAttempts):0}% accuracy</span><span class="progress-tree-arrow">›</span></div></summary><div class="progress-tree-subjects">${subjects.map((subject,si)=>{
      const sqs=mqs.filter(q=>String(q.subject||'Uncategorized')===subject);
      const sAttempts=sqs.reduce((n,q)=>n+Number(progress[key(q)]?.attempts||0),0);
      const sCorrect=sqs.reduce((n,q)=>n+Number(progress[key(q)]?.correct||0),0);
      const sProgress=progressFor(sqs);
      const lectures=[...new Set(sqs.map(q=>String(q.lecture||'Uncategorized')))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
      return `<details class="progress-tree-subject" ${si===0?'open':''}><summary><div style="min-width:0;flex:1"><b>${esc(subject)}</b><div class="mini">${sqs.length} questions · ${sqs.filter(q=>Number(progress[key(q)]?.attempts||0)>0).length} practiced · ${sAttempts} attempts</div><div class="bar" style="margin-top:7px"><i style="width:${sProgress}%"></i></div></div><span class="pill">${sAttempts?pct(sCorrect,sAttempts):0}%</span></summary><div class="progress-tree-lectures">${lectures.map(lecture=>{
        const lqs=sqs.filter(q=>String(q.lecture||'Uncategorized')===lecture);
        const attempts=lqs.reduce((n,q)=>n+Number(progress[key(q)]?.attempts||0),0);
        const correct=lqs.reduce((n,q)=>n+Number(progress[key(q)]?.correct||0),0);
        const practiced=lqs.filter(q=>Number(progress[key(q)]?.attempts||0)>0).length;
        const acc=attempts?pct(correct,attempts):0;
        return `<div class="progress-tree-lecture"><div class="progress-tree-lecture-title"><strong>${esc(lecture)}</strong><span>${practiced}/${lqs.length} practiced · ${attempts} attempts</span></div><div><div class="bar"><i style="width:${acc}%"></i></div><div class="mini" style="margin-top:5px">Progress ${progressFor(lqs)}% · Accuracy ${acc}%</div></div><div class="progress-tree-lecture-stat">${correct} correct<br>${Math.max(0,attempts-correct)} wrong</div></div>`;
      }).join('')}</div></details>`;
    }).join('')}</div></details>`;
  }).join('')||'<div class="card empty">No visible modules or questions loaded.</div>'}</div>`;
}

function renderMistakes(){
  const wrong=bank.filter(q=>progress[key(q)]&&progress[key(q)].wrong>0);
  const topicMap=new Map();
  wrong.forEach(q=>{
    const p=progress[key(q)]||{};
    const topicKey=[q.module,q.subject,q.lecture].map(String).join('|||');
    const row=topicMap.get(topicKey)||{module:q.module,subject:q.subject,lecture:q.lecture,attempts:0,wrong:0,correct:0,questions:0};
    row.attempts+=Number(p.attempts||0); row.wrong+=Number(p.wrong||0); row.correct+=Number(p.correct||0); row.questions++;
    topicMap.set(topicKey,row);
  });
  const weakTopics=[...topicMap.values()].map(x=>({...x,errorRate:x.attempts?Math.round((x.wrong/x.attempts)*100):0}))
    .sort((a,b)=>b.errorRate-a.errorRate||b.wrong-a.wrong||b.attempts-a.attempts);
  const weakHtml=weakTopics.length?weakTopics.map((t,i)=>`<div class="category-card" style="margin-top:10px"><div class="category-head"><div><b>#${i+1} ${esc(t.lecture)}</b><div class="mini">${esc(t.module)} · ${esc(t.subject)} · ${t.questions} question${t.questions===1?'':'s'}</div></div><span class="pill">${t.errorRate}% weak</span></div><div class="mini" style="margin-top:8px">${t.wrong} wrong · ${t.correct} correct · ${t.attempts} attempts</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,t.errorRate)}%"></i></div></div>`).join(''):'<div class="empty">No weak topics yet. Answer some questions incorrectly to build your weakness analytics.</div>';
  const questionHtml=wrong.length?wrong.map(q=>`<div class="category-card"><div class="category-head"><b>${esc(q.question)}</b><span class="pill">${progress[key(q)].wrong} wrong</span></div><div class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)} · Correct: ${esc(q.options[q.correctIndex])}</div></div>`).join(''):'<div class="empty">No mistakes yet. Great work.</div>';
  const body=`<div class="card"><div class="category-head"><div><strong>Weak topics</strong><div class="mini">Topics are ranked from most weak to least weak using wrong answers ÷ attempts.</div></div><span class="pill">${weakTopics.length} topics</span></div>${weakHtml}</div>
  <div class="card" style="margin-top:16px"><div class="category-head"><strong>${wrong.length} questions in your mistakes bank</strong><span class="mini">Wrong answers are retained locally.</span></div><div style="margin-top:14px">${questionHtml}</div>${wrong.length?`<div class="actions" style="margin-top:16px"><button class="btn primary" onclick="startExam(bank.filter(q=>progress[key(q)]&&progress[key(q)].wrong>0))">Practice Mistakes</button></div>`:''}</div>`;
  document.getElementById('app').innerHTML=layout('Mistakes','Review incorrect questions and see your weakest topics ranked first.',body);
}

let bankPage=0;
const BANK_PAGE_SIZE=500;
function filterBank(resetPage=true){
  const s=(document.getElementById('bankSearch')?.value||'').toLowerCase(),mod=document.getElementById('bankModule')?.value||'',subj=document.getElementById('bankSubject')?.value||'',lect=document.getElementById('bankLecture')?.value||'',src=document.getElementById('bankSource')?.value||'';
  if(resetPage) bankPage=0;
  const list=bank.filter(q=>(!s||[q.id,q.question,q.subject,q.module,q.lecture].join(' ').toLowerCase().includes(s))&&(!mod||q.module===mod)&&(!subj||q.subject===subj)&&(!lect||q.lecture===lect)&&(!src||q.source===src));
  const rows=document.getElementById('bankRows');if(!rows)return;
  const totalPages=Math.max(1,Math.ceil(list.length/BANK_PAGE_SIZE));
  if(bankPage>=totalPages) bankPage=totalPages-1;
  const start=bankPage*BANK_PAGE_SIZE;
  const pageRows=list.slice(start,start+BANK_PAGE_SIZE);
  rows.innerHTML=pageRows.map(q=>`<tr><td><b>${esc(q.id)}</b></td><td>${esc(q.module)}</td><td>${esc(q.subject)}</td><td>${esc(q.lecture)}</td><td>${esc(q.question)}</td><td>${progressFor([q])}% · ${accuracyFor([q])}% acc.</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching questions.</td></tr>';
  const table=rows.closest('.table-wrap');
  if(table){
    let pager=document.getElementById('bankPager');
    if(!pager){ pager=document.createElement('div'); pager.id='bankPager'; pager.className='actions'; table.parentElement.appendChild(pager); }
    pager.innerHTML=`<span class="mini">Showing ${list.length?start+1:0}–${Math.min(start+BANK_PAGE_SIZE,list.length)} of ${list.length} matching questions</span><button class="btn" ${bankPage<=0?'disabled':''} onclick="bankPage--;filterBank(false)">Previous</button><span class="mini">Page ${bankPage+1} / ${totalPages}</span><button class="btn" ${bankPage>=totalPages-1?'disabled':''} onclick="bankPage++;filterBank(false)">Next</button>`;
  }
}

function adminPrintSource(){
  return (allQuestionBank.length?allQuestionBank:bank).filter(q=>q && q.question && Array.isArray(q.options) && q.options.length);
}
function adminPrintUnique(field, filters={}){
  const rows=adminPrintSource().filter(q=>Object.entries(filters).every(([k,v])=>!v||String(q[k]||'')===String(v)));
  return [...new Set(rows.map(q=>String(q[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
}
function fillAdminPrintSelect(id, values, selected=''){
  const el=document.getElementById(id); if(!el)return;
  el.innerHTML='<option value="">'+(id==='printModule'?'All modules':id==='printSubject'?'All subjects':'All lectures')+'</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(values.includes(selected)) el.value=selected;
}
function updateAdminPrintFilters(){
  const module=document.getElementById('printModule')?.value||'';
  const subject=document.getElementById('printSubject')?.value||'';
  const lecture=document.getElementById('printLecture')?.value||'';
  const subjects=adminPrintUnique('subject',{module});
  const lectures=adminPrintUnique('lecture',{module,subject});
  fillAdminPrintSelect('printSubject',subjects,subject);
  fillAdminPrintSelect('printLecture',lectures,lecture);
  const selectedModule=document.getElementById('printModule')?.value||'';
  const selectedSubject=document.getElementById('printSubject')?.value||'';
  const selectedLecture=document.getElementById('printLecture')?.value||'';
  const rows=adminPrintSource().filter(q=>(!selectedModule||q.module===selectedModule)&&(!selectedSubject||q.subject===selectedSubject)&&(!selectedLecture||q.lecture===selectedLecture));
  const count=document.getElementById('adminPrintCount');
  if(count) count.textContent=`${rows.length} question${rows.length===1?'':'s'} selected · grouped automatically by Module → Subject → Lecture`;
  if(!document.getElementById('printModule')?.dataset.ready){
    const modules=adminPrintUnique('module');
    fillAdminPrintSelect('printModule',modules,selectedModule);
    document.getElementById('printModule').dataset.ready='1';
  }
}
function resetAdminPrintFilters(){
  const m=document.getElementById('printModule'),s=document.getElementById('printSubject'),l=document.getElementById('printLecture');
  if(m)m.value=''; if(s)s.value=''; if(l)l.value='';
  updateAdminPrintFilters();
}
function adminPrintEscapeHTML(v){return esc(v==null?'':String(v));}
function adminPrintCleanOption(value,index){
  const raw=String(value==null?'':value).trim();
  // Question-bank imports may already contain A./B./C. prefixes. Do not print
  // those prefixes twice when the PDF renderer adds its own option labels.
  const expected=String.fromCharCode(65+index);
  const stripped=raw.replace(/^[A-Ea-e][\.)]\s*/,'').trim();
  return stripped || raw;
}
function adminPrintOptionLines(q){
  return q.options.map((o,i)=>`<div class="medex-print-opt"><b>${String.fromCharCode(65+i)}.</b> ${adminPrintEscapeHTML(adminPrintCleanOption(o,i))}</div>`).join('');
}
function adminPrintQuestionBlock(q,showAnswers,showExplanations,number){
  const answer=showAnswers?`<div class="medex-print-answer">${String.fromCharCode(65+(Number(q.correctIndex)||0))}</div>`:'';
  return `<article class="medex-print-q"><div class="medex-print-qbody"><div class="medex-print-qtext"><span class="medex-print-qnum">${number}.</span> ${adminPrintEscapeHTML(q.question)}</div>${adminPrintOptionLines(q)}${showExplanations&&q.explanation?`<div class="medex-print-expl"><b>Explanation:</b> ${adminPrintEscapeHTML(q.explanation)}</div>`:''}</div>${answer}</article>`;
}
function adminPrintChunkQuestions(rows,showAnswers,showExplanations){
  // v41.15: A4 landscape, two-column reference-style packing. The browser print CSS
  // keeps each question indivisible; this conservative weight only decides where a
  // new physical page starts before the two-column CSS flow takes over.
  const pages=[]; let page=[]; let weight=0; const LIMIT=150;
  rows.forEach(q=>{
    const text=String(q.question||'').length + q.options.reduce((n,o)=>n+String(o||'').length,0);
    const w=Math.max(8,Math.ceil(text/105)) + (showExplanations&&q.explanation?5:0);
    if(page.length && weight+w>LIMIT){pages.push(page);page=[];weight=0;}
    page.push(q);weight+=w;
  });
  if(page.length)pages.push(page);
  return pages;
}

function printAdminQuestionBankPDF(){
  if(!isAdmin){toast('Admin access required.','error');return;}
  const source=adminPrintSource();
  const module=document.getElementById('printModule')?.value||'';
  const subject=document.getElementById('printSubject')?.value||'';
  const lecture=document.getElementById('printLecture')?.value||'';
  const showAnswers=document.getElementById('printAnswers')?.checked!==false;
  const showExplanations=document.getElementById('printExplanations')?.checked===true;
  const rows=source.filter(q=>(!module||q.module===module)&&(!subject||q.subject===subject)&&(!lecture||q.lecture===lecture));
  if(!rows.length){toast('No questions match the selected Module / Subject / Lecture.','error');return;}

  const groups=[]; const groupMap=new Map();
  rows.slice().sort((a,b)=>String(a.module).localeCompare(String(b.module),undefined,{numeric:true})||String(a.subject).localeCompare(String(b.subject),undefined,{numeric:true})||String(a.lecture).localeCompare(String(b.lecture),undefined,{numeric:true})||String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).forEach(q=>{
    const key=`${q.module}|||${q.subject}|||${q.lecture}`;
    if(!groupMap.has(key)){const g={module:q.module||'Uncategorised',subject:q.subject||'General',lecture:q.lecture||'General',rows:[]};groupMap.set(key,g);groups.push(g);}
    groupMap.get(key).rows.push(q);
  });

  const total=rows.length;
  const printCSS=`
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#fff;color:#101826;font-family:Arial,Helvetica,sans-serif}
    body{font-size:9pt}
    .medex-print-page{page-break-after:always;break-after:page;position:relative;width:297mm;height:210mm;padding:6mm 8mm 7mm;background:#fff;color:#101826;display:flex;flex-direction:column;overflow:hidden}
    .medex-print-page:last-child{page-break-after:auto;break-after:auto}
    .medex-print-page.continuation-page{padding-top:5.5mm}
    .medex-print-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:5mm;border-bottom:1.2px solid #0c7c8c;padding-bottom:2.2mm;margin-bottom:1.8mm;flex:0 0 auto}
    .medex-print-brand{font-family:Georgia,'Times New Roman',serif;font-size:17pt;font-weight:700;color:#101826;line-height:1}
    .medex-print-brand.small{font-family:Arial,sans-serif;font-size:6.8pt;font-weight:400;color:#5b6b72;margin-top:1mm}
    .medex-print-title{font-family:Arial,sans-serif;font-size:11pt;font-weight:800;text-align:center;color:#101826;line-height:1.05}
    .medex-print-title span{display:block;font-size:7.5pt;font-weight:700;color:#0c7c8c;margin-top:1mm}
    .medex-print-meta{font-family:Arial,sans-serif;font-size:7.2pt;line-height:1.25;color:#5b6b72;text-align:right}
    .medex-print-meta b{color:#101826}
    .medex-print-topic{display:flex;align-items:center;justify-content:center;gap:2mm;padding:1.2mm 3mm;margin:0 0 2.2mm;border:1px solid rgba(12,124,140,.28);border-radius:3mm;background:#eaf5f5;color:#095f6c;font-size:8.6pt;font-weight:800;line-height:1.1;flex:0 0 auto;letter-spacing:.02em}
    .medex-print-questions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4mm;flex:1;min-height:0;align-items:stretch}
    .medex-print-column{min-width:0;display:flex;flex-direction:column;gap:1.35mm;min-height:0;align-content:flex-start}
    .medex-print-q{--qscale:1;display:grid;grid-template-columns:minmax(0,1fr) 9mm;width:100%;border:1px solid #b9c5c7;background:#fff;break-inside:avoid;page-break-inside:avoid;margin:0;flex:0 0 auto}
    .medex-print-qbody{padding:calc(1.65mm * var(--qscale)) calc(2.15mm * var(--qscale))}
    .medex-print-qtext{font-family:Arial,sans-serif;font-size:calc(8.05pt * var(--qscale));line-height:1.16;font-weight:700;margin-bottom:calc(.95mm * var(--qscale));color:#101826}
    .medex-print-qnum{font-weight:800;color:#0c7c8c}
    .medex-print-opt{font-family:Arial,sans-serif;font-size:calc(7.25pt * var(--qscale));line-height:1.12;margin:calc(.48mm * var(--qscale)) 0;padding-left:calc(.7mm * var(--qscale));color:#263238}
    .medex-print-answer{border-left:1px solid #b9c5c7;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:calc(9.2pt * var(--qscale));font-weight:800;color:#095f6c;background:#eef7f7;min-height:100%}
    .medex-print-expl{font-family:Arial,sans-serif;font-size:calc(6.5pt * var(--qscale));line-height:1.12;color:#5b6b72;margin-top:calc(1mm * var(--qscale));border-top:1px dashed #c9d1d3;padding-top:calc(.9mm * var(--qscale))}
    .medex-print-footer{margin-top:1.6mm;border-top:1px solid #c9d1d3;padding-top:1.5mm;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4mm;font-family:Arial,sans-serif;font-size:6.4pt;color:#5b6b72;flex:0 0 auto}
    .medex-print-footer .sig{font-weight:800;color:#0c7c8c}
    .medex-print-footer .page-number{text-align:center;font-size:8.5pt;font-weight:800;color:#101826}
    .medex-print-footer .context{text-align:right}
    .medex-print-q.compact .medex-print-qbody{padding:calc(1.25mm * var(--qscale)) calc(1.8mm * var(--qscale))}
    .medex-print-q.compact .medex-print-qtext{font-size:calc(7.35pt * var(--qscale));line-height:1.08;margin-bottom:calc(.75mm * var(--qscale))}
    .medex-print-q.compact .medex-print-opt{font-size:calc(6.65pt * var(--qscale));line-height:1.05;margin:calc(.35mm * var(--qscale)) 0}
    .medex-print-q.compact .medex-print-answer{font-size:calc(8.4pt * var(--qscale))}
    @page{size:A4 landscape;margin:0}
  `;

  const w=window.open('', '_blank');
  if(!w){toast('Please allow pop-ups for MedEx to create the printable PDF.','error');return;}

  const block=(q,n,compact=false,scale=1)=>{
    const safeScale=Math.max(.75,Math.min(1.85,Number(scale)||1));
    const html=adminPrintQuestionBlock(q,showAnswers,showExplanations,n).replace('<article class="medex-print-q"',`<article class="medex-print-q${compact?' compact':''}" style="--qscale:${safeScale}"`);
    return html;
  };
  const skeleton=(g)=>`<section class="medex-print-page" id="measurePage">
    <header class="medex-print-header">
      <div><div class="medex-print-brand">MedEx</div><div class="medex-print-brand small">Medical Examination Platform</div></div>
      <div class="medex-print-title">Question book<span>${adminPrintEscapeHTML(g.lecture)}</span></div>
      <div class="medex-print-meta"><b>Module:</b> ${adminPrintEscapeHTML(g.module)}<br><b>Subject:</b> ${adminPrintEscapeHTML(g.subject)}<br><b>Lecture:</b> ${adminPrintEscapeHTML(g.lecture)}</div>
    </header>
    <div class="medex-print-topic">${adminPrintEscapeHTML(g.lecture)}</div>
    <div class="medex-print-questions"><div class="medex-print-column" id="measureLeft"></div><div class="medex-print-column" id="measureRight"></div></div>
    <footer class="medex-print-footer"><div><span class="sig">MedEx — Medical Examination Platform</span><br>Official Question Book · ${total} questions</div><div class="page-number">1</div><div class="context">Module: ${adminPrintEscapeHTML(g.module)} · Subject: ${adminPrintEscapeHTML(g.subject)} · Lecture: ${adminPrintEscapeHTML(g.lecture)}</div></footer>
  </section>`;

  try{
    w.document.open();
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedEx Question book</title><style>${printCSS}</style></head><body>${skeleton(groups[0])}</body></html>`);
    w.document.close();

    const paginate=()=>{
      try{
        const measurePage=w.document.getElementById('measurePage');
        const measureCols=[w.document.getElementById('measureLeft'),w.document.getElementById('measureRight')];
        if(!measurePage||!measureCols[0])throw new Error('Print measurement page was not created.');
        const pageHeight=measurePage.getBoundingClientRect().height;
        const header=measurePage.querySelector('.medex-print-header')?.getBoundingClientRect().height||0;
        const topic=measurePage.querySelector('.medex-print-topic')?.getBoundingClientRect().height||0;
        const footer=measurePage.querySelector('.medex-print-footer')?.getBoundingClientRect().height||0;
        const questionsTop=measurePage.querySelector('.medex-print-questions')?.getBoundingClientRect().top||0;
        const pagePaddingTop=parseFloat(w.getComputedStyle(measurePage).paddingTop)||0;
        const safety=5/25.4*96;
        const footerGap=1.6/25.4*96;
        const continuationTop=pagePaddingTop;
        const firstQuestionsTop=questionsTop;
        const usableFirst=Math.max(100,pageHeight-firstQuestionsTop-footer-footerGap-safety);
        const usableContinuation=Math.max(100,pageHeight-continuationTop-footer-footerGap-safety);
        const gap=1.35/25.4*96;
        const colWidth=measureCols[0].getBoundingClientRect().width;

        const measureQuestion=(q,n,compact=false,scale=1)=>{
          const holder=w.document.createElement('div');
          holder.className='medex-print-column';
          holder.style.position='absolute';holder.style.left='-100000px';holder.style.top='0';holder.style.width=colWidth+'px';holder.style.visibility='hidden';holder.style.pointerEvents='none';
          holder.innerHTML=block(q,n,compact,scale);
          w.document.body.appendChild(holder);
          const h=holder.firstElementChild?.getBoundingClientRect().height||0;
          holder.remove();
          return h;
        };

        const fitQuestion=(q,n,available)=>{
          let compact=false;
          let h=measureQuestion(q,n,false,1);
          if(h>available){compact=true;h=measureQuestion(q,n,true,1);}
          let extraScale=1;
          if(h>available){
            for(let scale=.96;scale>=.60;scale-=.04){
              h=measureQuestion(q,n,true,scale);
              if(h<=available){extraScale=Number(scale.toFixed(2));break;}
            }
          }
          return {compact,extraScale,h};
        };

        // Enlarge each completed page so its question columns use the available A4 height.
        // The scale is applied to the question typography/padding itself, so measured height stays accurate.
        const enlargePage=(p,usable)=>{
          const all=[...p.left,...p.right];
          if(!all.length)return;
          let scale=1;
          // Start conservatively, then measure the complete columns at progressively larger scales.
          for(let candidate=1.05;candidate<=1.85;candidate+=.05){
            let leftH=0,rightH=0;
            p.left.forEach((x,i)=>{leftH+=measureQuestion(x.q,x.number,x.compact,candidate)+(i?gap:0)});
            p.right.forEach((x,i)=>{rightH+=measureQuestion(x.q,x.number,x.compact,candidate)+(i?gap:0)});
            const maxH=Math.max(leftH,rightH);
            if(maxH<=usable-2){scale=Number(candidate.toFixed(2));}else break;
          }
          p.left.forEach(x=>x.extraScale=scale);
          p.right.forEach(x=>x.extraScale=scale);
        };

        const finalPages=[];
        groups.forEach(g=>{
          let number=0;
          let page={g,left:[],right:[],lh:0,rh:0,first:true};
          const commit=()=>{
            if(page.left.length||page.right.length){
              const usable=page.first?usableFirst:usableContinuation;
              enlargePage(page,usable);
              finalPages.push(page);
            }
            page={g,left:[],right:[],lh:0,rh:0,first:false};
          };

          g.rows.forEach(q=>{
            const item={q,number:++number};
            let placed=false;
            // Target the reference layout: 4–5 complete questions per column.
            // Never exceed five, and never place a question unless its full box fits.
            for(const colIndex of [0,1]){
              const list=colIndex===0?page.left:page.right;
              const used=colIndex===0?page.lh:page.rh;
              const usable=page.first?usableFirst:usableContinuation;
              if(list.length>=5)continue;
              const available=Math.max(40,usable-used-(list.length?gap:0));
              const fit=fitQuestion(q,item.number,available);
              const need=fit.h+(list.length?gap:0);
              if(need<=available+0.5){
                list.push({...item,compact:fit.compact,extraScale:fit.extraScale});
                if(colIndex===0)page.lh+=need; else page.rh+=need;
                placed=true;
                break;
              }
            }
            if(!placed){
              commit();
              const usable=usableContinuation;
              const fit=fitQuestion(q,item.number,usable);
              page.left.push({...item,compact:fit.compact,extraScale:fit.extraScale});
              page.lh+=fit.h;
            }
          });
          commit();
        });

        const output=finalPages.map((p,idx)=>{
          const showLectureHeader=p.first;
          return `<section class="medex-print-page ${showLectureHeader?'lecture-start':'continuation-page'}">
          ${showLectureHeader?`<header class="medex-print-header">
            <div><div class="medex-print-brand">MedEx</div><div class="medex-print-brand small">Medical Examination Platform</div></div>
            <div class="medex-print-title">Question book<span>${adminPrintEscapeHTML(p.g.lecture)}</span></div>
            <div class="medex-print-meta"><b>Module:</b> ${adminPrintEscapeHTML(p.g.module)}<br><b>Subject:</b> ${adminPrintEscapeHTML(p.g.subject)}<br><b>Lecture:</b> ${adminPrintEscapeHTML(p.g.lecture)}</div>
          </header><div class="medex-print-topic">${adminPrintEscapeHTML(p.g.lecture)}</div>`:''}
          <div class="medex-print-questions"><div class="medex-print-column">${p.left.map(x=>block(x.q,x.number,x.compact,x.extraScale||1)).join('')}</div><div class="medex-print-column">${p.right.map(x=>block(x.q,x.number,x.compact,x.extraScale||1)).join('')}</div></div>
          <footer class="medex-print-footer"><div><span class="sig">MedEx — Medical Examination Platform</span><br>Official Question Book · ${total} questions</div><div class="page-number">${idx+1}</div><div class="context">Module: ${adminPrintEscapeHTML(p.g.module)} · Subject: ${adminPrintEscapeHTML(p.g.subject)} · Lecture: ${adminPrintEscapeHTML(p.g.lecture)}</div></footer>
        </section>`;
        }).join('');
        w.document.body.innerHTML=output;
        setTimeout(()=>{w.focus();w.print();},350);
      }catch(e){
        console.error('Question book pagination error:',e);
        toast('Could not prepare the question book print layout.','error');
        try{w.close();}catch(_){}
      }
    };
    if(w.document.readyState==='complete')setTimeout(paginate,400);else w.addEventListener('load',()=>setTimeout(paginate,250),{once:true});
  }catch(e){
    console.error('Print window error:',e);
    try{w.close();}catch(_){}
    toast('Could not prepare the printable question book.','error');
  }
}

async function uploadQuestionImage(file,questionId){
  const ext=(file.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';
  const path=`${String(questionId).replace(/[^a-zA-Z0-9_-]/g,'_')}-${Date.now()}.${ext}`;
  const {error}=await supabaseClient.storage.from('question-images').upload(path,file,{cacheControl:'31536000',upsert:false,contentType:file.type});
  if(error)throw error;
  const {data}=supabaseClient.storage.from('question-images').getPublicUrl(path);
  if(!data?.publicUrl)throw new Error('Could not create public image URL.');
  return data.publicUrl;
}

async function addBuiltInQuestion(){
  if(!(await requireAdmin())) return;
  const q=normalizeQuestion({
    id:document.getElementById('newQId').value,
    module:document.getElementById('newQModule').value,
    subject:document.getElementById('newQSubject').value,
    lecture:document.getElementById('newQLecture').value,
    question:document.getElementById('newQText').value,
    options:[
      document.getElementById('newQOpt0').value,
      document.getElementById('newQOpt1').value,
      document.getElementById('newQOpt2').value,
      document.getElementById('newQOpt3').value
    ],
    correctIndex:Number(document.getElementById('newQCorrect').value),
    explanation:document.getElementById('newQExplanation').value,
    imageUrl:document.getElementById('newQImageUrl').value
  });

  const error=validateQuestion(q,0);
  if(error){toast('Cannot add question: '+error,'error');return}
  if(bank.some(x=>x.id===q.id) || localQuestions.some(x=>x.id===q.id)){
    toast('A question with this ID already exists. Use a unique ID.','error');return;
  }
  const imageFile=document.getElementById('newQImageFile')?.files?.[0];
  if(imageFile){
    if(!/^image\/(png|jpe?g|webp|gif)$/i.test(imageFile.type)){toast('Please choose a PNG, JPG, WEBP, or GIF image.','error');return;}
    if(imageFile.size>5*1024*1024){toast('Image must be 5 MB or smaller.','error');return;}
    if(!SUPABASE_ENABLED){toast('Image upload requires Supabase.','error');return;}
    try{ q.imageUrl=await uploadQuestionImage(imageFile,q.id); }catch(e){toast('Image upload failed: '+e.message,'error');return;}
  }

  q.source=SUPABASE_ENABLED && currentUser ? 'Supabase' : 'Built in';

  if(SUPABASE_ENABLED && currentUser){
    const {error}=await supabaseClient.from('questions').insert({
      id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,
      question:q.question,options:q.options,correct_index:q.correctIndex,
      explanation:q.explanation,difficulty:q.difficulty||null,reference:q.reference||null,image_url:q.imageUrl||null
    });
    if(error){toast('Could not save to Supabase: '+error.message,'error');return;}
    bank.push(q);
    clearQuestionForm();
    await loadQuestionsFromSupabase();
    await loadGlobalAnalytics();
    render();
    toast(`Question "${q.id}" added to the shared database.`,'ok');
    return;
  }

  localQuestions.push(q);
  bank.push(q);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  clearQuestionForm();
  render();
  toast(`Question "${q.id}" added locally. Sign in to Supabase to make it available to everyone.`,'ok');
}

function getImportList(data){

function showImportPreview(data){
  const list=getImportList(data);
  const preview=document.getElementById('importPreview');
  if(!preview)return;
  pendingImportQuestions=[];
  if(!list){
    preview.innerHTML='<div class="notice error">JSON must be an array of questions, or an object containing a <b>questions</b> array.</div>';
    toast('The JSON structure is not supported.','error');
    return;
  }
  const normalized=list.map((q,i)=>normalizeQuestion(q, 'JSON upload'));
  const errors=validateBank(list);
  pendingImportQuestions=normalized;
  const duplicateIds=[]; const seen=new Set();
  normalized.forEach(q=>{if(seen.has(q.id))duplicateIds.push(q.id);seen.add(q.id);});
  const allErrors=[...errors];
  if(duplicateIds.length) allErrors.push(`Duplicate ID(s) inside this JSON: ${[...new Set(duplicateIds)].slice(0,20).join(', ')}`);
  const existingIds=new Set(bank.map(q=>q.id));
  const updates=normalized.filter(q=>existingIds.has(q.id)).length;
  const additions=normalized.length-updates;
  const errorHtml=allErrors.length
    ? `<div class="notice error"><b>Fix these problems before uploading:</b><div style="white-space:pre-wrap;margin-top:6px">${esc(allErrors.slice(0,30).join('\n'))}</div>${allErrors.length>30?`<div class="mini" style="margin-top:6px">Showing the first 30 errors.</div>`:''}</div>`
    : '<div class="notice ok"><b>Validation passed.</b> The questions are ready to upload.</div>';
  const cards=normalized.slice(0,20).map((q,i)=>`<div class="category-card"><div class="category-head"><div><b>${esc(q.id||`Question ${i+1}`)}</b><div class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</div></div><span class="pill">Correct: ${String.fromCharCode(65+(Number(q.correctIndex)||0))}</span></div><div style="margin-top:7px">${esc(q.question)}</div><div class="mini" style="margin-top:6px">A. ${esc(q.options?.[0]||'')} · B. ${esc(q.options?.[1]||'')} · C. ${esc(q.options?.[2]||'')} · D. ${esc(q.options?.[3]||'')}</div></div>`).join('');
  preview.innerHTML=`<div class="category-head"><h3 style="margin:0">JSON Preview</h3><span class="pill">${normalized.length} question${normalized.length===1?'':'s'}</span></div><div class="mini" style="margin:8px 0 12px">${additions} new · ${updates} existing ID${updates===1?'':'s'} will be updated · ${allErrors.length} validation error${allErrors.length===1?'':'s'}</div>${errorHtml}<div class="mini" style="margin:14px 0 8px">Showing ${Math.min(20,normalized.length)} of ${normalized.length} questions.</div>${cards||'<div class="empty">The JSON array is empty.</div>'}${!allErrors.length&&normalized.length?`<div class="actions" style="margin-top:14px"><button class="btn primary" onclick="uploadPreviewToSupabase()">Upload ${normalized.length} to Supabase</button><button class="btn" onclick="addPreviewQuestions(pendingImportQuestions)">Add to this browser</button><button class="btn" onclick="replaceWithPreviewBank(pendingImportQuestions)">Use as browser preview</button></div>`:''}`;
}
async function uploadPreviewToSupabase(){
  if(!(await requireAdmin())) return;
  if(!currentUser || !SUPABASE_ENABLED){toast('Sign in to an administrator account first.','error');return;}
  if(!pendingImportQuestions.length){toast('Preview the JSON first.','error');return;}
  const errors=validateBank(pendingImportQuestions);
  if(errors.length){toast('Fix the validation errors before uploading.','error');return;}
  const rows=pendingImportQuestions.map(q=>({
    id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,
    question:q.question,options:q.options,correct_index:q.correctIndex,
    explanation:q.explanation||'',difficulty:q.difficulty||null,reference:q.reference||null,image_url:q.imageUrl||null
  }));
  const {error}=await supabaseClient.from('questions').upsert(rows,{onConflict:'id'});
  if(error){toast('Supabase upload failed: '+error.message,'error');return;}
  await loadQuestionsFromSupabase();
  await loadGlobalAnalytics();
  toast(`Uploaded ${rows.length} question${rows.length===1?'':'s'} to Supabase. Existing IDs were updated.`,'ok');
  pendingImportQuestions=[];
  render();
}

function addPreviewQuestions(list){
  const errors=validateBank(list);if(errors.length){toast('Cannot add invalid questions.','error');return}
  const existing=new Set(bank.map(q=>q.id));
  const added=[];
  for(const raw of list){
    const q=normalizeQuestion(raw,'Built in');
    if(existing.has(q.id))continue;
    existing.add(q.id);added.push(q);
  }
  if(!added.length){toast('No new questions were added. IDs already exist.','error');return}
  localQuestions.push(...added);
  bank.push(...added);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast(`Added ${added.length} new question${added.length===1?'':'s'} to this browser.`,'ok');
}
function replaceWithPreviewBank(list){
  const errors=validateBank(list);if(errors.length){toast('Cannot use invalid bank.','error');return}
  bank=list;sourceFiles=['local preview'];lastSync=new Date();
  localQuestions=list.filter(q=>q.source==='Built in');
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();toast(`Loaded ${bank.length} preview questions in this browser.`,'ok');
}

let supportChatState={open:false,conversationId:null,messages:[],busy:false,pollId:null};
let supportAdminState={conversationId:null,messages:[],conversations:[],busy:false,pollId:null};
function supportStorageKey(){
  return CONFIG.supportChatKey+'_'+(currentUser?.id||getVisitorId());
}
function saveSupportLocal(){
  try{ localStorage.setItem(supportStorageKey(),JSON.stringify({conversationId:supportChatState.conversationId,messages:supportChatState.messages.slice(-200)})); }catch(e){ console.warn('Support chat local save failed:',e.message); }
}
function loadSupportLocal(){
  supportChatState.conversationId=null;
  supportChatState.messages=[];
  const saved=loadJSON(supportStorageKey(),null);
  if(saved){ supportChatState.conversationId=saved.conversationId||null; supportChatState.messages=Array.isArray(saved.messages)?saved.messages:[]; }
}
function supportMessageHTML(m,adminView=false){
  const isAdmin=String(m.sender_type||'')==='admin';
  return `<div class="support-chat-msg ${isAdmin?'admin':'user'}">${esc(m.message||'')}<div class="support-chat-meta">${isAdmin?'MedEx team':'You'} · ${m.created_at?new Date(m.created_at).toLocaleString():''}</div></div>`;
}
async function openSupportChat(){
  if(document.getElementById('supportChatBackdrop')) return;
  supportChatState.open=true; supportChatState.busy=false; loadSupportLocal();
  document.body.insertAdjacentHTML('beforeend',`<div class="support-chat-backdrop" id="supportChatBackdrop" onclick="if(event.target===this)closeSupportChat()"><div class="support-chat" role="dialog" aria-modal="true" aria-label="Contact MedEx team"><div class="support-chat-head"><div><strong>Contact MedEx team</strong><div class="mini">Suggestions, complaints, and support</div></div><button class="icon-btn" onclick="closeSupportChat()" aria-label="Close chat">×</button></div><div class="support-chat-log" id="supportChatLog"></div><div class="support-chat-compose"><textarea id="supportChatInput" placeholder="Write your message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendSupportMessage();}"></textarea><button class="btn primary" id="supportChatSend" onclick="sendSupportMessage()">Send</button></div></div></div>`);
  renderSupportChatLog();
  if(SUPABASE_ENABLED){
    await ensureSupportConversation();
    await refreshSupportChat();
    markSupportRead(supportChatState.messages);
    updateSupportUnreadDot(false);
    clearInterval(supportChatState.pollId);
    supportChatState.pollId=setInterval(refreshSupportChat,10000);
  }
  setTimeout(()=>document.getElementById('supportChatInput')?.focus(),0);
}
function closeSupportChat(){
  clearInterval(supportChatState.pollId); supportChatState.pollId=null; supportChatState.open=false;
  document.getElementById('supportChatBackdrop')?.remove();
  saveSupportLocal();
}
function renderSupportChatLog(){
  const el=document.getElementById('supportChatLog'); if(!el)return;
  el.innerHTML=supportChatState.messages.length?supportChatState.messages.map(m=>supportMessageHTML(m)).join(''):`<div class="empty" style="padding:30px 10px;text-align:center">Start a conversation with the MedEx team. Your chat history is saved in this browser.</div>`;
  el.scrollTop=el.scrollHeight;
}
async function ensureSupportConversation(){
  if(!SUPABASE_ENABLED)return null;
  const visitorId=currentUser?null:getVisitorId();
  const {data,error}=await supabaseClient.rpc('support_get_or_create_conversation',{p_visitor_id:visitorId});
  if(error){toast('Could not open MedEx chat: '+error.message,'error');return null;}
  supportChatState.conversationId=typeof data==='string'?data:data?.id||null;
  saveSupportLocal();
  return supportChatState.conversationId;
}
async function refreshSupportChat(){
  if(!SUPABASE_ENABLED||!supportChatState.conversationId)return;
  const visitorId=currentUser?null:getVisitorId();
  const {data,error}=await supabaseClient.rpc('support_get_messages',{p_conversation_id:supportChatState.conversationId,p_visitor_id:visitorId});
  if(error){console.warn('Support chat load failed:',error.message);return;}
  supportChatState.messages=Array.isArray(data)?data:[]; saveSupportLocal(); renderSupportChatLog();
}
async function sendSupportMessage(){
  if(supportChatState.busy)return;
  const input=document.getElementById('supportChatInput'); const message=(input?.value||'').trim();
  if(!message)return;
  if(!SUPABASE_ENABLED){toast('Contact chat requires Supabase connection.','error');return;}
  supportChatState.busy=true; const btn=document.getElementById('supportChatSend'); if(btn)btn.disabled=true;
  if(!supportChatState.conversationId) await ensureSupportConversation();
  if(!supportChatState.conversationId){supportChatState.busy=false;if(btn)btn.disabled=false;return;}
  const visitorId=currentUser?null:getVisitorId();
  const {data,error}=await supabaseClient.rpc('support_send_message',{p_conversation_id:supportChatState.conversationId,p_visitor_id:visitorId,p_message:message});
  if(error){toast('Could not send message: '+error.message,'error');}
  else { if(input)input.value=''; if(data) supportChatState.messages.push(data); saveSupportLocal(); renderSupportChatLog(); }
  supportChatState.busy=false; if(btn)btn.disabled=false;
}

  document.getElementById('app').innerHTML=layout('Replies','Reply to suggestions, complaints, and support messages.',body);

async function callAI(contents, generationConfig, overrideSettings=null){
  let res, data;
  const headers={'Content-Type':'application/json'};
  const requestSettings=overrideSettings||aiSettings;
  if(requestSettings.accessCode) headers['x-access-code']=requestSettings.accessCode;
  try{
    res=await fetch('/api/ai',{
      method:'POST',
      headers,
      body:JSON.stringify({
        provider:requestSettings.provider||'groq',
        model:requestSettings.model,
        contents,
        generationConfig
      })
    });
  }catch(e){
    throw new Error('Could not reach the AI service. Check your connection.');
  }
  try{ data=await res.json(); }catch(e){ data=null; }
  if(!res.ok){
    throw new Error((data&&data.error)||`HTTP ${res.status} from the AI service.`);
  }
  const text=data&&data.text;
  if(!text) throw new Error(`${aiProviderLabel(requestSettings.provider)} returned an empty response.`);
  if(data?.provider && data.provider !== aiProviderLabel(requestSettings.provider)){
    toast(`Gemini was temporarily unavailable. MedEx automatically switched to ${data.provider}${data.model?` · ${data.model}`:''}.`,'ok');
  }else if(data?.fallbackUsed){
    toast(`MedEx automatically switched from ${requestSettings.model} to ${data.model||'another Gemini model'}.`,'ok');
  }
  return text;
}

function formatAIChatReply(reply){
  let text=String(reply||'').trim();
  if(!text)return text;
  // Remove accidental markdown code fences around a response.
  text=text.replace(/^```(?:json|text|plaintext)?\s*/i,'').replace(/\s*```$/,'').trim();
  try{
    const parsed=JSON.parse(text);
    if(typeof parsed==='string') return parsed.trim();
    if(Array.isArray(parsed)){
      return parsed.map((item,i)=>{
        if(typeof item==='string') return `• ${item}`;
        if(item && typeof item==='object'){
          const parts=[];
          if(item.question) parts.push(`Question: ${item.question}`);
          if(item.answer) parts.push(`Answer: ${item.answer}`);
          if(item.explanation) parts.push(`Explanation: ${item.explanation}`);
          if(item.text) parts.push(item.text);
          if(!parts.length) parts.push(Object.entries(item).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n'));
          return `${i+1}. ${parts.join('\n')}`;
        }
        return String(item);
      }).join('\n\n').trim();
    }
    if(parsed && typeof parsed==='object'){
      const preferred=['answer','response','text','message','explanation','content'];
      for(const key of preferred){ if(typeof parsed[key]==='string' && parsed[key].trim()) return parsed[key].trim(); }
      return Object.entries(parsed).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n\n').trim();
    }
  }catch(e){}
  return text;
}

function parseAIQuestionJSON(text){
  let cleaned=String(text||'').trim();
  cleaned=cleaned.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();

  // First try the response exactly as returned.
  try{
    const parsed=JSON.parse(cleaned);
    if(Array.isArray(parsed)) return parsed;
    if(parsed && Array.isArray(parsed.questions)) return parsed.questions;
  }catch(_){}

  // Extract the largest complete JSON array from surrounding prose/code fences.
  const start=cleaned.indexOf('[');
  const end=cleaned.lastIndexOf(']');
  if(start!==-1 && end>start){
    const candidate=cleaned.slice(start,end+1).trim();
    try{
      const parsed=JSON.parse(candidate);
      if(Array.isArray(parsed)) return parsed;
    }catch(_){
      const repaired=candidate.replace(/,\s*([}\]])/g,'$1');
      try{
        const parsed=JSON.parse(repaired);
        if(Array.isArray(parsed)) return parsed;
      }catch(_){}
    }
  }

  // Some models return a single object for a one-question batch.
  const objStart=cleaned.indexOf('{');
  const objEnd=cleaned.lastIndexOf('}');
  if(objStart!==-1 && objEnd>objStart){
    try{
      const parsed=JSON.parse(cleaned.slice(objStart,objEnd+1));
      if(parsed && parsed.question && Array.isArray(parsed.options)) return [parsed];
    }catch(_){}
  }

  throw new Error('The AI returned invalid JSON. MedEx now uses OpenRouter structured-output routing for MCQ generation. Please retry.');
}
