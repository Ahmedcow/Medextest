function normalizeQuestionTextForDuplicate(q){
  return String(q?.question||'').toLowerCase().replace(/\s+/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').trim();
}
function getQuestionDuplicateInfo(list){
  const seen=new Map(), duplicateIndexes=new Set(), duplicateGroups=[];
  list.forEach((q,i)=>{
    const key=normalizeQuestionTextForDuplicate(q); if(!key)return;
    if(seen.has(key)){duplicateIndexes.add(i); const first=seen.get(key); let g=duplicateGroups.find(x=>x.key===key); if(!g){g={key,indices:[first]};duplicateGroups.push(g);} g.indices.push(i);} else seen.set(key,i);
  });
  const existingByText=new Map(); bank.forEach(q=>{const k=normalizeQuestionTextForDuplicate(q);if(k)existingByText.set(k,q);});
  const existingMatches=[];
  list.forEach((q,i)=>{const k=normalizeQuestionTextForDuplicate(q);const ex=existingByText.get(k);if(k&&ex&&String(ex.id)!==String(q.id))existingMatches.push({index:i,existing:ex});});
  existingMatches.forEach(x=>duplicateIndexes.add(x.index));
  return {duplicateIndexes,duplicateGroups,existingMatches};
}
function excludeDuplicateImportedQuestions(){
  if(!pendingImportQuestions.length)return;
  const info=getQuestionDuplicateInfo(pendingImportQuestions);
  if(!info.duplicateIndexes.size){toast('No duplicate questions were found.','ok');return;}
  pendingImportQuestions=pendingImportQuestions.filter((q,i)=>!info.duplicateIndexes.has(i));
  renderPendingImportPreview();
  toast(`Excluded ${info.duplicateIndexes.size} duplicate question${info.duplicateIndexes.size===1?'':'s'}.`,'ok');
}
function renderPendingImportPreview(){
  const normalized=pendingImportQuestions, preview=document.getElementById('importPreview'); if(!preview)return;
  const errors=validateBank(normalized), existingIds=new Set(bank.map(q=>q.id));
  const updates=normalized.filter(q=>existingIds.has(q.id)).length, additions=normalized.length-updates;
  const info=getQuestionDuplicateInfo(normalized);
  const errorHtml=errors.length?`<div class="notice error"><b>Fix these problems before uploading:</b><div style="white-space:pre-wrap;margin-top:6px">${esc(errors.slice(0,30).join('\n'))}</div></div>`:'<div class="notice ok"><b>Validation passed.</b> The questions are ready to upload.</div>';
  const cards=normalized.slice(0,20).map((q,i)=>`<div class="category-card"><div class="category-head"><div><b>${esc(q.id||`Question ${i+1}`)}</b><div class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</div></div><span class="pill">Correct: ${String.fromCharCode(65+(Number(q.correctIndex)||0))}</span></div><div style="margin-top:7px">${esc(q.question)}</div><div class="mini" style="margin-top:6px">A. ${esc(q.options?.[0]||'')} · B. ${esc(q.options?.[1]||'')} · C. ${esc(q.options?.[2]||'')} · D. ${esc(q.options?.[3]||'')}</div></div>`).join('');
  const dupCount=info.duplicateIndexes.size;
  preview.innerHTML=`<div class="category-head"><h3 style="margin:0">JSON Preview</h3><span class="pill">${normalized.length} question${normalized.length===1?'':'s'}</span></div><div class="mini" style="margin:8px 0 12px">${additions} new · ${updates} existing ID${updates===1?'':'s'} will be updated · ${errors.length} validation error${errors.length===1?'':'s'}</div>${dupCount?`<div class="notice error"><b>⚠ ${dupCount} duplicate question${dupCount===1?'':'s'} detected.</b><div class="mini" style="margin-top:5px">Duplicates are detected by normalized question text, including duplicates already in the current question bank.</div><button class="btn danger" style="margin-top:10px" onclick="excludeDuplicateImportedQuestions()">Exclude duplicated questions</button></div>`:''}${errorHtml}<div class="mini" style="margin:14px 0 8px">Showing ${Math.min(20,normalized.length)} of ${normalized.length} questions.</div>${cards||'<div class="empty">The JSON array is empty.</div>'}${!errors.length&&normalized.length?`<div class="actions" style="margin-top:14px"><button class="btn primary" onclick="uploadPreviewToSupabase()">Upload ${normalized.length} to Supabase</button><button class="btn" onclick="addPreviewQuestions(pendingImportQuestions)">Add to this browser</button><button class="btn" onclick="replaceWithPreviewBank(pendingImportQuestions)">Use as browser preview</button></div>`:''}`;
}

function addPreviewQuestions(list){
  const errors=validateBank(list);if(errors.length){toast('Cannot add invalid questions.','error');return}
  const existing=new Set(bank.map(q=>q.id));
  const added=[];
  for(const raw of list){
    const q=normalizeQuestion(raw,'Built in');
    if(existing.has(q.id))continue;
    existing.add(q.id);added.push(q);
  }
  if(!added.length){toast('No new questions were added. IDs already exist.','error');return}
  localQuestions.push(...added);
  bank.push(...added);
  safeSetItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  safeSetItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,questions:bank}));
  render();
  toast(`Added ${added.length} new question${added.length===1?'':'s'} to this browser.`,'ok');
}

  if(!models.some(m=>m.id===aiSettings.model)) aiSettings.model=models[0].id;
}

async function callAI(contents, generationConfig, overrideSettings=null){
  let res, data;
  const headers={'Content-Type':'application/json'};
  const requestSettings=overrideSettings||aiSettings;
  if(requestSettings.accessCode) headers['x-access-code']=requestSettings.accessCode;
  try{
    res=await fetch('/api/ai',{
      method:'POST',
      headers,
      body:JSON.stringify({
        provider:requestSettings.provider||'groq',
        model:requestSettings.model,
        contents,
        generationConfig
      })
    });
  }catch(e){
    throw new Error('Could not reach the AI service. Check your connection.');
  }
  try{ data=await res.json(); }catch(e){ data=null; }
  if(!res.ok){
    throw new Error((data&&data.error)||`HTTP ${res.status} from the AI service.`);
  }
  const text=data&&data.text;
  if(!text) throw new Error(`${aiProviderLabel(requestSettings.provider)} returned an empty response.`);
  if(data?.provider && data.provider !== aiProviderLabel(requestSettings.provider)){
    toast(`Gemini was temporarily unavailable. MedEx automatically switched to ${data.provider}${data.model?` · ${data.model}`:''}.`,'ok');
  }else if(data?.fallbackUsed){
    toast(`MedEx automatically switched from ${requestSettings.model} to ${data.model||'another Gemini model'}.`,'ok');
  }
  return text;
}

function formatAIChatReply(reply){
  let text=String(reply||'').trim();
  if(!text)return text;
  // Remove accidental markdown code fences around a response.
  text=text.replace(/^```(?:json|text|plaintext)?\s*/i,'').replace(/\s*```$/,'').trim();
  try{
    const parsed=JSON.parse(text);
    if(typeof parsed==='string') return parsed.trim();
    if(Array.isArray(parsed)){
      return parsed.map((item,i)=>{
        if(typeof item==='string') return `• ${item}`;
        if(item && typeof item==='object'){
          const parts=[];
          if(item.question) parts.push(`Question: ${item.question}`);
          if(item.answer) parts.push(`Answer: ${item.answer}`);
          if(item.explanation) parts.push(`Explanation: ${item.explanation}`);
          if(item.text) parts.push(item.text);
          if(!parts.length) parts.push(Object.entries(item).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n'));
          return `${i+1}. ${parts.join('\n')}`;
        }
        return String(item);
      }).join('\n\n').trim();
    }
    if(parsed && typeof parsed==='object'){
      const preferred=['answer','response','text','message','explanation','content'];
      for(const key of preferred){ if(typeof parsed[key]==='string' && parsed[key].trim()) return parsed[key].trim(); }
      return Object.entries(parsed).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n\n').trim();
    }
  }catch(e){}
  return text;
}

function parseAIQuestionJSON(text){
  let cleaned=String(text||'').trim();
  cleaned=cleaned.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();

  // First try the response exactly as returned.
  try{
    const parsed=JSON.parse(cleaned);
    if(Array.isArray(parsed)) return parsed;
    if(parsed && Array.isArray(parsed.questions)) return parsed.questions;
  }catch(_){}

  // Extract the largest complete JSON array from surrounding prose/code fences.
  const start=cleaned.indexOf('[');
  const end=cleaned.lastIndexOf(']');
  if(start!==-1 && end>start){
    const candidate=cleaned.slice(start,end+1).trim();
    try{
      const parsed=JSON.parse(candidate);
      if(Array.isArray(parsed)) return parsed;
    }catch(_){
      const repaired=candidate.replace(/,\s*([}\]])/g,'$1');
      try{
        const parsed=JSON.parse(repaired);
        if(Array.isArray(parsed)) return parsed;
      }catch(_){}
    }
  }

  // Some models return a single object for a one-question batch.
  const objStart=cleaned.indexOf('{');
  const objEnd=cleaned.lastIndexOf('}');
  if(objStart!==-1 && objEnd>objStart){
    try{
      const parsed=JSON.parse(cleaned.slice(objStart,objEnd+1));
      if(parsed && parsed.question && Array.isArray(parsed.options)) return [parsed];
    }catch(_){}
  }

  throw new Error('The AI returned invalid JSON. MedEx now uses OpenRouter structured-output routing for MCQ generation. Please retry.');
}

async function generateAIQuestions(){
  if(!(await requireAdmin())) return;
  if(aiBusy) return;
  const module=document.getElementById('genModule').value.trim();
  const subject=document.getElementById('genSubject').value.trim();
  const lecture=document.getElementById('genLecture').value.trim();
  const difficulty=document.getElementById('genDifficulty').value;
  const thinkingLevel=document.getElementById('genThinking')?.value||'Higher-order thinking';
  const count=Math.max(1,Math.min(100,Number(document.getElementById('genCount').value)||5));
  const sourceType=document.getElementById('genSourceType').value;
  const sourcePool=getAIGeneratorPool();

  if(!module||!subject||!lecture){toast('Select a module, subject and lecture from the website lists.','error');return;}
  if(sourceType==='website'&&!sourcePool.length){toast('No website questions exist for this exact lecture. Choose another lecture or use AI medical knowledge.','error');return;}

  const btn=document.getElementById('genBtn');
  const resultBox=document.getElementById('genResult');
  aiBusy=true;
  if(btn){btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Generating…';}

  let sourceBlock='';
  let reference=`${aiProviderLabel(aiSettings.provider)} · ${aiSettings.model} medical knowledge`;
  if(sourceType==='website'){
    const sourceQuestions=sourcePool.slice(0,80).map((q,i)=>({
      number:i+1, question:q.question, options:q.options, correctAnswer:q.options[q.correctIndex], explanation:q.explanation
    }));
    sourceBlock=`Use the following existing questions from this website as the source.
Create NEW questions that test the same lecture content. Do not copy, paraphrase, or reproduce any source question.
Website source questions:
${JSON.stringify(sourceQuestions)}`;
    reference=`Website question bank · ${sourcePool.length} questions in ${module} / ${subject} / ${lecture}`;
  } else {
    sourceBlock='Use your medical knowledge to create accurate original questions for the selected topic. Do not invent facts or cite nonexistent sources.';
  }

  // Generate in small batches. OpenRouter free/low-credit keys can reject a request
  // before generation if max output tokens exceed the remaining credit allowance.
  // Keep OpenRouter batches smaller and the requested output budget conservative.
  const batchSize=aiSettings.provider==='openrouter' ? 1 : Math.min(10,count);
  const batches=[];
  for(let n=0;n<count;n+=batchSize) batches.push(Math.min(batchSize,count-n));
  const allRaw=[];

  try{
    for(let bi=0;bi<batches.length;bi++){
      const batchCount=batches[bi];
      if(resultBox) resultBox.innerHTML=`<div class="card" style="margin-top:14px"><div class="mini">Generating batch ${bi+1} of ${batches.length} (${allRaw.length}/${count} questions completed) with ${esc(aiProviderLabel(aiSettings.provider))}…</div></div>`;

      const prompt=`You are the medical question generator for Med64, a medical examination platform.
Generate exactly ${batchCount} original multiple-choice questions for medical students.
Module: ${module}
Subject: ${subject}
Lecture: ${lecture}
Difficulty: ${difficulty}
Thinking level: ${thinkingLevel}
Question source: ${sourceType==='website'?'questions already in this website':'selected AI medical knowledge'}

${sourceBlock}

Rules:
- Each question must have exactly 4 answer options and exactly one correct answer.
- The questions must be clinically and medically accurate.
- Prioritize higher-order thinking (Bloom-style Apply, Analyze, and Evaluate): use clinical vignettes, interpretation of signs/labs/images or mechanisms, comparison of related concepts, prediction of outcomes, and best-next-step reasoning when appropriate.
- Do NOT make questions that can be answered by simple definition/recall unless a small amount of recall is necessary to support a higher-order decision.
- Make distractors plausible and based on common misconceptions or clinically relevant alternatives.
- Avoid duplicate questions and avoid copying source wording.
- Keep the questions focused on the selected lecture.
- Return ONLY a valid JSON array. No markdown fences, no commentary, and no text before or after the array.
- Each item must have exactly this shape:
{"question":"...","options":["A","B","C","D"],"correctIndex":0,"explanation":"Brief justification.","difficulty":"${difficulty}"}
- correctIndex is zero-based.
- Keep each question concise and each explanation to 1–2 sentences.
- For this batch, return exactly ${batchCount} complete objects.
- Do not stop in the middle of an object. Return the complete JSON array.`;

      const text=await callAI([{role:'user',parts:[{text:prompt}]}],{
        maxOutputTokens: aiSettings.provider==='openrouter'
          ? 2200
          : Math.min(16000, Math.max(5000, batchCount*700)),
        jsonMode: aiSettings.provider==='openrouter'
      });
      const rawList=parseAIQuestionJSON(text);
      if(!rawList.length) throw new Error(`Batch ${bi+1} returned no questions.`);
      allRaw.push(...rawList.slice(0,batchCount));
      if(rawList.length<batchCount) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned only ${rawList.length} of ${batchCount} questions in batch ${bi+1}. Please try again.`);
    }

    const stamped=allRaw.slice(0,count).map((raw,i)=>normalizeQuestion({
      id:`ai-${Date.now()}-${i}-${Math.random().toString(36).slice(2,6)}`,
      module: `${module} AI generated`, subject, lecture,
      difficulty: raw.difficulty || difficulty,
      reference,
      question: raw.question,
      options: raw.options,
      correctIndex: raw.correctIndex,
      explanation: raw.explanation
    },'AI generated'));

    const errors=stamped.map((q,i)=>validateQuestion(q,i)).filter(Boolean);
    if(errors.length) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned a malformed question: ${errors[0]}`);
    if(stamped.length<count) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned ${stamped.length} questions instead of ${count}. Please try again.`);

    aiQuestions.push(...stamped);
    safeSetItem(CONFIG.aiQuestionsKey,JSON.stringify(aiQuestions));

    if(resultBox) resultBox.innerHTML=`<div class="card" style="margin-top:14px"><div class="notice ok">Generated ${stamped.length} question${stamped.length===1?'':'s'} from ${sourceType==='website'?'your website question bank':'AI medical knowledge'}.</div>
    <div class="mini" style="margin-top:8px">${esc(module+' AI generated')} · ${esc(subject)} · ${esc(lecture)} · ${esc(aiProviderLabel(aiSettings.provider))}</div>
    <div style="margin-top:12px">${stamped.map(q=>aiQuestionPreviewCard(q)).join('')}</div>
    <div class="actions" style="margin-top:16px"><button class="btn primary" onclick="go('aiquestions')">Review in AI Questions</button></div></div>`;
    toast(`Generated ${stamped.length} questions with ${aiProviderLabel(aiSettings.provider)}.`,'ok');
  }catch(e){
    if(resultBox) resultBox.innerHTML=`<div class="card" style="margin-top:14px"><div class="notice error">Generation failed: ${esc(e.message)}</div></div>`;
    toast(`${aiProviderLabel(aiSettings.provider)} generation failed: `+e.message,'error');
  }finally{
    aiBusy=false;
    if(btn){btn.disabled=false; btn.textContent='Generate questions';}
  }
}

async function sendAIChat(){
  if(aiBusy) return;
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text) return;

  aiChat.push({role:'user',text});
  safeSetItem(CONFIG.aiChatKey,JSON.stringify(aiChat));
  input.value='';
  renderAIAssistant();
  scrollChatToBottom();

  aiBusy=true;
  const sendBtn=document.getElementById('chatSendBtn');
  if(sendBtn){sendBtn.disabled=true; sendBtn.innerHTML='<span class="spinner"></span>…';}

  try{
    const contents=aiChat.filter(m=>m.role==='user'||m.role==='ai').map(m=>({
      role:m.role==='ai'?'model':'user',
      parts:[{text:m.role==='user'
        ? `Answer the user's message in ordinary, readable text. Do NOT return JSON, JSON arrays, code blocks, or a machine-readable object. Use normal sentences, short paragraphs, and bullet points when useful. If the user asks for an explanation, explain it clearly rather than formatting it as JSON.\n\nUser message:\n${m.text}`
        : m.text}]
    }));
    const previousProvider=aiSettings.provider, previousModel=aiSettings.model; aiSettings.provider='groq'; aiSettings.model='openai/gpt-oss-120b'; const reply=await callAI(contents,{maxOutputTokens:4096,responseMimeType:'text/plain'}); aiSettings.provider=previousProvider; aiSettings.model=previousModel;
    aiChat.push({role:'ai',text:formatAIChatReply(reply)});
  }catch(e){
    aiChat.push({role:'error',text:'Error: '+e.message});
  }finally{
    safeSetItem(CONFIG.aiChatKey,JSON.stringify(aiChat));
    aiBusy=false;
    renderAIAssistant();
    scrollChatToBottom();
  }
}

function addAIQuestionToBank(id){
  const q=aiQuestions.find(x=>x.id===id);
  if(!q)return;
  if(bank.some(x=>x.id===q.id)){toast('This question is already in the bank.','error');return;}
  localQuestions.push(q);
  bank.push(q);
  safeSetItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  safeSetItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,questions:bank}));
  render();
  toast('Question added to the question bank.','ok');
}
function addAllAIQuestionsToBank(){
  const existing=new Set(bank.map(q=>q.id));
  const toAdd=aiQuestions.filter(q=>!existing.has(q.id));
  if(!toAdd.length){toast('All AI questions are already in the bank.','error');return;}
  localQuestions.push(...toAdd);
  bank.push(...toAdd);
  safeSetItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  safeSetItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,questions:bank}));
  render();
  toast(`Added ${toAdd.length} question${toAdd.length===1?'':'s'} to the question bank.`,'ok');
}
function removeAIQuestion(id){
  if(!confirm('Delete this AI-generated question?'))return;
  aiQuestions=aiQuestions.filter(q=>q.id!==id);
  localQuestions=localQuestions.filter(q=>q.id!==id);
  bank=bank.filter(q=>q.id!==id);
  safeSetItem(CONFIG.aiQuestionsKey,JSON.stringify(aiQuestions));
  safeSetItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  safeSetItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,questions:bank}));
  render();
  toast('AI question deleted.','ok');
}
function clearAllAIQuestions(){
  if(!aiQuestions.length)return;
  if(!confirm(`Delete all ${aiQuestions.length} AI-generated questions? This also removes any of them already added to the bank.`))return;
  const ids=new Set(aiQuestions.map(q=>q.id));
  aiQuestions=[];
  localQuestions=localQuestions.filter(q=>!ids.has(q.id));
  bank=bank.filter(q=>!ids.has(q.id));
  safeSetItem(CONFIG.aiQuestionsKey,JSON.stringify(aiQuestions));
  safeSetItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  safeSetItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,questions:bank}));

async function uploadAIQuestionsToSupabase(){
  if(!(await requireAdmin())) return;
  if(!SUPABASE_ENABLED || !currentUser){toast('Sign in to an administrator account first.','error');return;}
  if(!aiQuestions.length){toast('There are no AI-generated questions to upload.','error');return;}
  const errors=aiQuestions.map((q,i)=>validateQuestion(q,i)).filter(Boolean);
  if(errors.length){toast('Cannot upload: '+errors[0],'error');return;}
  const rows=aiQuestions.map(q=>({
    id:q.id,
    module:q.module,
    semester:q.semester??null,
    subject:q.subject,
    lecture:q.lecture,
    question:q.question,
    options:q.options,
    correct_index:q.correctIndex,
    explanation:q.explanation||'',
    difficulty:q.difficulty||null,
    reference:q.reference||'AI generated'
  }));
  const {error}=await supabaseClient.from('questions').upsert(rows,{onConflict:'id'});
  if(error){toast('Supabase upload failed: '+error.message,'error');return;}
  await loadQuestionsFromSupabase();
  await loadGlobalAnalytics();
  toast(`Uploaded ${rows.length} AI-generated question${rows.length===1?'':'s'} to Supabase.`,'ok');
  renderAIQuestions();
}

  if(!registration?.waiting)return;
  let banner=document.getElementById('medexPwaUpdateBanner');
  if(!banner){
    banner=document.createElement('div');banner.id='medexPwaUpdateBanner';
    banner.style.cssText='position:fixed;z-index:99999;left:16px;right:16px;bottom:16px;max-width:680px;margin:auto;padding:12px 14px;border:1px solid var(--line,#ccd);border-radius:14px;background:var(--card,#fff);color:var(--text,#111);box-shadow:0 8px 32px #0002;display:flex;gap:12px;align-items:center;justify-content:space-between;font:600 14px/1.4 system-ui,sans-serif';
    banner.innerHTML='<span id="medexPwaUpdateText">Update available for MedEx.</span><button id="medexPwaUpdateButton" type="button" style="border:0;border-radius:9px;padding:9px 12px;background:var(--primary,#087f8c);color:white;font:inherit;cursor:pointer;white-space:nowrap">Reload to update</button>';
    document.body.appendChild(banner);
    banner.querySelector('button').addEventListener('click',()=>{
      if(typeof exam!=='undefined'&&exam&&!exam.submitted){
        const text=document.getElementById('medexPwaUpdateText');if(text)text.textContent='Update available — finish or submit your exam before reloading.';
        toast('Finish your active exam before updating MedEx.','error');return;
      }
      const worker=window.__medexWaitingWorker||registration.waiting;
      if(!worker)return;
      window.__medexUpdateReloading=true;
      worker.postMessage({type:'SKIP_WAITING'});
      const btn=document.getElementById('medexPwaUpdateButton');if(btn){btn.disabled=true;btn.textContent='Updating…';}
    });
  }
  window.__medexWaitingWorker=registration.waiting;
  banner.style.display='flex';
}
// Phone notifications: web push display is handled by sw.js. Browser permission is
// opt-in; local reminders are checked whenever MedEx is opened/foregrounded.
const MEDEX_PUSH_PUBLIC_KEY = ''; // Configure a VAPID public key + server endpoint to enable remote push.
function medexNotificationPermission(){return ('Notification' in window)?Notification.permission:'unsupported';}
async function enableMedExPhoneNotifications(){
  if(!('Notification' in window)){toast('This browser does not support notifications.','error');return;}
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){toast('Notifications are blocked. Enable them in your browser or phone settings.','error');return;}
  try{
    const reg=await navigator.serviceWorker.ready;
    if(reg.showNotification) await reg.showNotification('MedEx notifications enabled',{body:'You can receive study reminders while this app is available.',icon:'./icons/medex-192.png',badge:'./icons/medex-192.png'});
  }catch(e){console.warn('Notification test failed',e);}
  toast('Phone notification permission enabled. Remote admin push still needs the push server configured.','ok');
  scheduleMedExLocalReminder();
}
function scheduleMedExLocalReminder(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now(),last=Number(safeGetItem('medex_last_activity_at')||0);
  safeSetItem('medex_last_activity_at',String(now));
  const day=86400000;
  let title='',body='';
  try{
    const dueFlash=flashcardItems({module:'',subject:'',lecture:'',mode:'due'}).length;
    const dueQ=dueSpacedQuestions().length;
    if(dueFlash||dueQ){title='MedEx revision reminder';body=`You have ${dueFlash} flashcard(s) and ${dueQ} spaced question(s) due for review.`;}
    else if(last&&now-last>2*day){title='We miss you on MedEx';body='It has been more than 2 days. Come back for a short revision session.';}
  }catch(_){}
  if(title){
    const dayKey='medex_reminder_day',today=new Date(now).toISOString().slice(0,10);
    if(safeGetItem(dayKey)!==today){
      navigator.serviceWorker?.ready.then(reg=>reg.showNotification(title,{body,icon:'./icons/medex-192.png',badge:'./icons/medex-192.png',data:{url:'./#flashcards'}})).catch(()=>{});
      safeSetItem(dayKey,today);
    }
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleMedExLocalReminder();});
window.addEventListener('focus',scheduleMedExLocalReminder);

function watchPWARegistration(registration){
  if(registration.waiting&&navigator.serviceWorker.controller)showPWAUpdateBanner(registration);
  registration.addEventListener('updatefound',()=>{
    const worker=registration.installing;if(!worker)return;
    worker.addEventListener('statechange',()=>{
      if(worker.state==='installed'&&navigator.serviceWorker.controller)showPWAUpdateBanner(registration);
    });
  });
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(window.__medexUpdateReloading)window.location.reload();
  });
}
if('serviceWorker' in navigator){

    try{
      const registration=await navigator.serviceWorker.register(new URL('./sw.js?v=42.6',document.baseURI),{scope:new URL('./',document.baseURI).pathname});
      watchPWARegistration(registration);
      registration.update().catch(()=>{});
    }catch(e){ console.warn('PWA service worker:',e); }
    updatePWAInstallButton();
  });
}


/* ============================================================
   v42 — Exam tools: flag for review, option elimination,
   keyboard shortcuts and adjustable text size.
   ============================================================ */
let examEliminateMode=false;
function quizFontScale(){ const v=Number(safeGetItem('med64_quiz_font')||1); return v>=0.85&&v<=1.5?v:1; }
function applyQuizFontScale(){ document.documentElement.style.setProperty('--quiz-font-scale',quizFontScale()); }
function changeQuizFont(delta){
  const v=Math.min(1.5,Math.max(0.85,Math.round((quizFontScale()+delta)*100)/100));
  safeSetItem('med64_quiz_font',String(v)); applyQuizFontScale();
}
function toggleFlag(){
  if(!exam||exam.submitted)return;
  const q=exam.list[exam.index];
  exam.flags=exam.flags||{};
  if(exam.flags[q.id])delete exam.flags[q.id]; else exam.flags[q.id]=true;
  saveActiveExam(); enhanceQuiz();
}
function toggleEliminate(i){
  if(!exam||exam.submitted)return;
  const q=exam.list[exam.index];
  if(exam.answerMode==='immediate'&&exam.answers[q.id]!==undefined)return;
  exam.eliminated=exam.eliminated||{};
  const set=new Set(exam.eliminated[q.id]||[]);
  if(set.has(i))set.delete(i); else set.add(i);
  exam.eliminated[q.id]=[...set];
  saveActiveExam(); enhanceQuiz();
}
function toggleEliminateMode(){ examEliminateMode=!examEliminateMode; enhanceQuiz(); }
function jumpToNextFlagged(){
  if(!exam)return;
  const n=exam.list.length;
  for(let step=1;step<=n;step++){
    const i=(exam.index+step)%n;
    if(exam.flags&&exam.flags[exam.list[i].id]){ jumpToQuestion(i); return; }
  }
  toast('No flagged questions.','');
}
function enhanceQuiz(){
  if(!exam||exam.submitted)return;
  const quiz=document.querySelector('.quiz');
  if(!quiz)return;
  const q=exam.list[exam.index];
  const flagged=!!(exam.flags&&exam.flags[q.id]);
  const elim=new Set((exam.eliminated&&exam.eliminated[q.id])||[]);
  quiz.querySelectorAll('.option').forEach((btn,i)=>btn.classList.toggle('eliminated',elim.has(i)));
  quiz.querySelectorAll('.qnav-btn').forEach((btn,i)=>btn.classList.toggle('flagged',!!(exam.flags&&exam.flags[exam.list[i].id])));
  // In "show answers at the end" mode green/red would hint at correctness; relabel the legend.
  if(exam.answerMode==='finish'){
    const spans=quiz.querySelectorAll('.nav-legend span');
    if(spans[1]&&spans[1].lastChild)spans[1].lastChild.textContent='Answered';
    if(spans[2])spans[2].style.display='none';
  }
  let tools=document.getElementById('quizTools');
  if(!tools){
    const footer=quiz.querySelector('.quiz-footer');
    if(!footer)return;
    tools=document.createElement('div'); tools.id='quizTools'; tools.className='quiz-tools';
    footer.parentNode.insertBefore(tools,footer);
  }
  const flaggedCount=Object.keys(exam.flags||{}).filter(id=>exam.flags[id]).length;
  tools.innerHTML=`<button type="button" class="btn ${flagged?'on':''}" onclick="toggleFlag()" aria-pressed="${flagged}">⚑ ${flagged?'Flagged':'Flag for review'}</button>`
    +(flaggedCount?`<button type="button" class="btn" onclick="jumpToNextFlagged()">Next flagged (${flaggedCount})</button>`:'')
    +`<button type="button" class="btn ${examEliminateMode?'on':''}" onclick="toggleEliminateMode()" aria-pressed="${examEliminateMode}" title="Tap options to cross them out instead of answering">✕ Eliminate${examEliminateMode?': on':''}</button>`
    +`<button type="button" class="btn" onclick="changeQuizFont(-0.1)" aria-label="Smaller text">A−</button><button type="button" class="btn" onclick="changeQuizFont(0.1)" aria-label="Larger text">A+</button>`
    +`<span class="kbd-hint">Keys: 1–5 answer · ← → move · F flag · X eliminate</span>`;
}
document.addEventListener('keydown',function(e){
  if(!exam||exam.submitted||location.hash.replace('#','')!=='exam')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target; if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key.toLowerCase(), q=exam.list[exam.index];
  let n=-1;
  if(/^[1-9]$/.test(k))n=Number(k)-1; else if(/^[a-e]$/.test(k))n=k.charCodeAt(0)-97;
  if(n>=0&&n<q.options.length){ e.preventDefault(); chooseAnswer(n); return; }
  if(k==='arrowright'||k==='n'){ e.preventDefault(); if(exam.index<exam.list.length-1)nextQ(); }
  else if(k==='arrowleft'||k==='p'){ e.preventDefault(); if(exam.index>0)prevQ(); }
  else if(k==='f'){ e.preventDefault(); toggleFlag(); }
  else if(k==='x'){ e.preventDefault(); toggleEliminateMode(); }
});
applyQuizFontScale();

<script id="medex-ui-polish-js">
/* UI polish helper (visual only): keeps the current question's number visible inside a scrollable question navigator. */
(function(){
  var raf=0;
  function sync(){
    raf=0;
    try{
      var nav=document.querySelector('.quiz .question-nav'); if(!nav)return;
      var cur=nav.querySelector('.qnav-btn.current'); if(!cur)return;
      var top=cur.offsetTop-nav.offsetTop, bottom=top+cur.offsetHeight;

<script id="medex-nav-js">
/* Navigation organisation (no feature logic): groups the sidebar, adds section tabs and a phone bottom bar.
   Existing buttons are MOVED, never recreated, so every id, handler and admin show/hide rule keeps working. */
(function(){
  try{
    var nav=document.querySelector('.nav'); if(!nav)return;
    var by=function(v){return nav.querySelector(':scope > button[data-view="'+v+'"]');};
    var groups=[
      {id:'practice',label:'Practice',views:['exam','mistakes','favorites','library']},
      {id:'learn',label:'Learn',views:['flashcards','tools','ai','materials']},
      {id:'track',label:'Track progress',views:['progress','history','leaderboard']},
      {id:'account',label:'Account',views:['settings','account']},
      {id:'admin',label:'Admin',views:['bank','import','aiquestions','semesters','flashadmin','analytics','reports','replies','notifications','weeklynotifications']}
    ];
    var frag=document.createDocumentFragment(), home=by('dashboard');
    if(home)frag.appendChild(home);
    groups.forEach(function(g){
      var lab=document.createElement('div'); lab.className='nav-group-label'; lab.setAttribute('data-group',g.id); lab.textContent=g.label; frag.appendChild(lab);
      g.views.forEach(function(v){var b=by(v); if(b)frag.appendChild(b);});
    });
    Array.prototype.slice.call(nav.children).forEach(function(el){ if(el.tagName==='BUTTON')frag.appendChild(el); }); // anything unlisted keeps working
    nav.appendChild(frag);

    function syncLabels(){
      var labs=nav.querySelectorAll('.nav-group-label');
      Array.prototype.forEach.call(labs,function(lab){
        var any=false, el=lab.nextElementSibling;
        while(el&&!el.classList.contains('nav-group-label')){ if(el.tagName==='BUTTON'&&el.style.display!=='none')any=true; el=el.nextElementSibling; }
        lab.hidden=!any;
      });
    }
    syncLabels();
    if(window.MutationObserver)new MutationObserver(syncLabels).observe(nav,{attributes:true,attributeFilter:['style'],subtree:true});

    /* ---- section tabs ---- */
    var SECTIONS={
      practice:[['exam','Start exam'],['mistakes','Mistakes'],['favorites','Favourites'],['library','Library']],
      learn:[['flashcards','Flashcards'],['tools','Study tools'],['ai','AI assistant']],
      track:[['progress','Progress'],['history','History'],['leaderboard','Top users']]
    };
    var LABEL={practice:'Practice',learn:'Learn',track:'Track progress'};
    var VIEW_SECTION={exam:'practice',mistakes:'practice',favorites:'practice',library:'practice',flashcards:'learn',tools:'learn',ai:'learn',progress:'track',history:'track',leaderboard:'track',results:'track'};
    var CHIP={results:'history'};
    var view=function(){return location.hash.replace('#','')||'dashboard';};
    var go=function(v){ if(typeof window.go==='function')window.go(v); else location.hash=v; };

    function syncTabs(){
      var app=document.getElementById('app'); if(!app)return;
      var v=view(), sec=VIEW_SECTION[v];
      var old=app.querySelector(':scope > .section-tabs'), top=app.querySelector(':scope > .top');
      if(!sec||!top||app.querySelector('.quiz')||app.querySelector('#visitorStartName')){ if(old)old.remove(); return; }
      var active=CHIP[v]||v, key=sec+':'+active;
      if(old&&old.getAttribute('data-key')===key&&old.previousElementSibling===top)return;
      if(old)old.remove();
      var bar=document.createElement('nav'); bar.className='section-tabs'; bar.setAttribute('data-key',key); bar.setAttribute('aria-label',LABEL[sec]+' pages');
      SECTIONS[sec].forEach(function(it){
        var b=document.createElement('button'); b.type='button'; b.textContent=it[1]; b.setAttribute('data-view',it[0]);
        if(it[0]===active)b.setAttribute('aria-current','page');
        b.addEventListener('click',function(){ if(it[0]!==view())go(it[0]); });
        bar.appendChild(b);
      });
      top.insertAdjacentElement('afterend',bar);
    }

    /* ---- phone bottom bar ---- */
    var icon=function(v){var s=nav.querySelector('button[data-view="'+v+'"] svg'); return s?s.outerHTML:'';};
    var MORE='<svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="4.5" cy="10" r="1.2"/><circle cx="10" cy="10" r="1.2"/><circle cx="15.5" cy="10" r="1.2"/></svg>';
    var TABS=[['dashboard','Home',icon('dashboard')],['exam','Practice',icon('exam')],['flashcards','Learn',icon('flashcards')],['progress','Progress',icon('progress')],['more','More',MORE]];
    var tabs=document.createElement('nav'); tabs.className='bottom-tabs'; tabs.id='bottomTabs'; tabs.setAttribute('aria-label','Main navigation');
    TABS.forEach(function(t){
      var b=document.createElement('button'); b.type='button'; b.setAttribute('data-tab',t[0]); b.innerHTML=t[2]+'<span>'+t[1]+'</span>';
      b.addEventListener('click',function(){
        if(t[0]==='more'){ if(typeof window.setSidebar==='function')window.setSidebar(true); return; }
        if(view()!==t[0])go(t[0]);
      });
      tabs.appendChild(b);
    });
    document.body.appendChild(tabs);
    function tabFor(v){ if(v==='dashboard')return 'dashboard'; var s=VIEW_SECTION[v]; if(s==='practice')return 'exam'; if(s==='learn')return 'flashcards'; if(s==='track')return 'progress'; return 'more'; }
    function syncBar(){
      var cur=tabFor(view());
      Array.prototype.forEach.call(tabs.children,function(b){ if(b.getAttribute('data-tab')===cur)b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    }

    function syncAll(){ syncTabs(); syncBar(); }
    syncAll();
    window.addEventListener('hashchange',syncAll);
    var app=document.getElementById('app');
    if(app&&window.MutationObserver)new MutationObserver(syncAll).observe(app,{childList:true});
  }catch(e){ console.warn('Navigation enhancement skipped:',e&&e.message); }
})();
</script>
<script id="medex-simple-js">
/* Progressive disclosure (no feature logic): moves secondary sections into collapsible "More" panels.
   Nodes are MOVED, never recreated, so ids, inline handlers and admin rules keep working. */
(function(){
  try{
    var app=document.getElementById('app'); if(!app)return;
    var ALWAYS=['#toast','.support-floating-btn','.top','.section-tabs','.more-details'];
    var RULES={
      dashboard:{host:null,marker:'dash-main',label:'More from your dashboard',hint:'Performance, modules, leaderboard and recent exams',
        keep:['.dashboard-smart-section','.dashboard-quick-section','.study-goal-card']},
      progress:{host:null,label:'Detailed breakdown & analytics',hint:'Daily analytics, lecture and difficulty performance, reset',
        keep:['.study-goal-card','.dashboard-spaced-review','.grid.stats']},
      flashcards:{host:'.study-tools-page',label:'Create, import & manage flashcards',hint:'Card builder and your full card list',
        keep:['.study-tools-hero','.fc-cloud-status','.study-phase2-grid']},
      tools:{host:'.study-tools-page',label:'Study plans & achievements',hint:'Exam countdown, plans and badges',
        keep:['.study-tools-hero','.study-phase2-grid']}
    };
    var openState={};
    var view=function(){return location.hash.replace('#','')||'dashboard';};
    var matchesAny=function(el,list){for(var i=0;i<list.length;i++){if(el.matches(list[i]))return true;}return false;};

    function simplify(){
      var v=view(); if(v!=='dashboard')app.classList.remove('dash-main'); var rule=RULES[v]; if(!rule)return;
      if(app.querySelector('.quiz')||app.querySelector('#visitorStartName'))return;
      var host=rule.host?app.querySelector(rule.host):app; if(!host)return;
      if(host.querySelector(':scope > details.more-details'))return;          // already simplified
      if(v==='dashboard'&&!app.querySelector('.dashboard-quick-section'))return; // not rendered yet
      var keep=rule.keep.slice();
      if(v==='dashboard'){
        var n=app.querySelector(':scope > .site-notifications-card');
        if(n){
          if(/no site notifications/i.test(n.textContent||'')&&!n.querySelector('.notification-item,.site-notification-item,article'))n.hidden=true; // empty: nothing to show
          else keep.push('.site-notifications-card');
        }
        host.classList.add('dash-main');
        // the visitor-name card repeats the greeting; it lives in the More panel
      }
      var movable=Array.prototype.filter.call(host.children,function(el){
        return !matchesAny(el,ALWAYS)&&!matchesAny(el,keep)&&!el.hidden&&el.getAttribute('aria-hidden')!=='true';
      });
      if(!movable.length)return;
      var d=document.createElement('details'); d.className='more-details';
      var s=document.createElement('summary');
      var t=document.createElement('span'); t.textContent=rule.label;
      var h=document.createElement('span'); h.className='more-hint'; h.textContent=rule.hint;
      var box=document.createElement('span'); box.appendChild(t); box.appendChild(h); s.appendChild(box); d.appendChild(s);
      movable.forEach(function(el){d.appendChild(el);});
      d.open=!!openState[v];
      d.addEventListener('toggle',function(){openState[v]=d.open;});
      host.appendChild(d);
      // keep floating chat button last in DOM order (it is position:fixed, order is cosmetic)
      var fab=host.querySelector(':scope > .support-floating-btn'); if(fab)host.appendChild(fab);
    }

    function all(){ simplify(); }
    all();
    window.addEventListener('hashchange',all);
    if(window.MutationObserver){
      new MutationObserver(all).observe(app,{childList:true});
    }
  }catch(e){ console.warn('Simplification skipped:',e&&e.message); }
})();
</script>
<script id="medex-focus-js">
/* Focus timer upgrade. Reuses the existing timer state/functions; adds a quick-start panel, break mode,
   progress bar, today's stats, sound/vibration/title alert, and fixes the "frozen after reload" bug. */
(function(){
  try{
    if(typeof focusTimerState==='undefined'||typeof updateTopbarControls!=='function')return;
    var PREFS='medex_focus_prefs_v1', STATS='medex_focus_stats_v1';
    var load=function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:d;}catch(e){return d;}};
    var store=function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
    var prefs=load(PREFS,{sound:true}), stats=load(STATS,{});
    var popOpen=false, audio=null, baseTitle=document.title, titleTimer=0;
    var S=function(){return focusTimerState;};              // never cache: the original replaces this object on reset
    var day=function(){return typeof localDayKey==='function'?localDayKey():new Date().toISOString().slice(0,10);};
    var fmt=function(s){return typeof formatTime==='function'?formatTime(s):Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
    var onTools=function(){return location.hash.replace('#','')==='tools';};
    var refresh=function(){updateTopbarControls(); if(onTools()&&typeof renderStudyTools==='function')renderStudyTools();};

    /* ---------- stats ---------- */
    function addStats(min){
      var d=day(), e=stats[d]||{sessions:0,minutes:0}; e.sessions++; e.minutes+=min; stats[d]=e;
      Object.keys(stats).sort().slice(0,-60).forEach(function(k){delete stats[k];});
      store(STATS,stats);
    }
    function today(){return stats[day()]||{sessions:0,minutes:0};}

    /* ---------- alerts ---------- */
    function unlockAudio(){
      try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; if(!audio)audio=new AC(); if(audio.state==='suspended')audio.resume(); }catch(e){}
    }
    function beep(){
      if(!prefs.sound||!audio)return;
      try{
        [660,880,1100].forEach(function(f,i){
          var o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime+i*0.22;
          o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
          o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+0.22);
        });
      }catch(e){}
    }
    function flashTitle(msg){
      clearInterval(titleTimer); var on=false, n=0;
      titleTimer=setInterval(function(){ on=!on; document.title=on?msg:baseTitle; if(++n>40||!document.hidden&&n>6){clearInterval(titleTimer);document.title=baseTitle;} },1000);
    }
    function restoreTitle(){ clearInterval(titleTimer); document.title=baseTitle; }

    /* ---------- core ---------- */
    function paint(remain){

    var deckOf=function(c){return String(c.module||'').trim()||'General';};
    var subjOf=function(c){return String(c.subject||'').trim()||'General';};
    function allCards(){return flashcardScopeCards({module:'',subject:'',lecture:''});}
    function counts(cards){
      var now=Date.now(),r={due:0,nw:0,learning:0,total:cards.length};
      cards.forEach(function(c){var p=flashcardRecord(c);if(p.suspended)return;
        if(p.state==='new')r.nw++;
        else{if(Number(p.due||0)<=now)r.due++;if(p.state==='learning'||p.state==='relearning')r.learning++;}});
      return r;
    }
    function allowance(){return Math.max(0,NEW_PER_DAY-Number(flashcardDailyStats().row.newCards||0));}
    function queue(cards,kind){
      var now=Date.now(),live=cards.filter(function(c){return !flashcardRecord(c).suspended;});
      var due=live.filter(function(c){var p=flashcardRecord(c);return p.state!=='new'&&Number(p.due||0)<=now;})
        .sort(function(a,b){var pa=flashcardRecord(a),pb=flashcardRecord(b);if(!!pa.difficult!==!!pb.difficult)return pa.difficult?-1:1;return Number(pa.due||0)-Number(pb.due||0);});
      var fresh=live.filter(function(c){return flashcardRecord(c).state==='new';});
      if(kind==='difficult')return live.filter(function(c){return flashcardRecord(c).difficult;});
      if(kind==='favourite')return live.filter(function(c){return flashcardRecord(c).favorite;});
      if(kind==='all')return shuffle(live.slice()).slice(0,SESSION_CAP);
      var room=allowance();if(!room&&!due.length)room=10; // never a dead end: offer a small extra batch
      return due.concat(fresh.slice(0,room)).slice(0,SESSION_CAP);
    }
    window.fc2Fold=function(k,v){openFold[k]=!!v;};
    window.fc2FilterDecks=function(v){
      deckQuery=String(v||'').toLowerCase().trim();
      document.querySelectorAll('[data-deck-name]').forEach(function(el){el.classList.toggle('hidden',!!deckQuery&&el.getAttribute('data-deck-name').indexOf(deckQuery)<0);});
    };
    window.fc2Start=function(kind,deck,subject){
      var cards=allCards();
      if(deck)cards=cards.filter(function(c){return deckOf(c)===deck;});
      if(subject)cards=cards.filter(function(c){return subjOf(c)===subject;});
      var list=queue(cards,kind);
      if(!list.length){toast('No cards are ready here yet.','error');return;}
      flashcardSession={list:list,index:0,revealed:false,ratings:{again:0,hard:0,good:0,easy:0},startedAt:Date.now(),drawingOpen:false};
      renderFlashcardSession();
    };
    function decks(){
      var map=new Map();
      allCards().forEach(function(c){
        var m=deckOf(c),s=subjOf(c);
        if(!map.has(m))map.set(m,{name:m,cards:[],subjects:new Map()});
        var d=map.get(m);d.cards.push(c);
        if(!d.subjects.has(s))d.subjects.set(s,[]);
        d.subjects.get(s).push(c);
      });
      return Array.from(map.values()).map(function(d){d.c=counts(d.cards);return d;})
        .sort(function(a,b){return (b.c.due-a.c.due)||a.name.localeCompare(b.name);});
    }
    function deckHTML(d){
      var learned=d.c.total?Math.round((d.c.total-d.c.nw)/d.c.total*100):0;
      var ready=queue(d.cards,'mixed').length;
      var subs='';
      if(d.subjects.size>1){
        subs='<details class="fc2-sub"><summary>'+plural(d.subjects.size,'subject')+'</summary>'+
          Array.from(d.subjects.entries()).sort(function(a,b){return a[0].localeCompare(b[0]);}).map(function(e){
            var sc=counts(e[1]),sr=queue(e[1],'mixed').length;
            return '<div class="fc2-sub-row"><span>'+esc(e[0])+'</span><span class="mini">'+sc.due+' due · '+sc.nw+' new</span><button class="btn" '+(sr?'':'disabled')+' onclick="fc2Start(\'mixed\',\''+attrJs(d.name)+'\',\''+attrJs(e[0])+'\')">Study</button></div>';
          }).join('')+'</details>';
      }
      return '<article class="fc2-deck" data-deck-name="'+esc(d.name.toLowerCase())+'"><div class="fc2-deck-head"><div class="fc2-deck-title"><b>'+esc(d.name)+'</b><span>'+plural(d.c.total,'card')+' · '+learned+'% started</span></div>'+
        '<div class="fc2-deck-counts"><span class="due'+(d.c.due?' on':'')+'">'+d.c.due+' due</span><span class="new'+(d.c.nw?' on':'')+'">'+d.c.nw+' new</span></div>'+
        '<button class="btn primary" '+(ready?'':'disabled')+' onclick="fc2Start(\'mixed\',\''+attrJs(d.name)+'\')">Study</button></div>'+
        '<div class="bar"><i style="width:'+learned+'%"></i></div>'+subs+'</article>';
    }
    window.renderFlashcards=function(){
      if(flashcardSession){renderFlashcardSession();return;}
      if(SUPABASE_ENABLED&&!publicFlashcardsLoaded&&!publicFlashcardsLoading&&Date.now()-publicFlashcardsLastAttempt>30000){loadPublicFlashcards();}
      var cards=allCards(),all=counts(cards),n=queue(cards,'mixed').length;
      var today=Number(flashcardDailyStats().row.reviews||0);
      var difficult=queue(cards,'difficult').length,fav=queue(cards,'favourite').length;
      var head=!cards.length?'No flashcards yet':all.due?plural(all.due,'card')+' to review':n?'Ready to learn something new':'You are all caught up';
      var sub=!cards.length?'Published MedEx decks appear here automatically. You can also create your own cards below.'
        :all.due?'Review due cards first. That is what keeps them in your long-term memory.'
        :n?'New cards are waiting. Read the question, answer in your head, then reveal and rate honestly.'
        :'Nothing is due right now. Come back later, or review ahead from any deck.';
      var dl=decks();
      var deckBlock=dl.length?
        '<div class="fc2-decks">'+dl.map(deckHTML).join('')+'</div>':
        '<div class="fc2-empty"><b>No decks to show</b>Cards you create, import or receive from MedEx will be grouped into decks by module.</div>';
      var body='<div class="fc2-page">'+flashcardCloudStatusHTML()+
        '<section class="fc2-hero" id="fcStudyNow"><div><span class="fc2-eyebrow">Today</span><h2>'+esc(head)+'</h2><p>'+esc(sub)+'</p>'+
        '<div class="fc2-stats"><div class="fc2-stat due"><b>'+all.due+'</b><span>Due</span></div><div class="fc2-stat new"><b>'+all.nw+'</b><span>New</span></div><div class="fc2-stat learn"><b>'+all.learning+'</b><span>Learning</span></div><div class="fc2-stat done"><b>'+today+'</b><span>Reviewed today</span></div></div></div>'+
        '<div class="fc2-hero-actions"><button class="btn primary fc2-go" '+(n?'':'disabled')+' onclick="fc2Start(\'mixed\')">Study now'+(n?' · '+n:'')+'</button>'+
        (!n&&cards.length?'<button class="btn" onclick="fc2Start(\'all\')">Review ahead</button>':'')+
        '<button class="btn" onclick="enableMedExPhoneNotifications()">Enable reminders</button></div></section>'+
        '<div class="fc2-chips"><button class="fc2-chip" '+(difficult?'':'disabled')+' onclick="fc2Start(\'difficult\')">⚑ Difficult · '+difficult+'</button><button class="fc2-chip" '+(fav?'':'disabled')+' onclick="fc2Start(\'favourite\')">♥ Favourites · '+fav+'</button><button class="fc2-chip" '+(cards.length?'':'disabled')+' onclick="fc2Start(\'all\')">↻ Random mix</button></div>'+
        '<div class="fc2-section-head"><h3>Your decks</h3>'+(dl.length>6?'<input class="fc2-search" type="search" placeholder="Search decks…" value="'+esc(deckQuery)+'" oninput="fc2FilterDecks(this.value)" aria-label="Search decks">':'')+'</div>'+
        '<div id="fcDecks">'+deckBlock+'</div>'+
        '<div class="fc2-howto">In a session: Space reveals · 1 Again · 2 Hard · 3 Good · 4 Easy</div>'+
        '<details class="more-details" '+(openFold.custom?'open':'')+' ontoggle="fc2Fold(\'custom\',this.open)"><summary><span>Custom session<span class="more-hint">Pick an exact module, subject or lecture</span></span></summary>'+renderFlashcardSetup()+'</details>'+
        '<details class="more-details" '+(openFold.manage?'open':'')+' ontoggle="fc2Fold(\'manage\',this.open)"><summary><span>Create, import &amp; manage cards<span class="more-hint">Card builder, CSV import, AI generation, your full list</span></span></summary>'+renderFlashcardLibrary()+'</details></div>';
      document.getElementById('app').innerHTML=layout('Flashcards','',body);
      if(deckQuery)fc2FilterDecks(deckQuery);
    };
    // thin progress bar above the card during a session
    var _rs=window.renderFlashcardSession;
    window.renderFlashcardSession=function(){
      _rs();
      var s=flashcardSession,card=document.querySelector('.study-flashcard-card');
      if(s&&card&&s.index<s.list.length&&!document.querySelector('.fc2-bar')){
        card.insertAdjacentHTML('beforebegin','<div class="fc2-bar" aria-hidden="true"><i style="width:'+Math.round(s.index/s.list.length*100)+'%"></i></div>');
      }
    };
    if(location.hash.replace('#','')==='flashcards')window.renderFlashcards();
  }catch(e){console.warn('Flashcards v2 skipped:',e&&e.message);}
})();
</script>

<script id="medex-tour-js">
/* Guide v3: a spotlight tour that navigates between pages with the user, plus once-per-page tips
   and a persistent "?" help button. Overrides the old single-window guide. */
(function(){
  'use strict';
  try{
    var KEY='medex_tour_v3',TIPKEY='medex_tips_seen_v1';
    var load=function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:d;}catch(e){return d;}};
    var store=function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
    var st=load(KEY,{i:0,active:false,done:false}),seen=load(TIPKEY,{});
    var root=null,token=0,raf=0,started=false,tipT=0,placeT=0;
    var viewNow=function(){return location.hash.replace('#','')||'dashboard';};
    var PAGE={dashboard:'Dashboard',exam:'Start Exam',flashcards:'Flashcards',mistakes:'Mistakes',library:'Study Library',tools:'Study Tools',progress:'Progress',ai:'AI Assistant'};
    var STEPS=[
      {view:'dashboard',target:'.dashboard-smart-section',icon:'✦',title:'Your next best step',body:'MedEx reads your progress and tells you what to study next: due flashcards, past mistakes or a weak topic. One tap and you are in.'},
      {view:'dashboard',target:'.study-goal-card',icon:'🔥',title:'Daily goal and streak',body:'Answer your daily number of questions to keep your streak alive. You can change the goal in Settings.'},
      {view:'exam',target:'#simpleExamBuilder',icon:'📝',title:'Build your own exam',body:'Choose a module, subject and lecture, set how many questions you want, then start. Questions you already answered correctly are retired, so you only see what you still need.'},
      {view:'exam',target:'.answer-mode-list',icon:'🎯',title:'Learning mode or exam mode',body:'"Show answer immediately" is best for learning. "After submitting" simulates a real exam. During a question, use the pen on the right to draw and the flag to mark it for review.'},
      {view:'flashcards',target:'#fcStudyNow',icon:'🗂️',title:'Flashcards: one tap to study',body:'"Study now" gives you due cards first, then a few new ones. Think of the answer, reveal it, then rate yourself: Again, Hard, Good or Easy. Honest ratings schedule the next review at the right time.'},
      {view:'flashcards',target:'#fcDecks',icon:'📚',title:'Study by deck',body:'Each module is a deck with its due and new counts. Open a deck to study one subject at a time.'},
      {view:'mistakes',target:'#app .card',icon:'🔍',title:'Learn from your mistakes',body:'Every wrong answer is saved here and ranked by weakest topic. Practise them until they stop appearing.'},
      {view:'library',target:'#librarySearch',icon:'🔎',title:'Search everything',body:'Search any question or concept, save questions to your own folders and attach personal notes.'},
      {view:'tools',target:'.focus-timer-card',icon:'⏱️',title:'Focus sessions and plans',body:'Start a focus timer here or from the top bar at any time. You can also set a study plan with an exam countdown.'},
      {view:'progress',target:'.grid.stats',icon:'📈',title:'Track your accuracy',body:'See accuracy and progress by module, subject and lecture, and spot the lectures that need more practice.'},
      {view:'ai',target:'#chatInput',icon:'✨',title:'Ask AI',body:'Stuck on a concept? Ask for an explanation. During an exam you can also tap Ask AI under any question.'},
      {view:'dashboard',target:'#medexHelpBtn',icon:'👍',title:'You are ready',body:'Tap the ? button any time to replay this tour or see tips for the page you are on.'}
    ];
    var TIPS={
      dashboard:['Your dashboard','Start with "Your next best step". Quick actions jump straight into an exam, flashcards, mistakes or the library.'],
      exam:['Build an exam','Pick module, subject and lecture, choose a count, and start. Use "Advanced Smart Exam Builder" to mix several lectures.'],
      flashcards:['Flashcards','Tap "Study now": due cards come first. Space reveals the answer, then press 1 Again, 2 Hard, 3 Good or 4 Easy.'],
      mistakes:['Mistakes','Wrong answers are collected here, ranked by weakest topic. Use "Practice Mistakes" for a focused session.'],
      library:['Study Library','Search questions, group them in folders and add personal notes. Notes also appear in exam reviews.'],
      tools:['Study Tools','Start a focus session, then build a study plan with an exam date to count down to.'],
      progress:['Progress','Open a module to see subjects and lectures. Low-accuracy lectures are the best place to practise next.'],
      ai:['Ask AI','Ask about any concept in plain language. Short, specific questions get the clearest answers.'],
      history:['Exam history','Review any past exam in full or retake it with the same questions.'],
      leaderboard:['Top users','Each correct answer earns 1 XP. Tied XP shares a rank.'],
      favorites:['Favourites','Star a question during an exam to keep it here for quick review.'],
      settings:['Settings','Set your daily goal, change semester and switch dark mode here.'],
      results:['Exam results','Use the topic cards to practise just the lectures you missed.']
    };
    function vis(el){return !!el&&el.getClientRects().length>0;}
    function find(sel){try{var el=document.querySelector(sel);return vis(el)?el:null;}catch(e){return null;}}

    function ensureRoot(){
      if(root&&document.body.contains(root))return;
      root=document.createElement('div');root.id='medexTour';root.className='mt-root mt-center';
      root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label','MedEx guided tour');
      root.innerHTML='<div class="mt-shield"></div><div class="mt-hole" style="display:none"></div><section class="mt-card" aria-live="polite"></section>';
      root.addEventListener('click',function(e){
        var b=e.target.closest('[data-mt]');if(!b)return;
        var a=b.getAttribute('data-mt');
        if(a==='next')(st.i>=STEPS.length-1)?finish(true):show(st.i+1);
        else if(a==='back')show(st.i-1);
        else if(a==='skip')finish(false);
      });
      document.body.appendChild(root);
      if(window.innerWidth<=880&&typeof setSidebar==='function')setSidebar(false);
    }
    function drawCard(){
      var s=STEPS[st.i],n=STEPS.length,next=STEPS[st.i+1];
      var hint=next&&next.view!==s.view?'<div class="mt-next">Next: '+(PAGE[next.view]||'')+' page</div>':'';
      root.querySelector('.mt-card').innerHTML=
        '<div class="mt-kicker"><span>'+s.icon+' Step '+(st.i+1)+' of '+n+'</span><span class="mt-page">📍 '+(PAGE[s.view]||'')+'</span></div>'+
        '<div class="mt-progress"><i style="width:'+Math.round((st.i+1)/n*100)+'%"></i></div><h2>'+s.title+'</h2><p>'+s.body+'</p>'+
        '<div class="mt-actions"><button class="btn" data-mt="skip">Skip tour</button><span class="mt-sp"></span>'+(st.i>0?'<button class="btn" data-mt="back">Back</button>':'')+
        '<button class="btn primary" data-mt="next">'+(st.i===n-1?'Finish':'Next')+'</button></div>'+hint;
      var nb=root.querySelector('[data-mt="next"]');if(nb)try{nb.focus({preventScroll:true});}catch(e){}
    }
    function place(){
      if(!root||!st.active)return;
      var s=STEPS[st.i];if(!s)return;
      var el=viewNow()===s.view?find(s.target):null;
      var hole=root.querySelector('.mt-hole'),card=root.querySelector('.mt-card');
      var vw=window.innerWidth,vh=window.innerHeight;
      if(!el){hole.style.display='none';root.classList.add('mt-center');return;}
      root.classList.remove('mt-center');hole.style.display='block';
      var r=el.getBoundingClientRect(),pad=8;
      var top=Math.max(r.top-pad,6),left=Math.max(r.left-pad,6),bottom=Math.min(r.bottom+pad,vh-6),right=Math.min(r.right+pad,vw-6);
      hole.style.top=top+'px';hole.style.left=left+'px';hole.style.width=Math.max(0,right-left)+'px';hole.style.height=Math.max(0,bottom-top)+'px';
      var cw=card.offsetWidth,ch=card.offsetHeight,x,y;
      if(vw<=700){
        x=(vw-cw)/2;
        y=((top+bottom)/2>vh*0.5)?12:(vh-ch-84);
      }else{
        x=Math.min(Math.max(left,12),vw-cw-12);
        if(vh-bottom>=ch+18)y=bottom+14;
        else if(top>=ch+18)y=top-ch-14;
        else y=vh-ch-16;
      }
      card.style.left=Math.max(8,x)+'px';card.style.top=Math.max(8,y)+'px';
    }
    function schedulePlace(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;place();});}
    function show(i){
      st.i=Math.max(0,Math.min(STEPS.length-1,i));st.active=true;store(KEY,st);
      var my=++token;ensureRoot();drawCard();root.classList.add('mt-center');
      var s=STEPS[st.i];
      if(viewNow()!==s.view)location.hash=s.view;
      var t0=Date.now();
      (function poll(){
        if(my!==token)return;
        var el=viewNow()===s.view?find(s.target):null;
        if(el||Date.now()-t0>2800){
          if(el){var r=el.getBoundingClientRect();if(r.top<70||r.bottom>window.innerHeight-70){try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}}}
          place();clearTimeout(placeT);placeT=setTimeout(place,380);return;
        }
        setTimeout(poll,110);
      })();
    }
    function close(){token++;if(root){root.remove();root=null;}st.active=false;store(KEY,st);}
    function finish(completed){
      if(completed){STEPS.forEach(function(s){seen[s.view]=1;});store(TIPKEY,seen);}
      st.done=true;close();
      if(typeof toast==='function')toast(completed?'Tour complete. Tap ? any time for tips.':'Tour skipped. Tap ? to replay it or see page tips.','ok');
    }
    function restart(){hideMenu();hideTip();st={i:0,active:true,done:false};started=true;store(KEY,st);show(0);}

    /* ---- once-per-page tips ---- */
    function hideTip(){clearTimeout(tipT);var t=document.getElementById('medexTip');if(t)t.remove();}
    function showTip(v,force){
      var t=TIPS[v];hideTip();
      var d=document.createElement('aside');d.id='medexTip';d.className='mt-tip';d.setAttribute('role','status');
      var data=t||['Tip','Use the menu button (top left) to move between sections. Tap ? to replay the tour.'];
      d.innerHTML='<b>💡 '+data[0]+'</b><p>'+data[1]+'</p><button class="btn primary" type="button">Got it</button>';
      d.querySelector('button').addEventListener('click',hideTip);
      document.body.appendChild(d);
      seen[v]=1;store(TIPKEY,seen);
      if(!force)tipT=setTimeout(hideTip,15000);
    }
    function maybeTip(v){
      if(!TIPS[v]||seen[v]||v==='dashboard')return;
      clearTimeout(tipT);
      tipT=setTimeout(function(){if(viewNow()===v&&!st.active&&!document.querySelector('.quiz')&&!document.getElementById('medexTip'))showTip(v,false);},900);
    }

    /* ---- help button ---- */
    function hideMenu(){var m=document.getElementById('medexHelpMenu');if(m)m.remove();}
    function ensureHelp(){
      if(document.getElementById('medexHelpBtn'))return;
      var b=document.createElement('button');b.id='medexHelpBtn';b.type='button';b.className='mt-help';
      b.setAttribute('aria-label','Guide and tips');b.setAttribute('aria-haspopup','menu');b.textContent='?';
      b.addEventListener('click',function(e){
        e.stopPropagation();
        if(document.getElementById('medexHelpMenu')){hideMenu();return;}
        var m=document.createElement('div');m.id='medexHelpMenu';m.className='mt-menu';m.setAttribute('role','menu');
        m.innerHTML='<button role="menuitem" data-h="tip">💡 Tips for this page</button><button role="menuitem" data-h="tour">🧭 Replay the full tour</button><button role="menuitem" data-h="reset">↺ Show all tips again</button>';
        m.addEventListener('click',function(ev){
          var h=ev.target.closest('[data-h]');if(!h)return;ev.stopPropagation();
          var a=h.getAttribute('data-h');hideMenu();
          if(a==='tip')showTip(viewNow(),true);
          else if(a==='tour')restart();
          else{seen={};store(TIPKEY,seen);if(typeof toast==='function')toast('Page tips will appear again as you visit each page.','ok');}
        });
        document.body.appendChild(m);
      });
      document.body.appendChild(b);
    }
    document.addEventListener('click',function(e){if(!e.target.closest('#medexHelpMenu,#medexHelpBtn'))hideMenu();});
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape')hideMenu();
      if(!st.active||!root)return;
      if(e.key==='Escape'){finish(false);}
      else if(e.key==='ArrowRight'){e.preventDefault();(st.i>=STEPS.length-1)?finish(true):show(st.i+1);}
      else if(e.key==='ArrowLeft'&&st.i>0){e.preventDefault();show(st.i-1);}
    });
    window.addEventListener('resize',schedulePlace);
    window.addEventListener('scroll',schedulePlace,true);
    var app=document.getElementById('app');
    if(app&&window.MutationObserver)new MutationObserver(function(){if(st.active){clearTimeout(placeT);placeT=setTimeout(place,60);}}).observe(app,{childList:true});

    /* ---- hooks the main script already calls ---- */
    window.closeVisitorGuide=function(){finish(false);};
    window.maybeShowVisitorGuide=function(v){
      try{
        var old=document.getElementById('medexVisitorGuide');if(old)old.remove();
        document.querySelectorAll('.medex-guide-target').forEach(function(x){x.classList.remove('medex-guide-target');});
        if(typeof exam!=='undefined'&&exam&&!exam.submitted){if(root)close();return;}
        if(!currentUser&&(!getVisitorName()||!getSelectedSemester()))return;
        ensureHelp();
        if(st.active){if(!root)show(st.i);else{clearTimeout(placeT);placeT=setTimeout(place,60);}return;}
        if(!st.done){
          if(!started&&v==='dashboard'){started=true;setTimeout(function(){if(!st.done&&!st.active&&viewNow()==='dashboard')show(0);},500);}
          return;
        }
        maybeTip(v);
      }catch(e){console.warn('Guide error:',e&&e.message);}
    };
    window.openMedExGuide=restart;
    ensureHelp();
  }catch(e){console.warn('Guide v3 skipped:',e&&e.message);}
})();
</script>
