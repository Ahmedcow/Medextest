  const canvas=document.getElementById('examAnnotationCanvas');
  const note=document.getElementById('examAnnotationNote');
  const stage=document.querySelector('.exam-annotation-stage');
  const viewport=document.querySelector('.exam-annotation-viewport');
  const surface=document.querySelector('.exam-annotation-surface');
  if(!canvas||!exam||!stage||!viewport||!surface)return;

  const data=annotationData(exam.list[exam.index]);
  if(note){
    note.value=data?.note||'';
    note.oninput=()=>{if(data){data.note=note.value;saveActiveExam();}};
  }

  drawExamAnnotations();
  if(examDrawingResizeObserver)examDrawingResizeObserver.disconnect();
  if(window.ResizeObserver){
    examDrawingResizeObserver=new ResizeObserver(()=>drawExamAnnotations());
    examDrawingResizeObserver.observe(stage);
  }

  // Drawing input is intentionally simple and stable:
  //   • exactly ONE finger draws
  //   • TWO OR MORE fingers NEVER draw and NEVER zoom the drawing box
  //   • mouse/pen remain usable as normal single-pointer input
  // There is deliberately NO pinch-zoom/pan logic here. This avoids the
  // coordinate/layout changes that previously made the question collapse or
  // made strokes jump to another location on iPad/touch devices.
  const touchPointers=new Set();
  let drawingPointerId=null;
  let blockedByMultiTouch=false;

  const syncTouchAction=()=>{
    // While drawing is enabled, keep the browser from turning the single
    // finger stroke into page scrolling/zooming. The drawing box itself has
    // no custom zoom gesture.
    viewport.style.touchAction=examDrawingEnabled?'none':'auto';
  };

  const cancelStroke=()=>{
    if(canvas._activeStroke){
      data.strokes.pop();
      canvas._activeStroke=null;
    }
    drawingPointerId=null;
    drawExamAnnotations();
  };

  const pointInDrawingBox=e=>{
    const rect=canvas.getBoundingClientRect();
    const w=Math.max(1,canvas.clientWidth||rect.width||1);
    const h=Math.max(1,canvas.clientHeight||rect.height||1);
    return [
      Math.max(0,Math.min(1,(e.clientX-rect.left)/w)),
      Math.max(0,Math.min(1,(e.clientY-rect.top)/h))
    ];
  };

  const finishStroke=()=>{
    if(canvas._activeStroke){
      canvas._activeStroke=null;
      drawingPointerId=null;
      saveActiveExam();
      drawExamAnnotations();
    }else{
      drawingPointerId=null;
    }
  };

  const releaseTouchPointer=e=>{
    if(e.pointerType==='touch'){
      touchPointers.delete(e.pointerId);
      if(touchPointers.size===0){
        blockedByMultiTouch=false;
      }
    }
  };

  const onPointerDown=e=>{
    if(e.pointerType==='touch'){
      touchPointers.add(e.pointerId);

      // The moment a second finger appears, permanently block the current
      // gesture until ALL fingers leave the drawing box. In particular, do
      // not start a second stroke and do not perform any zoom operation.
      if(touchPointers.size>=2){
        e.preventDefault();
        blockedByMultiTouch=true;
        cancelStroke();
        return;
      }

      // A new touch cannot draw if the previous gesture was already
      // classified as multi-touch.
      if(blockedByMultiTouch){
        e.preventDefault();
        return;
      }
    }

    if(!examDrawingEnabled||blockedByMultiTouch||drawingPointerId!==null)return;

    e.preventDefault();
    try{viewport.setPointerCapture?.(e.pointerId);}catch(_){ }
    drawingPointerId=e.pointerId;
    const point=pointInDrawingBox(e);
    data.strokes.push({
      tool:examDrawingTool,
      color:examDrawingTool==='highlighter'?'#f2c94c':examDrawingColor,
      size:examDrawingTool==='eraser'?Math.max(12,examDrawingSize*5):examDrawingSize,
      points:[point]
    });
    canvas._activeStroke=data.strokes[data.strokes.length-1];
    drawExamAnnotations();
  };

  const onPointerMove=e=>{
    if(e.pointerType==='touch' && touchPointers.has(e.pointerId)){
      if(blockedByMultiTouch || touchPointers.size>=2){
        e.preventDefault();
        return;
      }
    }

    if(drawingPointerId!==e.pointerId||blockedByMultiTouch||!canvas._activeStroke||!examDrawingEnabled)return;
    e.preventDefault();
    canvas._activeStroke.points.push(pointInDrawingBox(e));
    drawExamAnnotations();
  };

  const onPointerUp=e=>{
    const wasDrawing=drawingPointerId===e.pointerId;
    releaseTouchPointer(e);
    if(wasDrawing){
      if(e.pointerType==='touch' && blockedByMultiTouch){
        drawingPointerId=null;
      }else{
        finishStroke();
      }
    }
  };

  const onPointerCancel=e=>{
    const wasTouch=e.pointerType==='touch';
    if(drawingPointerId===e.pointerId)cancelStroke();
    if(wasTouch)releaseTouchPointer(e);
    if(touchPointers.size===0)blockedByMultiTouch=false;
  };

  viewport.addEventListener('pointerdown',onPointerDown,{passive:false});
  viewport.addEventListener('pointermove',onPointerMove,{passive:false});
  viewport.addEventListener('pointerup',onPointerUp,{passive:false});
  viewport.addEventListener('pointercancel',onPointerCancel,{passive:false});
  viewport.addEventListener('lostpointercapture',onPointerCancel,{passive:false});
  syncTouchAction();

  // Always restore a plain, unscaled drawing surface when the question is
  // rendered. No transform, scroll offset, or zoom state is carried between
  // questions.
  surface.style.width='100%';
  surface.style.height='auto';
  surface.style.transform='none';
  surface.style.transformOrigin='initial';
  surface.style.marginRight='0';
  surface.style.marginBottom='0';
  surface.dataset.zoom='1';
  viewport.scrollLeft=0;
  viewport.scrollTop=0;
}

function setExamPenColor(color){
  examDrawingColor=color;
  document.querySelectorAll('.exam-pen-color').forEach(b=>b.classList.toggle('active',b.dataset.color===color));
  if(examDrawingTool!=='pen')setExamDrawingTool('pen');
}
function examPenPaletteHTML(){
  return `<div class="exam-pen-colors" aria-label="Pen colors">${examPenColors.map(c=>`<button type="button" class="exam-pen-color ${examDrawingColor===c?'active':''}" data-color="${c}" onclick="setExamPenColor('${c}')" style="background:${c}" title="Pen color ${c}" aria-label="Pen color ${c}"></button>`).join('')}</div>`;
}
function setExamDrawingTool(tool){
  if(!exam)return;
  examDrawingTool=tool;
  examDrawingEnabled=true;
  const rail=document.getElementById('examDrawingTools');
  if(rail)rail.classList.add('is-open');
  const canvas=document.getElementById('examAnnotationCanvas');
  if(canvas){canvas.classList.add('drawing-enabled');canvas.style.touchAction='none';}
  const viewport=document.querySelector('.exam-annotation-viewport');
  if(viewport)viewport.style.touchAction='none';
  document.querySelectorAll('.exam-annotation-toolbar .tool-btn').forEach(b=>b.classList.toggle('tool-active',b.dataset.tool===tool));
}
function toggleExamDrawing(){
  examDrawingEnabled=!examDrawingEnabled;
  const canvas=document.getElementById('examAnnotationCanvas');
  const viewport=document.querySelector('.exam-annotation-viewport');
  if(canvas){
    canvas.classList.toggle('drawing-enabled',examDrawingEnabled);
    canvas.style.touchAction=examDrawingEnabled?'none':'pan-y';
  }
  if(viewport)viewport.style.touchAction=examDrawingEnabled?'none':'pan-y';
  const btn=document.getElementById('examDrawingToggle');
  if(btn)btn.classList.toggle('tool-active',examDrawingEnabled);
  const rail=document.getElementById('examDrawingTools');
  if(rail)rail.classList.toggle('is-open',examDrawingEnabled);
  if(examDrawingEnabled)setExamDrawingTool(examDrawingTool);
}
function toggleExamToolPanel(name,force){
  const panels={notes:document.getElementById('examNotesPanel'),folder:document.getElementById('examFolderPanel')};
  Object.entries(panels).forEach(([k,el])=>{
    if(!el)return;
    const open=force===undefined?k===name:!!force&&k===name;
    el.classList.toggle('is-open',open);
  });
}
function closeExamToolPanel(name){
  const el=document.getElementById(name==='notes'?'examNotesPanel':'examFolderPanel');
  if(el)el.classList.remove('is-open');
}
function resetExamZoom(){
  const viewport=document.querySelector('.exam-annotation-viewport');
  const surface=document.querySelector('.exam-annotation-surface');
  if(viewport){viewport.scrollLeft=0;viewport.scrollTop=0;}
  if(surface){surface.style.transform='none';surface.style.marginRight='0';surface.style.marginBottom='0';surface.dataset.zoom='1';}
}
function openExamNoteEditor(qid){
  if(!exam)return;
  const q=exam.list.find(x=>String(x.id)===String(qid))||exam.list[exam.index];
  if(!q)return;
  document.getElementById('examNoteEditorBackdrop')?.remove();
  const current=getQuestionNote(q.id);
  document.body.insertAdjacentHTML('beforeend',`<div class="exam-note-editor-backdrop" id="examNoteEditorBackdrop" onclick="if(event.target===this)closeExamNoteEditor()">
    <div class="exam-note-editor" role="dialog" aria-modal="true" aria-labelledby="examNoteEditorTitle">
      <div class="exam-note-editor-head"><strong id="examNoteEditorTitle">📝 Question note</strong><button type="button" class="icon-btn" onclick="closeExamNoteEditor()" aria-label="Close note editor" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="exam-note-editor-meta">Q${exam.index+1} · ${esc(q.module||'')} · ${esc(q.subject||'')} · ${esc(q.lecture||'')}</div>
      <textarea id="examNoteEditorText" placeholder="Write your note for this question…">${esc(current)}</textarea>
      <div class="exam-note-editor-actions"><button type="button" class="btn" onclick="closeExamNoteEditor()">Cancel</button><button type="button" class="btn primary" onclick="saveExamNoteEditor('${attrJs(q.id)}')">Save note</button></div>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('examNoteEditorText')?.focus(),0);
}
function saveExamNoteEditor(qid){
  const text=document.getElementById('examNoteEditorText')?.value||'';
  saveQuestionNote(qid,text);
  closeExamNoteEditor();
  renderQuiz();
}
function closeExamNoteEditor(){document.getElementById('examNoteEditorBackdrop')?.remove();}
function toggleExamNote(){
  const wrap=document.getElementById('examAnnotationNoteWrap');
  if(wrap)wrap.classList.toggle('is-open');
}
function undoExamDrawing(){
  if(!exam)return; const data=annotationData(exam.list[exam.index]);
  if(data.strokes.length){data.strokes.pop();saveActiveExam();drawExamAnnotations();}
}
function clearExamDrawing(){
  if(!exam)return;
  const data=annotationData(exam.list[exam.index]);
  if(!data.strokes.length)return;
  if(confirm('Clear all drawings and highlights on this question?')){data.strokes=[];saveActiveExam();drawExamAnnotations();}
}
function setExamDrawingSize(v){examDrawingSize=Math.max(1,Math.min(8,Number(v)||3));}
function cycleExamDrawingSize(){const sizes=[2,4,7];const i=sizes.indexOf(Number(examDrawingSize));setExamDrawingSize(sizes[(i+1)%sizes.length]);renderQuiz();}

function examSavedNotesHTML(inPanel=false){
  if(!exam)return '';

  if(inPanel)return `<div class="exam-tool-panel-head"><strong>📝 Saved notes · ${rows.length}</strong><button class="icon-btn" type="button" onclick="closeExamToolPanel('notes')" aria-label="Close saved notes" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><button type="button" class="btn primary" style="width:100%;margin-bottom:8px" onclick="openExamNoteEditor('${attrJs(exam.list[exam.index].id)}')">${getQuestionNote(exam.list[exam.index].id)?'Edit current note':'Add note to current question'}</button><div class="exam-tool-panel-list">${list}</div>`;
  return `<details><summary><strong>📝 Saved notes</strong><span class="mini">${rows.length} saved</span><button type="button" class="btn exam-phase2-note-add" onclick="event.preventDefault();event.stopPropagation();openExamNoteEditor('${attrJs(exam.list[exam.index].id)}')">${getQuestionNote(exam.list[exam.index].id)?'Edit note':'Add note'}</button></summary><div class="phase2-notes-list">${list}</div></details>`;
}
function renderQuiz(){
  if(!exam)return go('exam');
  const q=exam.list[exam.index], selected=exam.answers[q.id];
  if(examAI.open && examAI.questionId!==q.id){
    examAI.questionId=q.id;
    examAI.messages=[];
  }
  const opts=q.options.map((o,i)=>{
    // Once an answer is selected, always reveal the correct option in green.
    // If the selected answer is wrong, keep that selected option red.
    let feedback='';
    if(selected!==undefined && exam.answerMode==='immediate'){
      if(i===q.correctIndex) feedback='correct';
      else if(i===selected) feedback='wrong';
    }
    const selectedClass=selected===i && feedback!=='correct'?'selected ':'';
    return `<button class="option ${selectedClass}${feedback}" onclick="chooseAnswer(${i})" aria-pressed="${selected===i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`;
  }).join('');
  const nav=exam.list.map((item,i)=>{
    const answered=exam.answers[item.id]!==undefined;
    const reveal=exam.answerMode==='immediate';
    const wrong=reveal && answered && exam.answers[item.id]!==item.correctIndex;
    const state=wrong?'wrong':answered?'answered':'';
    const title=reveal ? `Question ${i+1}${wrong?' — Wrong answer':answered?' — Correct answer':''}` : `Question ${i+1}${answered?' — Answered':''}`;
    return `<button class="qnav-btn ${i===exam.index?'current ':''}${state}" onclick="jumpToQuestion(${i})" title="${title}">${i+1}</button>`;
  }).join('');
  const remaining=exam.minutes?Math.max(0,exam.minutes*60-Math.floor((Date.now()-exam.started)/1000)):0;
  const answeredCount=exam.list.filter(item=>exam.answers[item.id]!==undefined).length;
  const answeredNow=selected!==undefined;
  const body=`<div class="quiz"><div class="card">
    <div class="exam-annotation-tools ${examDrawingEnabled?'is-open':''}" id="examDrawingTools" aria-label="Exam drawing tools">
      <div class="exam-annotation-toolbar">
        <button type="button" id="examDrawingToggle" class="btn exam-drawing-launcher ${examDrawingEnabled?'tool-active':''}" onclick="toggleExamDrawing()" title="Drawing tools" aria-label="Open drawing tools">✎</button>
        <div class="exam-drawing-extra">
          <button type="button" class="btn tool-btn ${examDrawingTool==='pen'?'tool-active':''}" data-tool="pen" onclick="setExamDrawingTool('pen')" title="Pen" aria-label="Pen">✎</button>
          ${examPenPaletteHTML()}
          <button type="button" class="btn tool-btn ${examDrawingTool==='highlighter'?'tool-active':''}" data-tool="highlighter" onclick="setExamDrawingTool('highlighter')" title="Highlighter" aria-label="Highlighter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 14.8 9.7-9.7a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8l-9.7 9.7H6.2a2 2 0 0 1-1.7-2.9Z"/><path d="m12.8 6.5 4.7 4.7"/><path d="M3.5 20.5h17"/></svg></button>
          <button type="button" class="btn tool-btn ${examDrawingTool==='eraser'?'tool-active':''}" data-tool="eraser" onclick="setExamDrawingTool('eraser')" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.8 15.8 8.9-8.9a2.1 2.1 0 0 1 3 0l2.4 2.4a2.1 2.1 0 0 1 0 3l-7.1 7.1H8.1a2.2 2.2 0 0 1-1.6-.7l-1.7-1.7a.9.9 0 0 1 0-1.2Z"/><path d="m12.5 9.1 5.4 5.4"/><path d="M12 19.4h8"/></svg></button>
          <button type="button" class="btn" onclick="undoExamDrawing()" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 6 6"/></svg></button>
          <button type="button" class="btn" onclick="clearExamDrawing()" title="Clear drawings" aria-label="Clear drawings"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m7 7 .8 13h8.4L17 7"/><path d="M10 11v5M14 11v5"/></svg></button>
          <button type="button" class="btn" id="examDrawingNote" onclick="toggleExamNote()" title="Private note" aria-label="Private note"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
          <button type="button" class="btn size-tool" onclick="cycleExamDrawingSize()" title="Brush size" aria-label="Brush size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M5 7h4" stroke-width="1.5"/><path d="M5 12h8" stroke-width="3"/><path d="M5 17h13" stroke-width="5"/></svg><span class="exam-size-indicator" data-size="${examDrawingSize<=2?'small':examDrawingSize>=6?'large':'medium'}"></span></button>
          <button type="button" class="btn tool-btn" onclick="toggleExamToolPanel('notes')" title="Saved notes" aria-label="Saved notes">📝</button>
          <button type="button" class="btn tool-btn" onclick="toggleExamToolPanel('folder')" title="Add to folder" aria-label="Add to folder">📁</button>
        </div>
      </div>
      <div class="exam-tool-panel" id="examNotesPanel">${examSavedNotesHTML(true)}</div>
      <div class="exam-tool-panel" id="examFolderPanel">${examFolderPanelHTML(q.id,true)}</div>
      <div class="exam-annotation-note-wrap" id="examAnnotationNoteWrap"><label class="exam-annotation-note-label">Private note</label><textarea id="examAnnotationNote" class="exam-annotation-note" placeholder="Take a private note for this question…"></textarea></div>
    </div>
    <div class="qhead"><span class="pill">${exam.index+1} / ${exam.list.length}</span><span class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</span>${exam.minutes?`<span class="timer" id="timer">${formatTime(remaining)}</span>`:''}</div>
    <div class="bar"><i style="width:${pct(exam.index,exam.list.length-1)}%"></i></div>
    <div class="question-nav" aria-label="Question navigation">
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
        <strong>Questions</strong><span class="mini">${answeredCount}/${exam.list.length} answered</span>
      </div>
      ${nav}
      <div class="nav-legend" style="width:100%">
        <span><i class="nav-dot"></i>Not answered</span>
        <span><i class="nav-dot answered"></i>Correct</span><span><i class="nav-dot wrong"></i>Wrong</span>
        <span><i class="nav-dot current"></i>Current</span>
      </div>
    </div>
    <div class="exam-annotation-viewport">
    <div class="exam-annotation-surface">
    <div class="exam-annotation-stage">
      <canvas id="examAnnotationCanvas" class="exam-annotation-canvas ${examDrawingEnabled?'drawing-enabled':''}" aria-label="Exam drawing canvas"></canvas>
      <div class="question" style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><span>${esc(q.question)}</span><div style="display:flex;gap:7px;flex:0 0 auto"><button type="button" class="btn" onclick="openQuestionReport()" title="Report this question" aria-label="Report this question">⚑</button><button type="button" class="btn" data-favorite-id="${attrJs(q.id)}" onclick='toggleFavorite(${JSON.stringify(q.id)})' title="${isFavorite(q)?'Remove from favourites':'Mark as favourite'}" aria-label="${isFavorite(q)?'Remove from favourites':'Mark as favourite'}">${isFavorite(q)?'★':'☆'}</button></div></div>
      ${q.imageUrl ? `<img class="question-illustration" src="${esc(q.imageUrl)}" alt="Question illustration" loading="eager">` : ''}
      <div class="options">${opts}</div>
    </div>
    </div>
    </div>
    ${reportPanelOpen ? questionReportHTML(q) : ''}
    ${exam.answerMode==='immediate' && selected!==undefined ? `<div class="review ${selected===q.correctIndex?'good':'bad'}"><b>${selected===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}</div>` : ''}
    ${examAI.open?examAIHTML(q,answeredNow):`<div class="exam-ai-wrap"><div class="exam-ai-trigger"><div><strong>Need an explanation?</strong><div class="mini">Ask AI about this question before or after answering.</div></div><button class="btn primary" onclick="openExamAI()">✦ Ask AI</button></div></div>`}
    <div class="quiz-footer"><button class="btn" onclick="prevQ()" ${exam.index===0?'disabled':''}>Previous</button>
    <button class="btn primary" onclick="${exam.index===exam.list.length-1?'submitExam(false)':'nextQ()'}">${exam.index===exam.list.length-1?'Submit Exam':'Next'}</button></div>
  </div></div>`;
  document.getElementById('app').innerHTML=layout('Exam','Use the numbered buttons to move between questions. You can open Ask AI at any time for a question-specific explanation.',body);
  setTimeout(()=>{initExamDrawing();},0);
  setTimeout(enhanceQuiz,0);
}

function openQuestionReport(){
  if(!exam||exam.submitted)return;
  reportPanelOpen=true;
  renderQuiz();
}
function closeQuestionReport(){
  reportPanelOpen=false;
  renderQuiz();

function updateAnswerFeedback(q,selected){
  // Update only the option/feedback DOM nodes. Do NOT replace #app here:
  // replacing the quiz markup forces the illustration <img> to download again.
  const reveal=exam.answerMode==='immediate';
  document.querySelectorAll('.quiz .option').forEach((btn,i)=>{
    btn.classList.remove('selected','correct','wrong');
    btn.setAttribute('aria-pressed', selected===i ? 'true' : 'false');
    if(selected!==undefined){
      if(reveal && i===q.correctIndex) btn.classList.add('correct');
      else if(reveal && i===selected) btn.classList.add('wrong','selected');
      else if(!reveal && i===selected) btn.classList.add('selected');
    }
  });
  document.querySelectorAll('.qnav-btn').forEach((btn,i)=>{
    const item=exam.list[i], a=exam.answers[item.id];
    btn.classList.remove('answered','wrong');
    if(a!==undefined){
      if(reveal && a!==item.correctIndex) btn.classList.add('wrong');
      else btn.classList.add('answered');
    }
  });
  const count=exam.list.filter(item=>exam.answers[item.id]!==undefined).length;
  const countEl=document.querySelector('.question-nav > div:first-child .mini');
  if(countEl) countEl.textContent=`${count}/${exam.list.length} answered`;
  enhanceQuiz();
  const review=document.querySelector('.quiz .review');
  if(review && exam.answerMode==='immediate' && selected!==undefined){
    review.className=`review ${selected===q.correctIndex?'good':'bad'}`;
    review.innerHTML=`<b>${selected===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}`;
  }else if(exam.answerMode==='immediate' && selected!==undefined){
    const options=document.querySelector('.quiz .options');
    if(options){
      options.insertAdjacentHTML('afterend',`<div class="review ${selected===q.correctIndex?'good':'bad'}"><b>${selected===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}</div>`);
    }
  }
}

async function submitExam(auto){
  if(!exam || examSubmitInProgress)return;
  if(!auto){
    const un=exam.list.filter(q=>exam.answers[q.id]===undefined).length;
    const fl=Object.keys(exam.flags||{}).filter(id=>exam.flags[id]).length;
    const msg='Submit this exam now?'+(un?`\n\n• ${un} question${un>1?'s are':' is'} unanswered`:'')+(fl?`\n• ${fl} flagged for review`:'');
    if(!confirm(msg))return;
  }
  examSubmitInProgress=true;
  clearInterval(timerId);
  const submittedExam=exam;
  try{
    let correct=0;
    const answeredQuestionsForReview=[];
    submittedExam.list.forEach(q=>{
      const a=submittedExam.answers[q.id];
      if(a===undefined)return;
      const k=key(q);
      if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
      progress[k].attempts++;
      if(a===q.correctIndex){progress[k].correct++;correct++;progress[k].last='correct';}
      else {progress[k].wrong++;progress[k].last='wrong';}
      updateSpacedRepetition(q,a===q.correctIndex);
      answeredQuestionsForReview.push(q);
      recordStudyAnswer(q.id, a===q.correctIndex);
    });
    saveState();
    const unanswered=submittedExam.list.filter(q=>submittedExam.answers[q.id]===undefined).length;
    const durationSec=Math.round((Date.now()-submittedExam.started)/1000);
    const result={
      id:'exam_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
      date:new Date().toISOString(),
      label:submittedExam.label||'Exam',
      moduleFilter:submittedExam.moduleFilter||'',
      subjectFilter:submittedExam.subjectFilter||'',
      lectureFilter:submittedExam.lectureFilter||'',
      total:submittedExam.list.length,
      answered:submittedExam.list.length-unanswered,
      correct, unanswered,
      answerMode:submittedExam.answerMode||'finish',
      accuracy:pct(correct,submittedExam.list.length-unanswered),
      durationSec,
      examMinutes:Number(submittedExam.minutes||0),
      list:submittedExam.list,
      answers:submittedExam.answers,
      auto
    };

    // Persist and navigate before remote requests. Cloud sync must never trap a student on Submit.
    submittedExam.annotations={};
    exam=null;
    clearActiveExam();
    safeSetItem(CONFIG.lastResultKey,JSON.stringify(result));
    saveHistory(result);
    examSubmitInProgress=false;
    document.getElementById('toast')?.classList.add('hidden');
    go('results');

    const cloudTasks=[];
    const addTask=fn=>cloudTasks.push(Promise.resolve().then(fn));
    if(!currentUser){
      addTask(()=>syncVisitorExamToSupabase(result));
      for(const q of answeredQuestionsForReview){
        const selected=result.answers[q.id];
        addTask(()=>syncVisitorAnswerToSupabase(q,selected===q.correctIndex,result.id));
      }
    }
    if(SUPABASE_ENABLED)addTask(()=>recordExamForAnalytics(result));
    if(SUPABASE_ENABLED && currentUser){
      addTask(()=>saveExamToSupabase(result));
      for(const q of result.list){
        const selected=result.answers[q.id];
        if(selected===undefined)continue;
        addTask(()=>recordAttemptToSupabase(q,selected,selected===q.correctIndex,result.id));
      }
      addTask(()=>syncReviewSchedulesToSupabase(answeredQuestionsForReview));
      addTask(()=>syncLocalProgressToSupabase());
      addTask(()=>loadGlobalAnalytics());
    }
    Promise.allSettled(cloudTasks).then(results=>{
      const failed=results.filter(x=>x.status==='rejected');
      if(failed.length)console.warn('Some background exam sync tasks failed:',failed.length,failed[0].reason);
    });
  }catch(error){
    console.error('Exam submission failed locally:',error);
    examSubmitInProgress=false;
    toast('The exam could not be submitted safely. Your answers are still available; please try again.','error');
  }
}

function questionUniverse(){

function startResultReview(mode='incorrect',module='',subject='',lecture=''){
  const r=loadJSON(CONFIG.lastResultKey,null);if(!r||!Array.isArray(r.list)){toast('No exam result is available to review.','error');return;}
  const list=r.list.filter(q=>{
    if(module&&String(q.module||'')!==module)return false;
    if(subject&&String(q.subject||'')!==subject)return false;
    if(lecture&&String(q.lecture||'')!==lecture)return false;
    const a=r.answers?.[q.id];
    if(mode==='incorrect')return a!==undefined&&a!==q.correctIndex;
    if(mode==='unanswered')return a===undefined;
    return a===undefined||a!==q.correctIndex;
  });
  if(!list.length){toast('There are no questions matching this review selection.','ok');return;}
  startExam(list,null,`${mode==='incorrect'?'Incorrect':mode==='unanswered'?'Unanswered':'Incorrect & unanswered'} review · ${r.label||'Exam'}`);
}
function resultTopicAnalysisHTML(r){
  const map=new Map();
  (r.list||[]).forEach(q=>{
    const module=String(q.module||'Other'),subject=String(q.subject||'Uncategorized'),lecture=String(q.lecture||'Unspecified lecture');
    const k=JSON.stringify([module,subject,lecture]);let t=map.get(k);
    if(!t){t={module,subject,lecture,total:0,answered:0,correct:0,wrong:0,unanswered:0};map.set(k,t);}
    t.total++;const a=r.answers?.[q.id];if(a===undefined)t.unanswered++;else{t.answered++;if(a===q.correctIndex)t.correct++;else t.wrong++;}
  });
  const topics=[...map.values()].map(t=>({...t,accuracy:pct(t.correct,t.answered),needsReview:t.wrong+t.unanswered})).sort((a,b)=>b.needsReview-a.needsReview||a.accuracy-b.accuracy||a.module.localeCompare(b.module));
  if(!topics.length)return '';
  return `<section class="card" style="margin-top:16px"><div class="category-head"><div><strong>Topic-by-topic performance</strong><div class="mini">Find the lectures that need attention in this exam.</div></div><span class="pill">${topics.length} topics</span></div><div class="result-topic-grid">${topics.map(t=>`<div class="result-topic-card"><div class="result-topic-title">${esc(t.lecture)}</div><div class="result-topic-meta">${esc(t.module)} · ${esc(t.subject)}</div><div class="bar"><i style="width:${t.accuracy}%;background:${t.accuracy>=80?'var(--ok)':t.accuracy>=60?'var(--primary)':'var(--danger)'}"></i></div><div class="result-topic-stats"><span class="good">${t.correct} correct</span><span class="bad">${t.wrong} wrong</span><span>${t.unanswered} unanswered</span><b>${t.accuracy}%</b></div>${t.needsReview?`<button class="btn" onclick="startResultReview('all','${attrJs(t.module)}','${attrJs(t.subject)}','${attrJs(t.lecture)}')">Practise ${t.needsReview} to review</button>`:'<div class="mini" style="margin-top:10px;color:var(--ok)">All answered correctly</div>'}</div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="startResultReview('all')">Practice all incorrect + unanswered</button><button class="btn" onclick="startResultReview('incorrect')">Incorrect only</button><button class="btn" onclick="startResultReview('unanswered')">Unanswered only</button></div></section>`;
}

function retakeExamFromResult(){

async function loadPublicFlashcards(force=false){
  // Shared MedEx cards load for all users; the management/question-bank screen remains admin-only.
  if((publicFlashcardsLoaded && !force && Date.now()-publicFlashcardsLastAttempt<300000) || !SUPABASE_ENABLED){
    if(!SUPABASE_ENABLED) publicFlashcardsError='Supabase is not configured in this build.';
    return false;
  }
  if(publicFlashcardsLoading)return false;
  publicFlashcardsLoading=true;publicFlashcardsLastAttempt=Date.now();publicFlashcardsError='';
  try{
    // Page through the table (Supabase returns at most ~1000 rows per request) and treat active=null as active.
    const data=[],FC_PAGE=500;
    for(let from=0,guard=0;guard<200;guard++,from+=FC_PAGE){
      let res=null;
      for(let t=0;t<3;t++){
        res=await supabaseClient.from('flashcards_public')
          .select('id,front,back,module,subject,lecture,tags,deck,semester,created_at,updated_at')
          .or('active.eq.true,active.is.null')
          .order('created_at',{ascending:true}).order('id',{ascending:true})
          .range(from,from+FC_PAGE-1);
        if(!res.error)break;
        await new Promise(r=>setTimeout(r,400*(t+1)));
      }
      if(res.error){publicFlashcardsError=res.error.message||'Supabase query failed.';console.warn('Public flashcards load failed:',res.error);return false;}
      const rows=res.data||[];
      data.push(...rows);
      if(rows.length<FC_PAGE)break;
    }
    window.__medexFlashcardLoadInfo={fetched:data.length};
    const remote=(data||[]).map(c=>({id:String(c.id),front:String(c.front||''),back:String(c.back||''),module:String(c.module||''),subject:String(c.subject||''),lecture:String(c.lecture||''),tags:Array.isArray(c.tags)?c.tags.join(', '):String(c.tags||''),deck:String(c.deck||''),semester:c.semester==null?null:Number(c.semester),source:'public',createdAt:c.created_at?Date.parse(c.created_at):Date.now(),updatedAt:c.updated_at?Date.parse(c.updated_at):Date.now()})).filter(c=>c.front&&c.back);
    const locals=flashcardCards.filter(c=>c.source!=='public');
    const byId=new Map(remote.map(c=>[c.id,c]));
    locals.forEach(c=>byId.has(String(c.id))&&byId.delete(String(c.id)));
    flashcardCards=[...locals,...byId.values()]; saveFlashcardCards(); publicFlashcardsLoaded=true; publicFlashcardsError=''; return true;
  }catch(e){publicFlashcardsError=e?.message||String(e)||'Unexpected error loading flashcards.';console.warn('Public flashcards load failed:',e);return false;}
  finally{
    publicFlashcardsLoading=false;
    if(location.hash.replace('#','')==='flashcards'&&!flashcardSession){setTimeout(()=>{if(location.hash.replace('#','')==='flashcards'&&!flashcardSession)renderFlashcards();},0);}
  }
}

function parseCSVLine(line){const out=[];let cur='',quote=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quote&&line[i+1]==='"'){cur+='"';i++;}else quote=!quote;}else if(ch===','&&!quote){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;}
function parseFlashcardCSV(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return [];
  const headers=parseCSVLine(lines[0]).map(x=>x.trim().toLowerCase());
  const idx=name=>headers.indexOf(name); const frontI=idx('front')>=0?idx('front'):idx('question'); const backI=idx('back')>=0?idx('back'):idx('answer');
  if(frontI<0||backI<0)throw new Error('CSV must contain at least "front" and "back" columns.');
  return lines.slice(1).map((line,n)=>{const c=parseCSVLine(line);return {id:flashcardCardId(),front:String(c[frontI]||'').trim(),back:String(c[backI]||'').trim(),module:String(c[idx('module')]||'').trim(),subject:String(c[idx('subject')]||'').trim(),lecture:String(c[idx('lecture')]||'').trim(),tags:String(c[idx('tags')]||'').trim(),deck:String(c[idx('deck')]||'').trim(),source:'local',createdAt:Date.now()+n,updatedAt:Date.now()+n};}).filter(c=>c.front&&c.back);
}
function importFlashcardsCSV(inputId='flashcardCSVInput'){
  const file=document.getElementById(inputId)?.files?.[0];if(!file)return toast('Choose a CSV file first.','error');
  const reader=new FileReader();reader.onload=()=>{try{const rows=parseFlashcardCSV(reader.result);let added=0;for(const c of rows){const dup=flashcardCards.some(x=>x.front.toLowerCase()===c.front.toLowerCase()&&x.back.toLowerCase()===c.back.toLowerCase());if(!dup){flashcardCards.push(c);added++;}}saveFlashcardCards();renderFlashcards();toast(`Imported ${added} local flashcard${added===1?'':'s'}. They were not uploaded to Supabase.`,'ok');}catch(e){toast(e.message||'Invalid CSV.','error');}};reader.readAsText(file);
}
function importAdminFlashcardsCSV(inputId='adminFlashcardCSV'){const file=document.getElementById(inputId)?.files?.[0];if(!file)return toast('Choose a CSV file first.','error');const reader=new FileReader();reader.onload=()=>{try{const rows=parseFlashcardCSV(reader.result).map(c=>({...c,semester:getSelectedSemester()||null,source:'admin-draft',selected:true}));flashcardAdminDrafts=[...flashcardAdminDrafts,...rows];saveFlashcardAdminDrafts();renderFlashcardAdmin();toast(`Imported ${rows.length} draft cards for review.`,'ok');}catch(e){toast(e.message||'Invalid CSV.','error');}};reader.readAsText(file);}

function flashcardIntervalLabel(days){days=Math.max(0,Number(days)||0);if(days<1){const minutes=Math.max(1,Math.round(days*1440));return minutes<60?`${minutes}m`:`${Math.round(minutes/60)}h`;}if(days<30)return `${Math.max(1,Math.round(days))}d`;if(days<365)return `${Math.round(days/30)}mo`;return `${(days/365).toFixed(1)}y`;}
function flashcardDueLabel(card){const p=flashcardRecord(card);if(p.state==='new')return 'New';if(p.suspended)return 'Suspended';const t=Number(p.due||0);if(!t)return 'Due now';const diff=t-Date.now();if(diff<=0)return 'Due now';if(diff<3600000)return `Due in ${Math.max(1,Math.round(diff/60000))}m`;if(diff<86400000)return `Due in ${Math.max(1,Math.round(diff/3600000))}h`;return `Due ${new Date(t).toLocaleDateString()}`;}

function flashcardRatingSchedule(card,rating){
  const p=flashcardRecord(card),wasNew=p.state==='new',wasLearning=p.state==='learning'||p.state==='relearning',wasReview=p.state==='review';
  const daily=flashcardDailyStats(),row=daily.row;p.lastRating=rating;p.lastReviewedAt=Date.now();p.reviews=Number(p.reviews||0)+1;p.reps=Number(p.reps||0)+1;
  const learnSteps=[1,10],relearnSteps=[10];
  if(wasNew||wasLearning){
    if(rating==='again'){p.state=wasNew?'learning':p.state;p.learningStep=0;flashcardSchedule(p,learnSteps[0],p.state==='relearning'?'relearning':'learning');}
    else if(rating==='hard'){const base=wasLearning?(learnSteps[Math.min(p.learningStep||0,learnSteps.length-1)]||10):6;flashcardSchedule(p,Math.max(6,base),p.state);}
    else if(rating==='good'){if((p.learningStep||0)<learnSteps.length-1){p.learningStep=(p.learningStep||0)+1;flashcardSchedule(p,learnSteps[p.learningStep],p.state);}else{p.state='review';p.intervalDays=1;p.ease=2.5;flashcardSchedule(p,1440,'review');}}

    else if(rating==='good'){p.intervalDays=Math.max(1,old*Number(p.ease||2.5));flashcardSchedule(p,Math.round(p.intervalDays*1440),'review');}
    else if(rating==='easy'){p.ease=Math.min(3.0,Number(p.ease||2.5)+0.15);p.intervalDays=Math.max(4,old*Number(p.ease||2.5)*1.3);flashcardSchedule(p,Math.round(p.intervalDays*1440),'review');}
  }else if(p.state==='relearning'){
    if(rating==='again')flashcardSchedule(p,relearnSteps[0],'relearning');else if(rating==='good'||rating==='easy'){p.state='review';p.intervalDays=1;flashcardSchedule(p,1440,'review');}else flashcardSchedule(p,10,'relearning');
  }
  row[rating]=Number(row[rating]||0)+1;row.reviews=Number(row.reviews||0)+1;if(wasNew)row.newCards=Number(row.newCards||0)+1;saveFlashcardDailyStats(row);p.lastRating=rating;p.lastReviewedAt=Date.now();saveFlashcardState();return p;
}

  const card=s.list[s.index],p=flashcardRecord(card),answer=flashcardAnswerPointsHTML(card.back),favorite=p.favorite===true;const labels={again:'1m',hard:(p.state==='review'?flashcardIntervalLabel(Math.max(1,(Number(p.intervalDays)||1)*1.2)):'6m'),good:(p.state==='review'?flashcardIntervalLabel(Math.max(1,(Number(p.intervalDays)||1)*(Number(p.ease)||2.5))):((p.learningStep||0)<1?'10m':'1d')),easy:(p.state==='review'?flashcardIntervalLabel(Math.max(4,(Number(p.intervalDays)||1)*(Number(p.ease)||2.5)*1.3)):'4d')};

ngPanelHTML(card):''}<div class="study-flash-footer"><span>${s.revealed?'Rate your recall · 1 Again · 2 Hard · 3 Good · 4 Easy':'Active recall first'}</span><span>${s.list.length-s.index-1} remaining</span></div></article>`;

let flashcardDrawingTool='pen';let flashcardDrawingColor='#172033';
function flashcardDrawingPanelHTML(card){const s=flashcardSession;const key=String(card.id);const colors=['#172033','#d32f2f','#1976d2','#16834a','#f2c94c','#8e44ad'];return `<div class="flashcard-draw-panel"><div class="flashcard-draw-toolbar"><button class="btn ${flashcardDrawingTool==='pen'?'primary':''}" onclick="setFlashcardDrawingTool('pen')">✎ Pen</button><button class="btn ${flashcardDrawingTool==='highlighter'?'primary':''}" onclick="setFlashcardDrawingTool('highlighter')">▰ Highlight</button><button class="btn ${flashcardDrawingTool==='eraser'?'primary':''}" onclick="setFlashcardDrawingTool('eraser')">⌫ Eraser</button>${colors.map(c=>`<button class="flashcard-draw-color ${flashcardDrawingColor===c?'active':''}" style="background:${c}" onclick="setFlashcardDrawingColor('${c}')" aria-label="Pen color ${c}" title="Pen color"></button>`).join('')}<button class="btn" onclick="clearFlashcardDrawing()">Clear</button></div><canvas id="flashcardDrawingCanvas" class="flashcard-draw-canvas" aria-label="Flashcard drawing canvas"></canvas><div class="mini" style="margin-top:7px">Draw with one finger or mouse. Your sketch stays with this card during the current review session.</div></div>`;}

function initFlashcardDrawingCanvas(card){const canvas=document.getElementById('flashcardDrawingCanvas');if(!canvas||canvas.dataset.ready==='1')return;canvas.dataset.ready='1';const ctx=canvas.getContext('2d');const dpr=Math.max(1,window.devicePixelRatio||1);const rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';const key=String(card.id);const saved=flashcardSession?.drawings?.[key];if(saved){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=saved;}let drawing=false;const point=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};const begin=e=>{if(e.pointerType==='touch'&&e.isPrimary===false)return;e.preventDefault();drawing=true;canvas.setPointerCapture?.(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.globalCompositeOperation=flashcardDrawingTool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=flashcardDrawingTool==='highlighter'?'rgba(242,201,76,.42)':flashcardDrawingColor;ctx.lineWidth=flashcardDrawingTool==='eraser'?20:(flashcardDrawingTool==='highlighter'?16:3);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke();};const move=e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();};const end=()=>{if(!drawing)return;drawing=false;ctx.globalCompositeOperation='source-over';if(!flashcardSession.drawings)flashcardSession.drawings={};try{flashcardSession.drawings[key]=canvas.toDataURL('image/png');}catch(_){}};canvas.addEventListener('pointerdown',begin);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('pointerleave',end);}

function createStudyPlan(){
  const name=prompt('Plan name','Medical exam preparation'); if(!name)return;
  const days=Math.max(1,Math.min(365,Number(prompt('Number of days','30'))||30));
  const target=Math.max(1,Math.min(500,Number(prompt('Questions per day',String(getDailyGoal())))||getDailyGoal()));
  const plans=studyPlans(); plans.push({id:'plan_'+Date.now(),name,days,target,createdAt:Date.now(),examDate:''}); saveStudyPlans(plans); renderStudyTools();
}

}

function achievements(){

  const streak=studyStreak(); const days=studyStats().daysStudied; const due=dueSpacedQuestions().length;

    ['First 10 questions',total>=10],['50 questions',total>=50],['100 correct answers',correct>=100],['7-day streak',streak>=7],['7 study days',days>=7],['Spaced review started',due>0]
  ];

function startFocusTimer(){
  if(focusTimerState.running)return;
  const remain=Math.max(0,Number(focusTimerState.remaining||0));
  if(!remain){resetFocusTimer(focusTimerState.preset||1500);return;}
  focusTimerState.running=true;
  focusTimerState.endTime=Date.now()+remain*1000;
  focusTimerState.startedAt=Date.now();
  saveFocusState();runFocusTimer();updateTopbarControls();
  if(location.hash.replace('#','')==='tools')renderStudyTools();
}
function pauseFocusTimer(){
  if(!focusTimerState.running)return;
  focusTimerState.remaining=Math.max(0,Math.ceil((Number(focusTimerState.endTime||Date.now())-Date.now())/1000));
  focusTimerState.running=false;focusTimerState.endTime=0;focusTimerState.startedAt=0;
  saveFocusState();clearInterval(focusTimerId);focusTimerId=null;updateTopbarControls();
  if(location.hash.replace('#','')==='tools')renderStudyTools();
}
function resetFocusTimer(seconds=focusTimerState.preset||1500){clearInterval(focusTimerId);focusTimerId=null;focusTimerState={remaining:seconds,running:false,endTime:0,startedAt:0,label:focusTimerState.label||'Focused study',preset:seconds};saveFocusState();updateTopbarControls();if(location.hash.replace('#','')==='tools')renderStudyTools();}
function saveFocusState(){safeSetItem(CONFIG.focusStateKey,JSON.stringify(focusTimerState));}
function focusLabelChanged(v){focusTimerState.label=String(v||'Focused study');saveFocusState();updateTopbarControls();}
function runFocusTimer(){
  clearInterval(focusTimerId);if(!focusTimerState.running)return;
  const tick=()=>{
    if(!focusTimerState.running){clearInterval(focusTimerId);focusTimerId=null;return;}
    const remain=Math.max(0,Math.ceil((Number(focusTimerState.endTime||Date.now())-Date.now())/1000));
    focusTimerState.remaining=remain;
    const el=document.getElementById('focusTimerDisplay');if(el)el.textContent=formatTime(remain);
    document.querySelectorAll('.global-focus-timer-display').forEach(x=>x.textContent=formatTime(remain));
    if(remain<=0){
      focusTimerState.running=false;focusTimerState.endTime=0;focusTimerState.startedAt=0;saveFocusState();
      clearInterval(focusTimerId);focusTimerId=null;updateTopbarControls();toast('Focus session complete. Nice work.','ok');
      if('Notification' in window&&Notification.permission==='granted')navigator.serviceWorker?.ready.then(r=>r.showNotification('MedEx Focus complete',{body:focusTimerState.label||'Your study session is complete.'})).catch(()=>{});
    }else if(remain%5===0){saveFocusState();}
  };
  tick();focusTimerId=setInterval(tick,1000);
}
function focusPreset(seconds){focusTimerState.preset=seconds;focusTimerState.remaining=seconds;focusTimerState.running=false;focusTimerState.startedAt=0;saveFocusState();updateTopbarControls();if(location.hash.replace('#','')==='tools')renderStudyTools();}
function requestFocusNotifications(){if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});}
function focusTimerHTML(){const remain=Math.max(0,Number(focusTimerState.remaining||1500));const presets=[1500,3000,3600];return `<section class="study-tools-card focus-timer-card"><span class="study-eyebrow">FOCUS MODE</span><h3 style="margin-top:5px">One task. No distractions.</h3><input class="field" style="max-width:320px;width:100%;margin-top:8px;text-align:center" value="${esc(focusTimerState.label||'Focused study')}" onchange="focusLabelChanged(this.value)" placeholder="What are you studying?"><div id="focusTimerDisplay" class="focus-timer">${formatTime(remain)}</div><div class="focus-status">${focusTimerState.running?'Session running':'Ready to focus'}</div><div class="focus-presets">${presets.map(x=>`<button class="btn focus-preset ${focusTimerState.preset===x?'active':''}" onclick="focusPreset(${x})">${x/60} min</button>`).join('')}</div><div class="actions" style="margin-top:12px;justify-content:center"><button class="btn primary" onclick="${focusTimerState.running?'pauseFocusTimer()':'startFocusTimer()'}">${focusTimerState.running?'Pause':'Start focus'}</button><button class="btn" onclick="resetFocusTimer()">Reset</button><button class="btn" onclick="requestFocusNotifications()">Allow completion alert</button></div></section>`;}

async function gradeWrittenAnswer(){if(!writtenPractice||writtenPractice.busy)return;const q=writtenPractice.list[writtenPractice.index],input=document.getElementById('writtenAnswerInput');const answer=(input?.value||'').trim();if(!answer){toast('Write an answer first.','error');return;}writtenPractice.busy=true;renderWrittenPractice();try{const prompt=`You are a medical education tutor grading a student's written answer. Be concise but specific. Do not invent facts. Question: ${q.question}\nExpected correct option: ${q.options?.[q.correctIndex]||''}\nExplanation: ${q.explanation||'No explanation provided.'}\nStudent answer: ${answer}\nGive: 1) a brief verdict, 2) what the student got right, 3) what is missing or incorrect, 4) one improved model answer. Use plain text and bullets.`;const reply=await callAI([{role:'user',parts:[{text:prompt}]}],{maxOutputTokens:1200,responseMimeType:'text/plain'});writtenPractice.feedback=esc(formatAIChatReply(reply));}catch(e){writtenPractice.feedback=`AI grading failed: ${esc(e.message||String(e))}`;}finally{writtenPractice.busy=false;renderWrittenPractice();}}

function detailedProgressTreeHTML(){
  const modules=[...new Set(bank.map(q=>String(q.module||'Uncategorized')))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
  return `<div class="progress-tree">${modules.map((module,mi)=>{
    const mqs=bank.filter(q=>String(q.module||'Uncategorized')===module);
    const mAttempts=mqs.reduce((n,q)=>n+Number(progress[key(q)]?.attempts||0),0);
    const mCorrect=mqs.reduce((n,q)=>n+Number(progress[key(q)]?.correct||0),0);
    const mProgress=progressFor(mqs);
    const subjects=[...new Set(mqs.map(q=>String(q.subject||'Uncategorized')))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
    return `<details class="progress-tree-module" ${mi===0?'open':''}><summary><div style="min-width:0;flex:1"><b>${esc(module)}</b><div class="mini">${mqs.length} questions · ${mqs.filter(q=>Number(progress[key(q)]?.attempts||0)>0).length} practiced · ${mAttempts} attempts</div><div class="bar" style="margin-top:8px"><i style="width:${mProgress}%"></i></div></div><div style="display:flex;align-items:center;gap:10px"><span class="pill">${mAttempts?pct(mCorrect,mAttempts):0}% accuracy</span><span class="progress-tree-arrow">›</span></div></summary><div class="progress-tree-subjects">${subjects.map((subject,si)=>{
      const sqs=mqs.filter(q=>String(q.subject||'Uncategorized')===subject);
      const sAttempts=sqs.reduce((n,q)=>n+Number(progress[key(q)]?.attempts||0),0);
      const sCorrect=sqs.reduce((n,q)=>n+Number(progress[key(q)]?.correct||0),0);
      const sProgress=progressFor(sqs);
      const lectures=[...new Set(sqs.map(q=>String(q.lecture||'Uncategorized')))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
      return `<details class="progress-tree-subject" ${si===0?'open':''}><summary><div style="min-width:0;flex:1"><b>${esc(subject)}</b><div class="mini">${sqs.length} questions · ${sqs.filter(q=>Number(progress[key(q)]?.attempts||0)>0).length} practiced · ${sAttempts} attempts</div><div class="bar" style="margin-top:7px"><i style="width:${sProgress}%"></i></div></div><span class="pill">${sAttempts?pct(sCorrect,sAttempts):0}%</span></summary><div class="progress-tree-lectures">${lectures.map(lecture=>{
        const lqs=sqs.filter(q=>String(q.lecture||'Uncategorized')===lecture);
        const attempts=lqs.reduce((n,q)=>n+Number(progress[key(q)]?.attempts||0),0);
        const correct=lqs.reduce((n,q)=>n+Number(progress[key(q)]?.correct||0),0);
        const practiced=lqs.filter(q=>Number(progress[key(q)]?.attempts||0)>0).length;
        const acc=attempts?pct(correct,attempts):0;
        return `<div class="progress-tree-lecture"><div class="progress-tree-lecture-title"><strong>${esc(lecture)}</strong><span>${practiced}/${lqs.length} practiced · ${attempts} attempts</span></div><div><div class="bar"><i style="width:${acc}%"></i></div><div class="mini" style="margin-top:5px">Progress ${progressFor(lqs)}% · Accuracy ${acc}%</div></div><div class="progress-tree-lecture-stat">${correct} correct<br>${Math.max(0,attempts-correct)} wrong</div></div>`;
      }).join('')}</div></details>`;
    }).join('')}</div></details>`;
  }).join('')||'<div class="card empty">No visible modules or questions loaded.</div>'}</div>`;
}

function renderMistakes(){
  const wrong=bank.filter(q=>progress[key(q)]&&progress[key(q)].wrong>0);
  const topicMap=new Map();
  wrong.forEach(q=>{
    const p=progress[key(q)]||{};
    const topicKey=[q.module,q.subject,q.lecture].map(String).join('|||');
    const row=topicMap.get(topicKey)||{module:q.module,subject:q.subject,lecture:q.lecture,attempts:0,wrong:0,correct:0,questions:0};
    row.attempts+=Number(p.attempts||0); row.wrong+=Number(p.wrong||0); row.correct+=Number(p.correct||0); row.questions++;
    topicMap.set(topicKey,row);
  });
  const weakTopics=[...topicMap.values()].map(x=>({...x,errorRate:x.attempts?Math.round((x.wrong/x.attempts)*100):0}))
    .sort((a,b)=>b.errorRate-a.errorRate||b.wrong-a.wrong||b.attempts-a.attempts);
  const weakHtml=weakTopics.length?weakTopics.map((t,i)=>`<div class="category-card" style="margin-top:10px"><div class="category-head"><div><b>#${i+1} ${esc(t.lecture)}</b><div class="mini">${esc(t.module)} · ${esc(t.subject)} · ${t.questions} question${t.questions===1?'':'s'}</div></div><span class="pill">${t.errorRate}% weak</span></div><div class="mini" style="margin-top:8px">${t.wrong} wrong · ${t.correct} correct · ${t.attempts} attempts</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,t.errorRate)}%"></i></div></div>`).join(''):'<div class="empty">No weak topics yet. Answer some questions incorrectly to build your weakness analytics.</div>';
  const questionHtml=wrong.length?wrong.map(q=>`<div class="category-card"><div class="category-head"><b>${esc(q.question)}</b><span class="pill">${progress[key(q)].wrong} wrong</span></div><div class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)} · Correct: ${esc(q.options[q.correctIndex])}</div></div>`).join(''):'<div class="empty">No mistakes yet. Great work.</div>';
  const body=`<div class="card"><div class="category-head"><div><strong>Weak topics</strong><div class="mini">Topics are ranked from most weak to least weak using wrong answers ÷ attempts.</div></div><span class="pill">${weakTopics.length} topics</span></div>${weakHtml}</div>
  <div class="card" style="margin-top:16px"><div class="category-head"><strong>${wrong.length} questions in your mistakes bank</strong><span class="mini">Wrong answers are retained locally.</span></div><div style="margin-top:14px">${questionHtml}</div>${wrong.length?`<div class="actions" style="margin-top:16px"><button class="btn primary" onclick="startExam(bank.filter(q=>progress[key(q)]&&progress[key(q)].wrong>0))">Practice Mistakes</button></div>`:''}</div>`;
  document.getElementById('app').innerHTML=layout('Mistakes','Review incorrect questions and see your weakest topics ranked first.',body);
}

let bankPage=0;
const BANK_PAGE_SIZE=500;
function filterBank(resetPage=true){
  const s=(document.getElementById('bankSearch')?.value||'').toLowerCase(),mod=document.getElementById('bankModule')?.value||'',subj=document.getElementById('bankSubject')?.value||'',lect=document.getElementById('bankLecture')?.value||'',src=document.getElementById('bankSource')?.value||'';
  if(resetPage) bankPage=0;
  const list=bank.filter(q=>(!s||[q.id,q.question,q.subject,q.module,q.lecture].join(' ').toLowerCase().includes(s))&&(!mod||q.module===mod)&&(!subj||q.subject===subj)&&(!lect||q.lecture===lect)&&(!src||q.source===src));
  const rows=document.getElementById('bankRows');if(!rows)return;
  const totalPages=Math.max(1,Math.ceil(list.length/BANK_PAGE_SIZE));
  if(bankPage>=totalPages) bankPage=totalPages-1;
  const start=bankPage*BANK_PAGE_SIZE;
  const pageRows=list.slice(start,start+BANK_PAGE_SIZE);
  rows.innerHTML=pageRows.map(q=>`<tr><td><b>${esc(q.id)}</b></td><td>${esc(q.module)}</td><td>${esc(q.subject)}</td><td>${esc(q.lecture)}</td><td>${esc(q.question)}</td><td>${progressFor([q])}% · ${accuracyFor([q])}% acc.</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching questions.</td></tr>';
  const table=rows.closest('.table-wrap');
  if(table){
    let pager=document.getElementById('bankPager');
    if(!pager){ pager=document.createElement('div'); pager.id='bankPager'; pager.className='actions'; table.parentElement.appendChild(pager); }
    pager.innerHTML=`<span class="mini">Showing ${list.length?start+1:0}–${Math.min(start+BANK_PAGE_SIZE,list.length)} of ${list.length} matching questions</span><button class="btn" ${bankPage<=0?'disabled':''} onclick="bankPage--;filterBank(false)">Previous</button><span class="mini">Page ${bankPage+1} / ${totalPages}</span><button class="btn" ${bankPage>=totalPages-1?'disabled':''} onclick="bankPage++;filterBank(false)">Next</button>`;
  }
}

function adminPrintSource(){
  return (allQuestionBank.length?allQuestionBank:bank).filter(q=>q && q.question && Array.isArray(q.options) && q.options.length);
}
function adminPrintUnique(field, filters={}){
  const rows=adminPrintSource().filter(q=>Object.entries(filters).every(([k,v])=>!v||String(q[k]||'')===String(v)));
  return [...new Set(rows.map(q=>String(q[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
}
function fillAdminPrintSelect(id, values, selected=''){
  const el=document.getElementById(id); if(!el)return;
  el.innerHTML='<option value="">'+(id==='printModule'?'All modules':id==='printSubject'?'All subjects':'All lectures')+'</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(values.includes(selected)) el.value=selected;
}
function updateAdminPrintFilters(){
  const module=document.getElementById('printModule')?.value||'';
  const subject=document.getElementById('printSubject')?.value||'';
  const lecture=document.getElementById('printLecture')?.value||'';
  const subjects=adminPrintUnique('subject',{module});
  const lectures=adminPrintUnique('lecture',{module,subject});
  fillAdminPrintSelect('printSubject',subjects,subject);
  fillAdminPrintSelect('printLecture',lectures,lecture);
  const selectedModule=document.getElementById('printModule')?.value||'';
  const selectedSubject=document.getElementById('printSubject')?.value||'';
  const selectedLecture=document.getElementById('printLecture')?.value||'';
  const rows=adminPrintSource().filter(q=>(!selectedModule||q.module===selectedModule)&&(!selectedSubject||q.subject===selectedSubject)&&(!selectedLecture||q.lecture===selectedLecture));
  const count=document.getElementById('adminPrintCount');
  if(count) count.textContent=`${rows.length} question${rows.length===1?'':'s'} selected · grouped automatically by Module → Subject → Lecture`;
  if(!document.getElementById('printModule')?.dataset.ready){
    const modules=adminPrintUnique('module');
    fillAdminPrintSelect('printModule',modules,selectedModule);
    document.getElementById('printModule').dataset.ready='1';
  }
}
function resetAdminPrintFilters(){
  const m=document.getElementById('printModule'),s=document.getElementById('printSubject'),l=document.getElementById('printLecture');
  if(m)m.value=''; if(s)s.value=''; if(l)l.value='';
  updateAdminPrintFilters();
}
function adminPrintEscapeHTML(v){return esc(v==null?'':String(v));}
function adminPrintCleanOption(value,index){
  const raw=String(value==null?'':value).trim();
  // Question-bank imports may already contain A./B./C. prefixes. Do not print
  // those prefixes twice when the PDF renderer adds its own option labels.
  const expected=String.fromCharCode(65+index);
  const stripped=raw.replace(/^[A-Ea-e][\.)]\s*/,'').trim();
  return stripped || raw;
}
function adminPrintOptionLines(q){
  return q.options.map((o,i)=>`<div class="medex-print-opt"><b>${String.fromCharCode(65+i)}.</b> ${adminPrintEscapeHTML(adminPrintCleanOption(o,i))}</div>`).join('');
}
function adminPrintQuestionBlock(q,showAnswers,showExplanations,number){
  const answer=showAnswers?`<div class="medex-print-answer">${String.fromCharCode(65+(Number(q.correctIndex)||0))}</div>`:'';
  return `<article class="medex-print-q"><div class="medex-print-qbody"><div class="medex-print-qtext"><span class="medex-print-qnum">${number}.</span> ${adminPrintEscapeHTML(q.question)}</div>${adminPrintOptionLines(q)}${showExplanations&&q.explanation?`<div class="medex-print-expl"><b>Explanation:</b> ${adminPrintEscapeHTML(q.explanation)}</div>`:''}</div>${answer}</article>`;
}
function adminPrintChunkQuestions(rows,showAnswers,showExplanations){
  // v41.15: A4 landscape, two-column reference-style packing. The browser print CSS
  // keeps each question indivisible; this conservative weight only decides where a
  // new physical page starts before the two-column CSS flow takes over.
  const pages=[]; let page=[]; let weight=0; const LIMIT=150;
  rows.forEach(q=>{
    const text=String(q.question||'').length + q.options.reduce((n,o)=>n+String(o||'').length,0);
    const w=Math.max(8,Math.ceil(text/105)) + (showExplanations&&q.explanation?5:0);
    if(page.length && weight+w>LIMIT){pages.push(page);page=[];weight=0;}
    page.push(q);weight+=w;
  });
  if(page.length)pages.push(page);
  return pages;
}

    <div class="medex-print-topic">${adminPrintEscapeHTML(g.lecture)}</div>

    <footer class="medex-print-footer"><div><span class="sig">MedEx — Medical Examination Platform</span><br>Official Question Book · ${total} questions</div><div class="page-number">1</div><div class="context">Module: ${adminPrintEscapeHTML(g.module)} · Subject: ${adminPrintEscapeHTML(g.subject)} · Lecture: ${adminPrintEscapeHTML(g.lecture)}</div></footer>
  </section>`;

  try{
    w.document.open();
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedEx Question book</title><style>${printCSS}</style></head><body>${skeleton(groups[0])}</body></html>`);
    w.document.close();

    const paginate=()=>{
      try{
        const measurePage=w.document.getElementById('measurePage');
        const measureCols=[w.document.getElementById('measureLeft'),w.document.getElementById('measureRight')];
        if(!measurePage||!measureCols[0])throw new Error('Print measurement page was not created.');
        const pageHeight=measurePage.getBoundingClientRect().height;
        const header=measurePage.querySelector('.medex-print-header')?.getBoundingClientRect().height||0;
        const topic=measurePage.querySelector('.medex-print-topic')?.getBoundingClientRect().height||0;
        const footer=measurePage.querySelector('.medex-print-footer')?.getBoundingClientRect().height||0;
        const questionsTop=measurePage.querySelector('.medex-print-questions')?.getBoundingClientRect().top||0;
        const pagePaddingTop=parseFloat(w.getComputedStyle(measurePage).paddingTop)||0;
        const safety=5/25.4*96;
        const footerGap=1.6/25.4*96;
        const continuationTop=pagePaddingTop;
        const firstQuestionsTop=questionsTop;
        const usableFirst=Math.max(100,pageHeight-firstQuestionsTop-footer-footerGap-safety);
        const usableContinuation=Math.max(100,pageHeight-continuationTop-footer-footerGap-safety);
        const gap=1.35/25.4*96;
        const colWidth=measureCols[0].getBoundingClientRect().width;

        const measureQuestion=(q,n,compact=false,scale=1)=>{
          const holder=w.document.createElement('div');
          holder.className='medex-print-column';
          holder.style.position='absolute';holder.style.left='-100000px';holder.style.top='0';holder.style.width=colWidth+'px';holder.style.visibility='hidden';holder.style.pointerEvents='none';
          holder.innerHTML=block(q,n,compact,scale);
          w.document.body.appendChild(holder);
          const h=holder.firstElementChild?.getBoundingClientRect().height||0;
          holder.remove();
          return h;
        };

        const fitQuestion=(q,n,available)=>{
          let compact=false;
          let h=measureQuestion(q,n,false,1);
          if(h>available){compact=true;h=measureQuestion(q,n,true,1);}
          let extraScale=1;
          if(h>available){
            for(let scale=.96;scale>=.60;scale-=.04){
              h=measureQuestion(q,n,true,scale);
              if(h<=available){extraScale=Number(scale.toFixed(2));break;}
            }
          }
          return {compact,extraScale,h};
        };

        // Enlarge each completed page so its question columns use the available A4 height.
        // The scale is applied to the question typography/padding itself, so measured height stays accurate.
        const enlargePage=(p,usable)=>{
          const all=[...p.left,...p.right];
          if(!all.length)return;
          let scale=1;
          // Start conservatively, then measure the complete columns at progressively larger scales.
          for(let candidate=1.05;candidate<=1.85;candidate+=.05){
            let leftH=0,rightH=0;
            p.left.forEach((x,i)=>{leftH+=measureQuestion(x.q,x.number,x.compact,candidate)+(i?gap:0)});
            p.right.forEach((x,i)=>{rightH+=measureQuestion(x.q,x.number,x.compact,candidate)+(i?gap:0)});
            const maxH=Math.max(leftH,rightH);
            if(maxH<=usable-2){scale=Number(candidate.toFixed(2));}else break;
          }
          p.left.forEach(x=>x.extraScale=scale);
          p.right.forEach(x=>x.extraScale=scale);
        };

        const finalPages=[];
        groups.forEach(g=>{
          let number=0;
          let page={g,left:[],right:[],lh:0,rh:0,first:true};
          const commit=()=>{
            if(page.left.length||page.right.length){
              const usable=page.first?usableFirst:usableContinuation;
              enlargePage(page,usable);
              finalPages.push(page);
            }
            page={g,left:[],right:[],lh:0,rh:0,first:false};
          };

          g.rows.forEach(q=>{
            const item={q,number:++number};
            let placed=false;
            // Target the reference layout: 4–5 complete questions per column.
            // Never exceed five, and never place a question unless its full box fits.
            for(const colIndex of [0,1]){
              const list=colIndex===0?page.left:page.right;
              const used=colIndex===0?page.lh:page.rh;
              const usable=page.first?usableFirst:usableContinuation;
              if(list.length>=5)continue;
              const available=Math.max(40,usable-used-(list.length?gap:0));
              const fit=fitQuestion(q,item.number,available);
              const need=fit.h+(list.length?gap:0);
              if(need<=available+0.5){
                list.push({...item,compact:fit.compact,extraScale:fit.extraScale});
                if(colIndex===0)page.lh+=need; else page.rh+=need;
                placed=true;
                break;
              }
            }
            if(!placed){
              commit();
              const usable=usableContinuation;
              const fit=fitQuestion(q,item.number,usable);
              page.left.push({...item,compact:fit.compact,extraScale:fit.extraScale});
              page.lh+=fit.h;
            }
          });
          commit();
        });

        const output=finalPages.map((p,idx)=>{
          const showLectureHeader=p.first;
          return `<section class="medex-print-page ${showLectureHeader?'lecture-start':'continuation-page'}">
          ${showLectureHeader?`<header class="medex-print-header">
            <div><div class="medex-print-brand">MedEx</div><div class="medex-print-brand small">Medical Examination Platform</div></div>
            <div class="medex-print-title">Question book<span>${adminPrintEscapeHTML(p.g.lecture)}</span></div>
            <div class="medex-print-meta"><b>Module:</b> ${adminPrintEscapeHTML(p.g.module)}<br><b>Subject:</b> ${adminPrintEscapeHTML(p.g.subject)}<br><b>Lecture:</b> ${adminPrintEscapeHTML(p.g.lecture)}</div>
          </header><div class="medex-print-topic">${adminPrintEscapeHTML(p.g.lecture)}</div>`:''}
          <div class="medex-print-questions"><div class="medex-print-column">${p.left.map(x=>block(x.q,x.number,x.compact,x.extraScale||1)).join('')}</div><div class="medex-print-column">${p.right.map(x=>block(x.q,x.number,x.compact,x.extraScale||1)).join('')}</div></div>
          <footer class="medex-print-footer"><div><span class="sig">MedEx — Medical Examination Platform</span><br>Official Question Book · ${total} questions</div><div class="page-number">${idx+1}</div><div class="context">Module: ${adminPrintEscapeHTML(p.g.module)} · Subject: ${adminPrintEscapeHTML(p.g.subject)} · Lecture: ${adminPrintEscapeHTML(p.g.lecture)}</div></footer>
        </section>`;
        }).join('');
        w.document.body.innerHTML=output;
        setTimeout(()=>{w.focus();w.print();},350);
      }catch(e){
        console.error('Question book pagination error:',e);
        toast('Could not prepare the question book print layout.','error');
        try{w.close();}catch(_){}
      }
    };
    if(w.document.readyState==='complete')setTimeout(paginate,400);else w.addEventListener('load',()=>setTimeout(paginate,250),{once:true});
  }catch(e){
    console.error('Print window error:',e);
    try{w.close();}catch(_){}
    toast('Could not prepare the printable question book.','error');
  }
}

function initWeeklyNotificationClickHandling(){
  // v41.52: single delegated handler. The old version re-rendered the bell (innerHTML) on open,
  // which detached the click target, so the document "outside click" handler thought the click
  // was outside and instantly closed the panel again.
  if(window.__weeklyBellBound)return;
  window.__weeklyBellBound=true;
  const inBell=(e)=>{
    const path=typeof e.composedPath==='function'?e.composedPath():[];
    return path.some(n=>n&&n.id&&(n.id==='weeklyNotificationButton'||n.id==='globalNotificationPopover'));
  };
  document.addEventListener('click',function(e){
    const path=typeof e.composedPath==='function'?e.composedPath():[];
    const onBtn=path.some(n=>n&&n.id==='weeklyNotificationButton')||(e.target instanceof Element&&e.target.closest('#weeklyNotificationButton'));
    if(onBtn){
      e.preventDefault();e.stopPropagation();
      notificationPanelOpen=!notificationPanelOpen;
      if(notificationPanelOpen)markWeeklyNotificationsRead();
      updateTopbarControls();
      return;
    }
    if(notificationPanelOpen&&!inBell(e))closeWeeklyNotifications();
  },true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeWeeklyNotifications();});
}

function studyMaterialEscapePath(name){return String(name||'lecture.pdf').normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'_').replace(/^\.+/,'').slice(-120)||'lecture.pdf';}
async function loadStudyMaterials(force=false){
  if(studyMaterialsLoading&&!force)return studyMaterialsRows;
  if(!SUPABASE_ENABLED){studyMaterialsRows=[];return [];}
  studyMaterialsLoading=true;
  try{
    let query=supabaseClient.from('study_materials').select('id,title,module,subject,lecture,file_name,storage_path,file_size,mime_type,published,created_by,created_at').order('module').order('subject').order('lecture');
    if(!isAdmin)query=query.eq('published',true);
    const {data,error}=await query;
    if(error)throw error;
    studyMaterialsRows=Array.isArray(data)?data:[];
  }catch(e){console.warn('Study materials unavailable:',e.message);studyMaterialsRows=[];}
  finally{studyMaterialsLoading=false;}
  return studyMaterialsRows;
}
function studyMaterialSelectOptions(key){return [...new Set(studyMaterialsRows.map(x=>String(x[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
function studyMaterialMatches(row){
  if(studyMaterialsFilter.module&&row.module!==studyMaterialsFilter.module)return false;
  if(studyMaterialsFilter.subject&&row.subject!==studyMaterialsFilter.subject)return false;
  if(studyMaterialsFilter.lecture&&row.lecture!==studyMaterialsFilter.lecture)return false;
  const q=studyMaterialsFilter.search.trim().toLowerCase();
  return !q||[row.title,row.module,row.subject,row.lecture,row.file_name].some(v=>String(v||'').toLowerCase().includes(q));
}

let studyMaterialPdfDocument=null;
let studyMaterialPdfLoadingTask=null;
let studyMaterialPdfRenderToken=0;
let studyMaterialPdfLibPromise=null;
function studyMaterialLoadScript(src,globalName){
 return new Promise((resolve,reject)=>{
  if(globalName&&window[globalName]){resolve(window[globalName]);return;}
  const existing=[...document.scripts].find(x=>x.src===src);
  if(existing){existing.addEventListener('load',()=>resolve(globalName?window[globalName]:true),{once:true});existing.addEventListener('error',reject,{once:true});return;}
  const script=document.createElement('script');script.src=src;script.async=true;
  script.onload=()=>globalName&&!window[globalName]?reject(new Error('PDF library did not initialize.')):resolve(globalName?window[globalName]:true);
  script.onerror=()=>reject(new Error('Could not load a PDF component. Check your internet connection and retry.'));
  document.head.appendChild(script);
 });
}
async function ensureStudyMaterialPdfJs(){
 const pdfjs=await studyMaterialLoadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');
 pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 return pdfjs;
}
async function ensureStudyMaterialPdfLib(){

async function renderStudyMaterialPdfPage(pageNum){
 if(!studyMaterialPdfDocument)return;
 const token=++studyMaterialPdfRenderToken;
 const page=Math.max(1,Math.min(studyMaterialPdfDocument.numPages,Number(pageNum)||1));studyMaterialReaderState.page=page;
 const canvas=document.getElementById('studyMaterialPdfCanvas'),stage=document.getElementById('studyMaterialPdfStage');if(!canvas||!stage)return;
 const ctx=canvas.getContext('2d');stage.innerHTML='';stage.appendChild(canvas);
 const pdfPage=await studyMaterialPdfDocument.getPage(page);if(token!==studyMaterialPdfRenderToken)return;
 const base=pdfPage.getViewport({scale:1});const available=Math.max(280,Math.min(stage.clientWidth||900,1100)-36);const scale=(available/base.width)*(Math.max(50,Math.min(200,Number(studyMaterialReaderState.zoom)||100))/100);
 const viewport=pdfPage.getViewport({scale});const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=Math.floor(viewport.width)+'px';canvas.style.height=Math.floor(viewport.height)+'px';
 await pdfPage.render({canvasContext:ctx,viewport,transform:dpr===1?null:[dpr,0,0,dpr,0,0]}).promise;
 if(token!==studyMaterialPdfRenderToken)return;
 const p=document.getElementById('studyMaterialPageInput');if(p)p.value=String(page);
 const z=document.getElementById('studyMaterialZoomLabel');if(z)z.textContent=studyMaterialReaderState.zoom===100?'Fit width':studyMaterialReaderState.zoom+'%';
 const prev=document.getElementById('studyMaterialPrevPage'),next=document.getElementById('studyMaterialNextPage');if(prev)prev.disabled=page<=1;if(next)next.disabled=page>=studyMaterialPdfDocument.numPages;
}

async function printStudyMaterialWithSignature(){

 const status=document.getElementById('studyMaterialPrintStatus');const btn=document.getElementById('studyMaterialPrintButton');
 // Open synchronously from the user gesture to avoid popup blockers while the signed PDF is prepared.

  const lib=await ensureStudyMaterialPdfLib();
  const response=await fetch(studyMaterialReaderState.signedUrl,{cache:'no-store'});if(!response.ok)throw new Error('Could not download the PDF for printing.');

  const bytes=await pdf.save();const blob=new Blob([bytes],{type:'application/pdf'});const blobUrl=URL.createObjectURL(blob);
  if(printWindow&&!printWindow.closed){printWindow.document.title=`${m.title} — MedEx signed copy`;printWindow.document.body.innerHTML='<p style="font:16px Arial;padding:24px">Preparing MedEx-signed PDF…</p>';printWindow.onload=()=>setTimeout(()=>{try{printWindow.focus();printWindow.print();}catch(e){}},700);printWindow.location.href=blobUrl;}
  else {const link=document.createElement('a');link.href=blobUrl;link.download=`${studyMaterialEscapePath(m.title)}-MedEx-signed.pdf`;link.click();toast('Popup blocked. The MedEx-signed PDF was downloaded; open it and print.','error');}
  if(status)status.textContent=`MedEx signature added to ${pages.length} page${pages.length===1?'':'s'}. Use the PDF viewer’s print command.`;

 }catch(e){if(printWindow&&!printWindow.closed)printWindow.close();if(status)status.textContent='Print preparation failed: '+e.message;toast('Could not prepare signed PDF: '+e.message,'error');}
 finally{if(btn){btn.disabled=false;btn.textContent='Print with MedEx signature';}}
}

  const {error}=await supabaseClient.storage.from('question-images').upload(path,file,{cacheControl:'31536000',upsert:false,contentType:file.type});

function getImportList(data){
  const list=Array.isArray(data)?data:data?.questions;
  return Array.isArray(list)?list:null;
