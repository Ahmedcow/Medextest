<style>
:root{
  --bg:#eef2f0;--card:#ffffff;--text:#101826;--muted:#5b6b72;--line:#dbe3e1;
  --primary:#0c7c8c;--primary2:#095f6c;--primary-rgb:12,124,140;--primary-soft:#e1f0f0;
  --danger:#c0392b;--danger-soft:#fbeae7;
  --ok:#1f8a55;--ok-soft:#e7f5ec;
  --warn:#b4780a;--warn-soft:#fbf0de;
  --ink:#101826;
  --shadow:0 20px 40px -18px rgba(16,24,38,.35);
  --shadow-sm:0 1px 2px rgba(16,24,38,.06);
  --radius:16px;--radius-sm:10px;
  --topbar-h:58px;--sidebar-w:264px;
  --font-sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0f1517;--card:#182023;--text:#e7edee;--muted:#8fa0a5;--line:#2b363a;
  --primary:#20b6c9;--primary2:#57cddc;--primary-rgb:32,182,201;--primary-soft:rgba(32,182,201,.16);
  --danger:#e5695a;--danger-soft:rgba(229,105,90,.16);
  --ok:#3fcf85;--ok-soft:rgba(63,207,133,.16);
  --warn:#e0a63f;--warn-soft:rgba(224,166,63,.16);
  --ink:#05090a;
  --shadow:0 20px 40px -18px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em;margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}


/* ---------- Admin Question Bank PDF / print ---------- */
.admin-print-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--card),rgba(var(--primary-rgb),.035));box-shadow:var(--shadow-sm)}
.admin-print-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.admin-print-options{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.admin-print-check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;font-weight:600}
.admin-print-hint{padding:10px 12px;border-radius:10px;background:var(--primary-soft);color:var(--muted);border:1px solid rgba(var(--primary-rgb),.22);font-size:12.5px}
@media(max-width:900px){.admin-print-grid{grid-template-columns:1fr}.admin-print-options{align-items:flex-start;flex-direction:column}}

/* Print window generated by the admin question-bank exporter */
@media print{
  .medex-print-page{page-break-after:always;break-after:page;position:relative;min-height:297mm;height:297mm;padding:11mm 11mm 14mm;background:#fff;color:#111;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
  .medex-print-page:last-child{page-break-after:auto;break-after:auto}
  .medex-print-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8mm;border-bottom:1.5px solid #1a6f7d;padding-bottom:4mm;margin-bottom:4mm}
  .medex-print-brand{font-family:Georgia,'Times New Roman',serif;font-size:21pt;font-weight:700;color:#111}
  .medex-print-brand small{display:block;font-family:Arial,sans-serif;font-size:8.5pt;font-weight:400;color:#5b686d;margin-top:1.5mm}
  .medex-print-title{font-family:Arial,sans-serif;font-size:11pt;font-weight:700;text-align:right;color:#172025}
  .medex-print-section{font-family:Arial,sans-serif;font-size:9.5pt;font-weight:700;color:#0b6e7d;margin:0 0 2.5mm;text-transform:uppercase;letter-spacing:.06em}
  .medex-print-meta{font-family:Arial,sans-serif;font-size:9pt;color:#58656a;margin-bottom:4mm}
  .medex-print-questions{flex:1}
  .medex-print-q{display:grid;grid-template-columns:minmax(0,1fr) 15mm;border:1px solid #aeb9bd;border-bottom:0;break-inside:avoid}
  .medex-print-q:last-child{border-bottom:1px solid #aeb9bd}
  .medex-print-qbody{padding:3.4mm 4mm}
  .medex-print-qtext{font-family:Arial,sans-serif;font-size:10.5pt;line-height:1.45;font-weight:700;margin-bottom:2.5mm}
  .medex-print-opt{font-family:Arial,sans-serif;font-size:9.5pt;line-height:1.38;margin:1.2mm 0;padding-left:1mm}
  .medex-print-answer{border-left:1px solid #aeb9bd;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:12pt;font-weight:800;color:#0b6e7d;background:#f2f7f7}
  .medex-print-expl{font-family:Arial,sans-serif;font-size:8.5pt;line-height:1.35;color:#58656a;margin-top:2.5mm;border-top:1px dashed #c9d1d3;padding-top:2mm}
  .medex-print-footer{margin-top:auto;border-top:1px solid #c9d1d3;padding-top:3mm;display:flex;justify-content:space-between;gap:8mm;font-family:Arial,sans-serif;font-size:8pt;color:#5b686d}
  .medex-print-footer .sig{font-weight:700;color:#1a6f7d}
  .medex-print-footer .context{text-align:right}
}
@page{size:A4 portrait;margin:0}


/* v41.38 Phase 2 learning + weekly notification system */
.weekly-notifications-card{position:relative;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);background:linear-gradient(135deg,var(--card),var(--primary-soft));}
.weekly-notifications-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;cursor:pointer}
.weekly-notifications-title{display:flex;align-items:center;gap:11px;min-width:0}.notification-bell{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);border:1px solid rgba(var(--primary-rgb),.22);position:relative;flex:0 0 auto}.notification-bell svg{width:21px;height:21px}.notification-unread-dot{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:#e53935;box-shadow:0 0 0 3px var(--card);animation:mePulse 1.8s ease-in-out infinite}.weekly-notifications-summary{min-width:0}.weekly-notifications-summary strong{display:block}.weekly-notifications-summary .mini{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weekly-notifications-list{border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}.weekly-notification-item{padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.weekly-notification-item.is-new{border-color:rgba(var(--primary-rgb),.42);box-shadow:0 0 0 1px rgba(var(--primary-rgb),.08)}.weekly-notification-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.weekly-notification-new{color:var(--primary);font-weight:800}.weekly-notification-message{white-space:pre-wrap;line-height:1.55;margin-top:6px;font-size:13px}
.study-phase2-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.study-hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.study-hub-action{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:5px}.study-hub-action:hover{border-color:var(--primary);background:var(--primary-soft)}.study-hub-action b{font-size:13px}.study-hub-action span{font-size:11px;color:var(--muted);line-height:1.45}.focus-timer-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:245px}.focus-timer{font-family:var(--font-mono);font-size:56px;font-weight:800;letter-spacing:.04em;margin:10px 0}.focus-status{font-size:11px;color:var(--muted)}.focus-presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}.focus-preset.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}.written-answer-box{min-height:130px;resize:vertical}.written-practice-shell{max-width:900px;margin:0 auto}.written-answer-feedback{margin-top:12px;line-height:1.6}.phase2-image-review{max-width:min(100%,720px);max-height:420px;display:block;margin:14px auto;border-radius:14px;border:1px solid var(--line);object-fit:contain;background:var(--bg)}
@media(max-width:850px){.study-phase2-grid{grid-template-columns:1fr}.study-hub-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.study-hub-grid{grid-template-columns:1fr}.focus-timer{font-size:44px}}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40}
.app.sidebar-open .scrim{opacity:1;pointer-events:auto}
.appshell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 18px;background:rgba(238,242,240,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-brand{font-family:var(--font-serif);font-size:17px;font-weight:600}
.topbar-brand small{display:block;font-family:var(--font-sans);font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.icon-btn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:10px;transition:border-color .15s ease,background .15s ease}
.section-start-btn{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--primary);background:var(--primary-soft);border-radius:50%;cursor:pointer;transition:transform .12s ease,background .15s ease}
.section-start-btn:hover{background:var(--primary);transform:scale(1.08)}
.section-start-btn:hover svg{stroke:#fff;fill:#fff}
.section-start-btn svg{width:13px;height:13px;stroke:var(--primary);fill:var(--primary);margin-left:1px}
.icon-btn:hover{border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none}
.main{flex:1;padding:24px;max-width:1500px;width:100%}

/* ---------- Sidebar window ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);max-width:86vw;background:var(--ink);color:#fff;z-index:50;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
.app.sidebar-open .sidebar{transform:translateX(0)}
.sidebar-inner{width:var(--sidebar-w);max-width:86vw;height:100%;display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto}
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 6px 20px}
.brand{font-family:var(--font-serif);font-size:20px;font-weight:600;line-height:1.15}
.brand small{display:block;font-family:var(--font-sans);font-size:11px;font-weight:500;color:#93a6ab;margin-top:6px;letter-spacing:.01em}
.sidebar .icon-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.sidebar .icon-btn svg{stroke:#fff}
.sidebar .icon-btn:hover{border-color:var(--primary)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c6d1d5;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:0 0 auto;opacity:.85;stroke:currentColor;fill:none}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(var(--primary-rgb),.28);color:#fff}
.nav button.active svg{opacity:1}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:#93a6ab;border-top:1px solid rgba(255,255,255,.12)}
@media(min-width:881px){
  .sidebar{position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0 16px 16px;border-radius:var(--radius);width:var(--sidebar-w);transform:none;transition:width .22s ease,opacity .18s ease,margin .22s ease;overflow:hidden}
  .app:not(.sidebar-open) .sidebar{width:0;margin-left:0;opacity:0;box-shadow:none;pointer-events:none}
  .scrim{display:none}
}

/* ---------- Page header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons & fields ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;transition:border-color .15s ease,background .15s ease,transform .1s ease}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary2);border-color:var(--primary2)}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn.btn-lg{padding:15px 28px;font-size:16px;border-width:2px}
.btn.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.answer-mode-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.answer-mode-option{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;min-height:72px}
.answer-mode-option:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.answer-mode-option input{margin-top:3px;accent-color:var(--primary)}
@media(max-width:700px){.answer-mode-list{grid-template-columns:1fr}}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:130px;resize:vertical;font-family:var(--font-mono);font-size:13px}

.multi-picker{position:relative}
.multi-picker-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;color:var(--text);text-align:left;font-size:13px;min-height:42px}
.multi-picker-toggle:hover{border-color:var(--primary)}
.multi-picker-toggle .multi-count{font-family:var(--font-mono);font-size:11px;color:var(--primary);font-weight:700}
.multi-picker-menu{position:absolute;z-index:80;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:8px;max-height:300px;overflow:auto}
.multi-picker-menu label{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text)}
.multi-picker-menu label:hover{background:var(--primary-soft)}
.multi-picker-menu input{width:16px;height:16px;accent-color:var(--primary);flex:0 0 auto}
.multi-picker-empty{padding:10px 8px;color:var(--muted);font-size:12px}

/* ---------- Smart exam builder ---------- */
.exam-builder{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.exam-builder-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.exam-builder-search{flex:1;min-width:220px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;color:var(--text)}
.exam-builder-actions{display:flex;gap:7px;flex-wrap:wrap}
.exam-tree{padding:8px;max-height:560px;overflow:auto}
.exam-node{border-radius:10px}
.exam-node + .exam-node{margin-top:2px}
.exam-node-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 8px;border-radius:9px}
.exam-node-row:hover{background:var(--primary-soft)}
.exam-node-row input{width:17px;height:17px;accent-color:var(--primary);flex:0 0 auto}
.exam-node-toggle{width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.exam-node-toggle:hover{background:var(--primary-soft);color:var(--primary)}
.exam-node-toggle.spacer{visibility:hidden}
.exam-node-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exam-node-title.exam-node-clickable{cursor:pointer}
.exam-node-title.exam-node-clickable:hover{color:var(--primary)}
.exam-node-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.exam-node-children{margin-left:28px;padding-left:10px;border-left:1px dashed var(--line)}
.exam-node-children.hidden{display:none}
.exam-selection-summary{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.exam-selection-paths{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.exam-selection-chip{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary2);border:1px solid rgba(var(--primary-rgb),.2)}
.exam-builder-hint{padding:12px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:880px){.exam-tree{max-height:none}.exam-node-children{margin-left:20px}.exam-builder-search{min-width:100%}}
.support-contact-card{display:flex;align-items:center;justify-content:space-between;gap:16px}
.support-contact-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary);flex:0 0 auto}
.support-contact-icon svg{width:24px;height:24px}
.support-chat-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:9990;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px}
.support-chat{width:min(440px,100%);height:min(680px,calc(100vh - 40px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.support-chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.support-chat-log{flex:1;overflow:auto;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:9px}
.support-chat-msg{max-width:82%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.45;font-size:13px}
.support-chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.support-chat-msg.admin{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.support-chat-meta{font-size:10px;color:var(--muted);margin-top:3px}
.support-chat-compose{padding:12px;border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px}
.support-chat-compose textarea{flex:1;min-height:48px;max-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--text);font-family:var(--font-sans);font-size:13px}
.support-chat-compose .btn{align-self:flex-end}
.support-thread{cursor:pointer}
.support-thread.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.support-thread-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}

/* ---------- Cards & readouts ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.stat{position:relative;overflow:hidden;padding-top:20px}

.stat .value{font-family:var(--font-mono);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.section-title{margin:28px 0 12px;font-size:17px}
.bar{height:8px;background:#e3e9e7;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.progress-row{display:grid;grid-template-columns:180px 1fr 70px 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.progress-row:last-child{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary2);font-family:var(--font-mono)}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.table th{color:var(--muted);font-size:12px;background:var(--bg)}
.hidden{display:none!important}

/* ---------- Quiz ---------- */
.quiz{max-width:980px;margin:auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-weight:600;color:var(--primary);font-size:17px}
.question{font-family:var(--font-serif);font-size:21px;line-height:1.5;font-weight:600;margin:18px 0}
.options{display:grid;gap:10px}
.option{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:14px;text-align:left;transition:border-color .15s ease,background .15s ease}
.option:hover{border-color:var(--primary)}
.option.selected{border-color:var(--primary);background:var(--primary-soft)}
.option.correct{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--danger);background:var(--danger-soft)}
.question-illustration{display:block;width:100%;max-height:420px;object-fit:contain;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);margin:16px 0 18px;padding:6px}
.phase2-library-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.phase2-library-side,.phase2-library-main{min-width:0}.phase2-folder{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:8px;cursor:pointer}.phase2-folder.active{border-color:var(--primary);background:var(--primary-soft)}.phase2-folder-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.phase2-search-row{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px;gap:10px}.phase2-result{padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-top:10px}.phase2-result-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.phase2-result-meta{font-size:11px;color:var(--muted);margin-top:4px}.phase2-source{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--primary-soft);border:1px solid rgba(var(--primary-rgb),.18);font-size:12px;line-height:1.5}.phase2-note{width:100%;min-height:72px;resize:vertical}
@media(max-width:850px){.phase2-library-grid{grid-template-columns:1fr}.phase2-search-row{grid-template-columns:1fr}}
.report-panel{margin-top:10px;border:1px solid var(--danger);background:var(--danger-soft);border-radius:var(--radius-sm);padding:14px}
.report-panel h4{margin:0 0 10px}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.admin-reply{border-left:4px solid var(--primary);padding:10px 12px;background:var(--primary-soft);border-radius:var(--radius-sm);margin-top:10px}

/* ---------- Exam question navigator ---------- */
.question-nav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.qnav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all .15s ease}
.qnav-btn:hover{border-color:var(--primary);transform:translateY(-1px)}

.qnav-btn.current.answered{box-shadow:0 0 0 2px var(--ok-soft),0 0 0 4px var(--primary)}

.qnav-btn.current.wrong{box-shadow:0 0 0 2px var(--danger-soft),0 0 0 4px var(--primary)}
.nav-legend{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
.nav-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line);background:var(--card);margin-right:4px}
.nav-dot.answered{background:var(--ok);border-color:var(--ok)}
.nav-dot.wrong{background:var(--danger);border-color:var(--danger)}
.nav-dot.current{border:2px solid var(--primary)}
.review-choice{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:7px;background:var(--card)}
.review-choice.selected{border-color:var(--primary);background:var(--primary-soft)}
.review-choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.selected.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.wrong{border-color:var(--danger);background:var(--danger-soft)}

.review{margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line)}
.review.good{border-left:4px solid var(--ok)}

function getVisitorId(){
  let id=localStorage.getItem(CONFIG.visitorIdKey);
  if(!id){ id='v_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12); localStorage.setItem(CONFIG.visitorIdKey,id); }
  return id;

function isFavorite(q){ return favorites.has(key(q)); }
function saveFavoritesLocal(){ localStorage.setItem(CONFIG.favoritesKey,JSON.stringify([...favorites])); }
async function toggleFavorite(id){
  const q=allQuestionBank.find(x=>x.id===id)||bank.find(x=>x.id===id);
  if(!q)return;
  const favoriteId=String(q.id);
  if(favorites.has(favoriteId)) favorites.delete(favoriteId); else favorites.add(favoriteId);
  saveFavoritesLocal();
  const nowFavorite=favorites.has(favoriteId);

  if(currentUser && SUPABASE_ENABLED){
    if(nowFavorite){
      const {error}=await supabaseClient.from('user_favorites').upsert({user_id:currentUser.id,question_id:favoriteId},{onConflict:'user_id,question_id'});
      if(error) console.warn('Favorite sync failed:',error.message);
    } else {
      const {error}=await supabaseClient.from('user_favorites').delete().eq('user_id',currentUser.id).eq('question_id',favoriteId);
      if(error) console.warn('Favorite delete failed:',error.message);
    }
  }

  // Never call render() while an exam is active: render() maps #exam to the
  // exam setup screen, which used to make clicking the star appear to end the exam.
  if(exam && !exam.submitted){
    const btn=document.querySelector('[data-favorite-id]');
    if(btn){
      btn.textContent=nowFavorite?'★':'☆';
      btn.title=nowFavorite?'Remove from favourites':'Mark as favourite';
      btn.setAttribute('aria-label',btn.title);
    }
    return nowFavorite;
  }

  render();
  return nowFavorite;
}
async function loadFavorites(){

    const {data,error}=await supabaseClient.from('user_favorites').select('question_id').eq('user_id',currentUser.id);
    if(!error && Array.isArray(data)){ favorites=new Set(data.map(x=>String(x.question_id))); saveFavoritesLocal(); }
  }
}

async function checkAdminRole(){
  isAdmin=false;
  adminCheckLoaded=true;
  if(!SUPABASE_ENABLED || !currentUser) return false;
  try{
    const {data,error}=await supabaseClient.rpc('is_admin');
    if(!error) isAdmin=!!data;
  }catch(e){ isAdmin=false; }
  return isAdmin;
}
async function requireAdmin(){
  if(!currentUser){toast('Please sign in first.','error');go('account');return false;}

  return true;
}
async function refreshAuthUser(){
  if(!SUPABASE_ENABLED){ currentUser=null; return; }
  try{
    const {data,error}=await supabaseClient.auth.getUser();
    if(error) throw error;
    currentUser=data?.user||null;
  }catch(e){ console.warn('Supabase auth:',e.message); currentUser=null; }
}

async function signUpStudent(email,password){
  if(!SUPABASE_ENABLED){toast('Supabase is not connected.','error');return false;}
  email=(email||'').trim().toLowerCase();
  if(!email || !password){toast('Enter an email and password.','error');return false;}
  if(password.length<6){toast('Password must be at least 6 characters.','error');return false;}
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){toast(error.message,'error');return false;}
  if(data?.session){ currentUser=data.user; await afterAuthChanged(); toast('Account created and signed in.','ok'); }
  else toast('Account created. Check your email to confirm the account, then sign in.','ok');
  return true;
}

async function signInStudent(email,password){
  if(!SUPABASE_ENABLED){toast('Supabase is not connected.','error');return false;}
  email=(email||'').trim().toLowerCase();
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){toast(error.message,'error');return false;}
  currentUser=data.user;
  await afterAuthChanged();
  toast('Signed in successfully.','ok');
  return true;
}

async function signOutStudent(){
  if(SUPABASE_ENABLED){const {error}=await supabaseClient.auth.signOut();if(error)console.warn(error.message);}

async function syncLocalProgressToSupabase(){
  if(!SUPABASE_ENABLED || !currentUser)return;
  const rows=[];
  for(const q of bank){
    const p=progress[key(q)];
    if(!p || !p.attempts)continue;
    rows.push({
      user_id:currentUser.id,
      question_id:q.id,
      attempts:Number(p.attempts||0),
      correct_count:Number(p.correct||0),
      wrong_count:Number(p.wrong||0),
      last_result:p.last||null,
      updated_at:new Date().toISOString()
    });
  }
  if(!rows.length)return;
  const {error}=await supabaseClient.from('student_question_progress')
    .upsert(rows,{onConflict:'user_id,question_id'});
  if(error)console.warn('Progress sync failed:',error.message);
}

async function loadSupabaseProgress(){
  if(!SUPABASE_ENABLED || !currentUser)return;
  const {data,error}=await supabaseClient
    .from('student_question_progress')
    .select('question_id,attempts,correct_count,wrong_count,last_result')
    .eq('user_id',currentUser.id);
  if(error){console.warn('Progress load failed:',error.message);return;}
  const remote={};
  (data||[]).forEach(p=>{
    remote[p.question_id]={
      attempts:p.attempts||0,
      correct:p.correct_count||0,
      wrong:p.wrong_count||0,
      last:p.last_result||null
    };
  });
  progress=remote;
  saveState();
}
async function loadReviewScheduleFromSupabase(){
  if(!SUPABASE_ENABLED || !currentUser)return;
  try{
    const {data,error}=await supabaseClient.from('student_review_schedule').select('question_id,interval_days,review_streak,next_review_at,last_answered_at').eq('user_id',currentUser.id);
    if(error){console.warn('Review schedule load unavailable:',error.message);return;}
    (data||[]).forEach(row=>{
      const p=progress[row.question_id]||{attempts:0,correct:0,wrong:0,last:null};
      p.reviewIntervalDays=Number(row.interval_days||1);
      p.reviewStreak=Number(row.review_streak||0);
      p.nextReviewAt=Date.parse(row.next_review_at)||0;
      p.lastAnsweredAt=Date.parse(row.last_answered_at)||0;
      progress[row.question_id]=p;
    });
    saveState();
  }catch(e){console.warn('Review schedule load unavailable:',e.message);}
}
async function syncReviewSchedulesToSupabase(questions){
  if(!SUPABASE_ENABLED || !currentUser || !questions?.length)return;
  const rows=questions.map(q=>{const p=progress[key(q)]||{};return {user_id:currentUser.id,question_id:q.id,interval_days:Math.max(1,Number(p.reviewIntervalDays||1)),review_streak:Math.max(0,Number(p.reviewStreak||0)),next_review_at:new Date(Number(p.nextReviewAt||Date.now())).toISOString(),last_answered_at:new Date(Number(p.lastAnsweredAt||Date.now())).toISOString(),updated_at:new Date().toISOString()};});
  try{
    const {error}=await supabaseClient.from('student_review_schedule').upsert(rows,{onConflict:'user_id,question_id'});
    if(error)console.warn('Review schedule sync unavailable:',error.message);
  }catch(e){console.warn('Review schedule sync unavailable:',e.message);}
}
async function recordAttemptToSupabase(q, selectedIndex, isCorrect, examId){
  if(!SUPABASE_ENABLED || !currentUser)return;
  const {error}=await supabaseClient.from('question_attempts').insert({
    user_id:currentUser.id,
    exam_id:examId,
    question_id:q.id,
    module:q.module,
    subject:q.subject,
    lecture:q.lecture,
    selected_index:selectedIndex,
    is_correct:isCorrect
  });
  if(error)console.warn('Attempt sync failed:',error.message);
}

async function saveExamToSupabase(result){
  if(!SUPABASE_ENABLED || !currentUser)return;
  const {error}=await supabaseClient.from('exams').insert({
    id:result.id,
    user_id:currentUser.id,
    started_at:new Date(Date.now()-result.durationSec*1000).toISOString(),
    finished_at:result.date,
    label:result.label,
    module_filter:result.moduleFilter||null,
    subject_filter:result.subjectFilter||null,
    lecture_filter:result.lectureFilter||null,
    total:result.total,
    answered:result.answered,
    correct:result.correct,
    unanswered:result.unanswered,
    accuracy:result.accuracy,
    duration_seconds:result.durationSec,
    exam_data:{list:result.list,answers:result.answers,auto:!!result.auto}
  });
  if(error)console.warn('Exam sync failed:',error.message);
}

function loadJSON(key, fallback){
  try { const x = JSON.parse(localStorage.getItem(key)); return x ?? fallback; }
  catch(e){ return fallback; }
}
function localDayKey(date=new Date()){
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function getStudyActivity(){
  return loadJSON(CONFIG.studyActivityKey, {});
}
function recordStudyAnswer(questionId, isCorrect){
  const id=String(questionId||'').trim();
  if(!id)return;
  const activity=getStudyActivity();
  const day=localDayKey();
  if(!activity[day])activity[day]={questions:{},attempts:0,correct:0,wrong:0};
  const row=activity[day];
  if(!row.questions)row.questions={};
  row.questions[id]=true;
  row.attempts=Number(row.attempts||0)+1;
  if(isCorrect){ row.correct=Number(row.correct||0)+1; }
  else { row.wrong=Number(row.wrong||0)+1; }
  row.solved=Number(row.solved||0)+1;
  localStorage.setItem(CONFIG.studyActivityKey,JSON.stringify(activity));
}
function studyStats(){
  const activity=getStudyActivity();
  const today=localDayKey();
  const todayRow=activity[today]||{};
  const todayQuestions=Number(todayRow.solved||todayRow.attempts||0);
  const days=Object.keys(activity).filter(d=>activity[d] && (Number(activity[d].solved||activity[d].attempts||0)>0 || Object.keys(activity[d].questions||{}).length>0)).sort();
  return {todayQuestions,daysStudied:days.length,days,activity};
}
function weekStudyData(baseDate=new Date()){
  const activity=getStudyActivity();
  const local=new Date(baseDate.getFullYear(),baseDate.getMonth(),baseDate.getDate());
  const dayOfWeek=local.getDay();
  const start=new Date(local); start.setDate(local.getDate()-dayOfWeek);
  const labels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return labels.map((label,i)=>{
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=localDayKey(d);
    const row=activity[key]||{};
    const total=Number(row.solved||row.attempts||0);
    const correct=Number(row.correct||0);
    const wrong=Number(row.wrong||0);
    return {label,key,total,correct,wrong};
  });
}
function getDailyGoal(){
  const n=Number(settings.dailyGoal);
  return Number.isFinite(n)&&n>0?Math.min(200,Math.max(1,Math.round(n))):20;
}
function studyStreak(){
  const activity=getStudyActivity();
  const hasStudy=d=>{const r=activity[d];return !!r && Number(r.solved||r.attempts||0)>0;};
  let streak=0;
  const d=new Date();
  while(true){
    const k=localDayKey(d);
    if(!hasStudy(k)){
      if(streak===0){ d.setDate(d.getDate()-1); if(!hasStudy(localDayKey(d)))break; }
      else break;
    }
    streak++; d.setDate(d.getDate()-1);
  }
  return streak;
}
function recentStudyDays(count=7){
  const activity=getStudyActivity(), out=[];
  const today=new Date();
  for(let i=count-1;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const k=localDayKey(d), r=activity[k]||{};
    out.push({key:k,label:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],solved:Number(r.solved||r.attempts||0)});
  }
  return out;
}
function spacedReviewState(q){
  const p=progress[key(q)]||{};
  return {intervalDays:Math.max(0,Number(p.reviewIntervalDays||0)),reviewStreak:Math.max(0,Number(p.reviewStreak||0)),nextReviewAt:Number(p.nextReviewAt||0),lastAnsweredAt:Number(p.lastAnsweredAt||0)};
}
function updateSpacedRepetition(q,isCorrect){
  const k=key(q);
  if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
  const p=progress[k];
  const previousCorrect=p.last==='correct';
  let intervalDays=1, reviewStreak=0;
  if(isCorrect){
    reviewStreak=previousCorrect?Math.max(1,Number(p.reviewStreak||1)+1):1;
    const ladder=[1,3,7,14,30,60];
    intervalDays=ladder[Math.min(reviewStreak-1,ladder.length-1)];
  }else{reviewStreak=0;intervalDays=1;}
  p.reviewIntervalDays=intervalDays; p.reviewStreak=reviewStreak; p.lastAnsweredAt=Date.now(); p.nextReviewAt=Date.now()+intervalDays*86400000;
}
function dueSpacedQuestions(){
  const now=Date.now();
  return bank.filter(q=>{const p=progress[key(q)];return p&&Number(p.attempts||0)>0&&Number(p.nextReviewAt||0)>0&&Number(p.nextReviewAt)<=now;});
}
function nextSpacedReviewDate(){
  let soonest=0;
  bank.forEach(q=>{const p=progress[key(q)];const t=Number(p?.nextReviewAt||0);if(t>0&&(!soonest||t<soonest))soonest=t;});
  return soonest;
}
function startSpacedReview(){
  const due=dueSpacedQuestions();
  if(!due.length){const next=nextSpacedReviewDate();toast(next?`No reviews are due yet. Next review: ${new Date(next).toLocaleString()}.`:'No spaced-repetition reviews are scheduled yet. Answer some questions first.','ok');return;}
  const list=shuffle([...due]).slice(0,Math.min(getDailyGoal(),due.length));
  startExam(list,null,'Spaced Repetition Review');
}
function spacedReviewSummaryHTML(){
  const due=dueSpacedQuestions(), next=nextSpacedReviewDate();
  const cycle=bank.filter(q=>progress[key(q)]&&Number(progress[key(q)].attempts||0)>0).length;
  return `<div class="card dashboard-spaced-review" style="margin-top:16px;margin-bottom:24px"><div class="category-head"><div><strong>Spaced repetition</strong><div class="mini">Review questions again at the right interval based on your previous answers.</div></div><span class="pill">${due.length} due</span></div><div class="phase2-grid spaced-review-stats" style="margin-top:14px"><div class="phase2-mini-card"><div class="phase2-stat">${due.length}</div><div class="phase2-label">Questions due now</div></div><div class="phase2-mini-card"><div class="phase2-stat">${cycle}</div><div class="phase2-label">Questions in review cycle</div></div><div class="phase2-mini-card"><div class="phase2-stat">${next?new Date(next).toLocaleDateString():'—'}</div><div class="phase2-label">Next scheduled review</div></div></div><div class="actions spaced-review-actions" style="margin-top:16px"><button class="btn primary" onclick="startSpacedReview()" ${due.length?'':'disabled'}>Start Spaced Review</button></div></div>`;
}
function lecturePerformanceData(){
  const map=new Map();
  bank.forEach(q=>{const p=progress[key(q)];if(!p||!Number(p.attempts||0))return;const k=[q.module,q.subject,q.lecture].map(String).join('|||');const r=map.get(k)||{module:q.module,subject:q.subject,lecture:q.lecture,attempts:0,correct:0,wrong:0,questions:0};r.attempts+=Number(p.attempts||0);r.correct+=Number(p.correct||0);r.wrong+=Number(p.wrong||0);r.questions++;map.set(k,r);});
  return [...map.values()].map(r=>({...r,accuracy:r.attempts?Math.round(r.correct/r.attempts*100):0}));
}
function difficultyPerformanceData(){
  const map=new Map();
  bank.forEach(q=>{const p=progress[key(q)];if(!p||!Number(p.attempts||0))return;const difficulty=String(q.difficulty||'Unrated').trim()||'Unrated';const r=map.get(difficulty)||{difficulty,attempts:0,correct:0,wrong:0,questions:0};r.attempts+=Number(p.attempts||0);r.correct+=Number(p.correct||0);r.wrong+=Number(p.wrong||0);r.questions++;map.set(difficulty,r);});
  return [...map.values()].map(r=>({...r,accuracy:r.attempts?Math.round(r.correct/r.attempts*100):0})).sort((a,b)=>a.difficulty.localeCompare(b.difficulty));
}

function weakTopicData(limit=5){
  const map=new Map();
  bank.forEach(q=>{
    const p=progress[key(q)];
    if(!p || !Number(p.attempts||0))return;
    const topicKey=[q.module,q.subject,q.lecture].map(String).join('|||');
    const row=map.get(topicKey)||{module:q.module,subject:q.subject,lecture:q.lecture,attempts:0,wrong:0,correct:0,questions:0,items:[]};
    row.attempts+=Number(p.attempts||0); row.wrong+=Number(p.wrong||0); row.correct+=Number(p.correct||0); row.questions++; row.items.push(q);
    map.set(topicKey,row);
  });
  return [...map.values()].map(x=>({...x,errorRate:x.attempts?Math.round(x.wrong/x.attempts*100):0}))
    .sort((a,b)=>b.errorRate-a.errorRate||b.wrong-a.wrong||b.attempts-a.attempts).slice(0,limit);
}
function dailyGoalStreakHTML(){
  const today=getStudyActivity()[localDayKey()]||{};
  const solved=Number(today.solved||today.attempts||0), goal=getDailyGoal();
  const remaining=Math.max(0,goal-solved);
  const pctGoal=Math.min(100,Math.round(solved/goal*100));
  const streak=studyStreak();
  const recent=recentStudyDays(7);
  const days=recent.map(d=>`<div class="streak-day ${d.solved?'done':''}" title="${d.key}: ${d.solved} solved">${d.label}<br><span>${d.solved}</span></div>`).join('');
  return `<div class="card study-goal-card" style="margin-bottom:16px"><div class="category-head"><div><strong>Daily goal</strong><div class="mini" style="margin-top:4px">Track today's solved questions and your study streak.</div></div><span class="pill">${streak} day streak</span></div><div class="category-head" style="margin-top:14px"><strong>Today's progress</strong><span class="mini">${solved}/${goal}</span></div><div class="goal-track" style="margin-top:9px"><i style="width:${pctGoal}%"></i></div><div class="mini" style="margin-top:7px">${remaining?`${remaining} more question${remaining===1?'':'s'} to reach today's goal.`:'Goal completed — excellent work!'}</div><div class="mini" style="margin-top:10px"><b>Recent days</b></div><div class="streak-days">${days}</div></div>`;
}
function renderStudyWeekChart(){
  const data=weekStudyData();
  // True + False already equals Total. Use stacked answer bars and a Total line
  // so the same questions are not visually counted three separate times.
  const max=Math.max(1,...data.map(d=>Number(d.total||0)));
  const baseY=230, plotH=190, groupW=82, startX=42, barW=34;
  const points=[];
  const groups=data.map((d,i)=>{
    const x=startX+i*groupW+24;
    const total=Number(d.total||0);
    const correct=Math.min(total,Number(d.correct||0));
    const wrong=Math.max(0,Math.min(total-correct,Number(d.wrong||0)));
    const correctH=Math.round((correct/max)*plotH);
    const wrongH=Math.round((wrong/max)*plotH);
    const totalH=Math.round((total/max)*plotH);
    const correctY=baseY-correctH;
    const wrongY=correctY-wrongH;
    const labelY=Math.max(18,baseY-totalH-10);
    points.push(`${x+barW/2},${labelY+4}`);
    return `${correct?`<rect class="study-bar bar-1" x="${x}" y="${correctY}" width="${barW}" height="${correctH}" rx="5"><title>${d.label}: ${correct} true</title></rect>`:''}${wrong?`<rect class="study-bar bar-2" x="${x}" y="${wrongY}" width="${barW}" height="${wrongH}" rx="5"><title>${d.label}: ${wrong} false</title></rect>`:''}<text class="study-total" x="${x+barW/2}" y="${labelY}" text-anchor="middle">${total}</text><text class="study-day" x="${x+barW/2}" y="252" text-anchor="middle">${d.label}</text>`;
  }).join('');
  const grid=[0,.25,.5,.75,1].map(t=>{
    const y=baseY-Math.round(plotH*t);
    const val=Math.round(max*t);
    return `<line class="study-grid" x1="32" y1="${y}" x2="622" y2="${y}"/><text class="study-axis" x="25" y="${y+4}" text-anchor="end">${val}</text>`;
  }).join('');
  const line=points.length>1?`<polyline class="study-total-line" points="${points.join(' ')}" fill="none"/>${points.map(p=>{const [cx,cy]=p.split(',');return `<circle class="study-total-dot" cx="${cx}" cy="${cy}" r="3.5"/>`;}).join('')}`:'';
  return `<div class="study-chart-wrap"><svg class="study-chart" viewBox="0 0 640 270" role="img" aria-label="Daily solved questions from Sunday through Saturday, with true and false stacked and total shown as a line">${grid}${groups}${line}</svg><div class="study-legend"><span><i class="legend-total"></i>Total solved</span><span><i class="legend-correct"></i>True</span><span><i class="legend-wrong"></i>False</span></div></div>`;
}

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function attrJs(v){
  return String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'\\u003c');
}
function uid(q){ return String(q.id || '').trim(); }
function key(q){ return uid(q); }

function sanitizeImageUrl(value){
  const v=String(value||'').trim();
  if(!v)return '';
  if(/^https?:\/\//i.test(v))return v;
  if(/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(v))return v;
  return '';
}
function normalizeQuestion(q, source=''){
  const options = Array.isArray(q.options) ? q.options.map(x=>String(x)) : [];
  let ci = Number.isInteger(q.correctIndex) ? q.correctIndex : Number(q.correctIndex);
  if(!Number.isInteger(ci)) ci = -1;
  return {
    id: uid(q),
    module: String(q.module || q.section || 'General').trim() || 'General',
    subject: String(q.subject || q.category || 'General').trim() || 'General',
    lecture: String(q.lecture || 'General').trim() || 'General',
    difficulty: String(q.difficulty || '').trim(),
    reference: String(q.reference || '').trim(),
    question: String(q.question || '').trim(),
    options,
    correctIndex: ci,
    explanation: String(q.explanation || '').trim(),
    imageUrl: sanitizeImageUrl(q.imageUrl || q.image_url || q.illustration || ''),
    source: source || String(q.source || '')
  };
}
function validateQuestion(q, i){
  if(!q.id) return 'Missing id';
  if(!q.question) return 'Missing question';
  if(!Array.isArray(q.options) || q.options.length < 2) return 'At least 2 options required';
  if(!Number.isInteger(q.correctIndex) || q.correctIndex < 0 || q.correctIndex >= q.options.length) return 'Invalid correctIndex';
  if(!q.module) return 'Missing module';
  if(!q.subject) return 'Missing subject';
  if(!q.lecture) return 'Missing lecture';
  return '';
}
function validateBank(list){
  const errors=[], seen=new Set();
  list.forEach((raw,i)=>{
    const q=normalizeQuestion(raw, raw.source);
    const err=validateQuestion(q,i);
    if(err) errors.push(`Question ${i+1} (${q.id||'no id'}): ${err}`);
    if(q.id && seen.has(q.id)) errors.push(`Duplicate question ID: ${q.id}`);
    if(q.id) seen.add(q.id);
  });
  return errors;
}

async function fetchJSON(url){
  const r = await fetch(url + (url.includes('?')?'&':'?') + 'v=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status} while loading ${url}`);
  return await r.json();
}
async function loadQuestionsFromSupabase(){
  if(!SUPABASE_ENABLED)return false;
  try{
    const PAGE_SIZE=1000;
    const allRows=[];
    for(let from=0;;from+=PAGE_SIZE){
      const to=from+PAGE_SIZE-1;
      const {data,error}=await supabaseClient
        .from('questions')
        .select('id,module,subject,lecture,question,options,correct_index,explanation,difficulty,reference,image_url')
        .order('id',{ascending:true})
        .range(from,to);
      if(error)throw error;
      if(!Array.isArray(data))throw new Error('Invalid questions response.');
      allRows.push(...data);
      if(data.length<PAGE_SIZE)break;
    }
    const data=allRows;
    const all=data.map(q=>normalizeQuestion({
      id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,question:q.question,
      options:q.options,correctIndex:q.correct_index,explanation:q.explanation,
      difficulty:q.difficulty,reference:q.reference,imageUrl:q.image_url,source:'Supabase'
    },'Supabase'));
    const errors=validateBank(all);
    if(errors.length)throw new Error(errors.slice(0,8).join('\n'));
    const githubIds=new Set(all.map(q=>q.id));
    const retainedLocal=localQuestions.filter(q=>!githubIds.has(q.id));
    allQuestionBank=[...all,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    sourceFiles=['Supabase'];
    lastSync=new Date();
    localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
    localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:lastSync.toISOString(),sourceFiles,bank}));
    return true;
  }catch(e){
    console.warn('Supabase question load failed:',e.message);
    return false;
  }
}

async function loadQuestions(){
  const loaded=await loadQuestionsFromSupabase();
  if(!loaded) await loadFromGitHub();
}


async function loadFromGitHub(){
  const status = document.getElementById('syncStatus');
  if(status) status.textContent='Loading latest questions…';
  try{
    const manifest = await fetchJSON(CONFIG.manifest);
    let files = Array.isArray(manifest) ? manifest : manifest.files;
    if(!Array.isArray(files)) throw new Error('questions/index.json must contain a "files" array.');
    sourceFiles = files.map(x => typeof x === 'string' ? x : x.file).filter(Boolean);
    if(!sourceFiles.length) throw new Error('No question files are listed in questions/index.json.');

    const all=[];
    for(const file of sourceFiles){
      const data=await fetchJSON('./questions/'+file);
      const list=Array.isArray(data) ? data : data.questions;
      if(!Array.isArray(list)) throw new Error(`${file} must contain an array or { "questions": [...] }`);
      list.forEach(q=>all.push(normalizeQuestion(q,file)));
    }
    const errors=validateBank(all);
    if(errors.length) throw new Error(errors.slice(0,8).join('\\n'));
    const githubIds = new Set(all.map(q=>q.id));
    const retainedLocal = localQuestions.filter(q=>!githubIds.has(q.id));
    allQuestionBank=[...all,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
    localStorage.setItem(CONFIG.cacheKey, JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
    lastSync=new Date();
    render();
    toast(`Loaded ${all.length} GitHub questions${retainedLocal.length?` + ${retainedLocal.length} local questions`:''}.`, 'ok');
  }catch(e){
    const cached=loadJSON(CONFIG.cacheKey,null);
    if(cached && Array.isArray(cached.bank)){
      const cachedIds = new Set(cached.bank.map(q=>q.id));
      const retainedLocal = localQuestions.filter(q=>!cachedIds.has(q.id));
      allQuestionBank=[...cached.bank,...retainedLocal];
      localQuestions=retainedLocal;
      applyModuleVisibility();
      localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
      sourceFiles=cached.sourceFiles||[];
      lastSync=cached.updatedAt ? new Date(cached.updatedAt) : null;
      render();
      toast(`GitHub update failed. Using last saved bank. ${e.message}`, 'error');
    }else{
      bank=[];
      render();
      toast(`Could not load questions: ${e.message}`, 'error');
    }
  }
}

function getModules(){ return [...new Set(bank.map(q=>q.module))].sort((a,b)=>a.localeCompare(b)); }
function getSubjects(module=''){
  return [...new Set(bank.filter(q=>!module||q.module===module).map(q=>q.subject))].sort((a,b)=>a.localeCompare(b));
}
function getLectures(module='',subject=''){
  return [...new Set(bank.filter(q=>(!module||q.module===module)&&(!subject||q.subject===subject)).map(q=>q.lecture))].sort((a,b)=>a.localeCompare(b));
}
function pct(a,b){ return b ? Math.round((a/b)*100) : 0; }
function practicedCount(list){ return list.filter(q=>progress[key(q)] && progress[key(q)].attempts>0).length; }
function accuracyStats(list){
  let attempts=0, correct=0;
  list.forEach(q=>{
    const p=progress[key(q)];
    if(p){attempts+=p.attempts||0;correct+=p.correct||0;}
  });
  return {correct,attempts,pct:pct(correct,attempts)};
}
function accuracyFor(list){ return accuracyStats(list).pct; }
function progressStats(list){
  const practiced=practicedCount(list);
  return {done:practiced,total:list.length,pct:pct(practiced,list.length)};
}
function progressFor(list){ return progressStats(list).pct; }

function toast(text,type=''){
  const el=document.getElementById('toast');
  if(!el)return;
  el.className='notice '+(type||'');
  el.textContent=text;
  el.classList.remove('hidden');
  clearTimeout(window._toast);
  window._toast=setTimeout(()=>el.classList.add('hidden'),5000);

function go(v){
  // Leaving the Exam page intentionally ends the in-progress exam.
  // Switching apps/tabs or closing/reopening the browser does NOT call go(),
  // so the active exam remains recoverable from localStorage.
  if(v!=='exam' && exam && !exam.submitted){
    clearInterval(timerId);
    exam=null;
    reportPanelOpen=false;
    examAI={open:false,questionId:null,messages:[]};
    clearActiveExam();
  }
  location.hash=v;
  render();
}

function examPathKey(type,module='',subject='',lecture=''){
  return JSON.stringify([type,String(module||''),String(subject||''),String(lecture||'')]);
}
function parseExamPathKey(key){
  try{return JSON.parse(key);}catch(e){return []}
}
function examSelectionHasModule(module){
  const rows=bank.filter(q=>String(q.module)===String(module));
  return rows.length>0 && rows.every(q=>examSelectionHasLecture(q.module,q.subject,q.lecture));
}
function examSelectionHasSubject(module,subject){
  const rows=bank.filter(q=>String(q.module)===String(module)&&String(q.subject)===String(subject));
  return rows.length>0 && rows.every(q=>examSelectionHasLecture(q.module,q.subject,q.lecture));
}
function examSelectionHasLecture(module,subject,lecture){ return examBuilderSelection.has(examPathKey('l',module,subject,lecture)); }
function questionSelectedByBuilder(q){ return examSelectionHasLecture(q.module,q.subject,q.lecture); }
function examTreeData(){
  const map=new Map();
  bank.forEach(q=>{
    const m=String(q.module||'Uncategorized'), s=String(q.subject||'Uncategorized'), l=String(q.lecture||'General');
    if(!map.has(m))map.set(m,new Map());
    const sm=map.get(m);
    if(!sm.has(s))sm.set(s,new Map());
    const lm=sm.get(s);
    lm.set(l,(lm.get(l)||0)+1);
  });
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([module,subjects])=>({
    module, total:[...subjects.values()].reduce((n,lm)=>n+[...lm.values()].reduce((a,b)=>a+b,0),0),
    subjects:[...subjects.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([subject,lectures])=>({
      subject,total:[...lectures.values()].reduce((a,b)=>a+b,0),
      lectures:[...lectures.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([lecture,count])=>({lecture,count}))
    }))
  }));
}
function examNodeState(type,module,subject='',lecture=''){
  if(type==='module'){
    const descendants=bank.filter(q=>String(q.module)===String(module));
    const any=descendants.some(questionSelectedByBuilder), all=descendants.length>0&&descendants.every(questionSelectedByBuilder);
    return {checked:all,partial:any&&!all};
  }
  if(type==='subject'){
    const descendants=bank.filter(q=>String(q.module)===String(module)&&String(q.subject)===String(subject));
    const any=descendants.some(questionSelectedByBuilder), all=descendants.length>0&&descendants.every(questionSelectedByBuilder);
    return {checked:all,partial:any&&!all};
  }
  return {checked:examSelectionHasLecture(module,subject,lecture),partial:false};
}
function examTreeMatchesSearch(node,query){
  if(!query)return true;
  const q=query.toLowerCase();
  return node.module.toLowerCase().includes(q) || node.subjects.some(s=>s.subject.toLowerCase().includes(q)||s.lectures.some(l=>l.lecture.toLowerCase().includes(q)));
}
function renderExamTree(){
  const tree=document.getElementById('examTree');
  if(!tree)return;
  const query=String(examBuilderSearch||'').trim().toLowerCase();
  const data=examTreeData().filter(m=>examTreeMatchesSearch(m,query));
  const parts=[];
  data.forEach(m=>{
    const ms=examNodeState('module',m.module), open=!!query || examBuilderExpanded.has('m:'+m.module);
    let subjectsHtml='';
    m.subjects.forEach(s=>{
      const ss=examNodeState('subject',m.module,s.subject), subOpen=!!query || examBuilderExpanded.has('s:'+m.module+'|||'+s.subject);
      let lecturesHtml='';
      s.lectures.forEach(l=>{
        const ls=examNodeState('lecture',m.module,s.subject,l.lecture);
        lecturesHtml += '<div class="exam-node-row">'+
          '<button type="button" class="exam-node-toggle spacer" aria-hidden="true" tabindex="-1">▸</button>'+
          '<input type="checkbox" data-exam-node="lecture" data-module="'+esc(lv(m.module))+'" data-subject="'+esc(lv(s.subject))+'" data-lecture="'+esc(lv(l.lecture))+'" '+(ls.checked?'checked':'')+'>'+
          '<span class="exam-node-title">'+esc(l.lecture)+'</span><span class="exam-node-meta">'+l.count+' Q</span></div>';
      });
      subjectsHtml += '<div class="exam-node">'+
        '<div class="exam-node-row">'+
          '<button type="button" class="exam-node-toggle" data-exam-toggle="subject" data-module="'+esc(lv(m.module))+'" data-subject="'+esc(lv(s.subject))+'" aria-label="Expand or collapse '+esc(s.subject)+'">'+(subOpen?'▾':'▸')+'</button>'+
          '<input type="checkbox" data-exam-node="subject" data-module="'+esc(lv(m.module))+'" data-subject="'+esc(lv(s.subject))+'" '+(ss.checked?'checked':'')+'>'+
          '<span class="exam-node-title exam-node-clickable" data-exam-toggle="subject" data-module="'+esc(lv(m.module))+'" data-subject="'+esc(lv(s.subject))+'">'+esc(s.subject)+'</span><span class="exam-node-meta">'+s.total+' Q</span>'+
        '</div><div class="exam-node-children '+(subOpen?'':'hidden')+'">'+lecturesHtml+'</div></div>';
    });
    parts.push('<div class="exam-node">'+
      '<div class="exam-node-row">'+
        '<button type="button" class="exam-node-toggle" data-exam-toggle="module" data-module="'+esc(lv(m.module))+'" aria-label="Expand or collapse '+esc(m.module)+'">'+(open?'▾':'▸')+'</button>'+
        '<input type="checkbox" data-exam-node="module" data-module="'+esc(lv(m.module))+'" '+(ms.checked?'checked':'')+'>'+
        '<span class="exam-node-title exam-node-clickable" data-exam-toggle="module" data-module="'+esc(lv(m.module))+'">'+esc(m.module)+'</span><span class="exam-node-meta">'+m.total+' Q</span>'+
      '</div><div class="exam-node-children '+(open?'':'hidden')+'">'+subjectsHtml+'</div></div>');
  });
  tree.innerHTML=parts.join('') || '<div class="exam-builder-hint">No module, subject, or lecture matches your search.</div>';

  // Use real DOM listeners instead of inline onclick handlers. The old version
  // embedded JSON inside an HTML onclick attribute; module names containing
  // quotes/special characters could break that handler and prevent expansion.
  tree.onclick=(event)=>{
    const toggle=event.target.closest('[data-exam-toggle]');
    if(!toggle || !tree.contains(toggle))return;
    event.preventDefault();
    toggleExamTreeExpand(toggle.dataset.examToggle, toggle.dataset.module||'', toggle.dataset.subject||'');
  };

  tree.querySelectorAll('input[data-exam-node]').forEach(input=>{
    if(input.dataset.examNode==='module') input.indeterminate=examNodeState('module',input.dataset.module).partial;
    if(input.dataset.examNode==='subject') input.indeterminate=examNodeState('subject',input.dataset.module,input.dataset.subject).partial;
    input.addEventListener('change',()=>{
      const type=input.dataset.examNode==='module'?'m':input.dataset.examNode==='subject'?'s':'l';
      // Selecting a module/subject also opens its children so the user can
      // immediately refine the selection down to individual lectures.
      if(type==='m' && input.checked)examBuilderExpanded.add('m:'+input.dataset.module);
      if(type==='s' && input.checked)examBuilderExpanded.add('s:'+input.dataset.module+'|||'+input.dataset.subject);
      toggleExamTreeNode(type,input.dataset.module,input.dataset.subject||'',input.dataset.lecture||'',input.checked);
    });
  });
}
function lv(v){ return String(v ?? ''); }
function addAllLecturesForModule(module){
  bank.filter(q=>String(q.module)===String(module)).forEach(q=>examBuilderSelection.add(examPathKey('l',q.module,q.subject,q.lecture)));
}
function addAllLecturesForSubject(module,subject){
  bank.filter(q=>String(q.module)===String(module)&&String(q.subject)===String(subject)).forEach(q=>examBuilderSelection.add(examPathKey('l',q.module,q.subject,q.lecture)));
}
function removeAllLecturesForModule(module){
  bank.filter(q=>String(q.module)===String(module)).forEach(q=>examBuilderSelection.delete(examPathKey('l',q.module,q.subject,q.lecture)));
}
function removeAllLecturesForSubject(module,subject){
  bank.filter(q=>String(q.module)===String(module)&&String(q.subject)===String(subject)).forEach(q=>examBuilderSelection.delete(examPathKey('l',q.module,q.subject,q.lecture)));
}
function toggleExamTreeExpand(type,module,subject=''){
  const key=type==='m'?'m:'+module:'s:'+module+'|||'+subject;
  if(examBuilderExpanded.has(key))examBuilderExpanded.delete(key); else examBuilderExpanded.add(key);
  renderExamTree();
}
function toggleExamTreeNode(type,module,subject='',lecture='',selected){
  if(type==='m'){
    const current=examNodeState('module',module).checked;
    const next=typeof selected==='boolean'?selected:!current;
    if(next)addAllLecturesForModule(module); else removeAllLecturesForModule(module);
  }else if(type==='s'){
    const current=examNodeState('subject',module,subject).checked;
    const next=typeof selected==='boolean'?selected:!current;
    if(next)addAllLecturesForSubject(module,subject); else removeAllLecturesForSubject(module,subject);
  }else{
    const k=examPathKey('l',module,subject,lecture);
    if(selected)examBuilderSelection.add(k); else examBuilderSelection.delete(k);
  }
  renderExamTree(); updateExamSelectionSummary();
}
function clearExamBuilder(){ examBuilderSelection.clear(); renderExamTree(); updateExamSelectionSummary(); }
function selectAllExamBuilder(){ examBuilderSelection.clear(); bank.forEach(q=>examBuilderSelection.add(examPathKey('l',q.module,q.subject,q.lecture))); renderExamTree(); updateExamSelectionSummary(); }
function updateExamSelectionSummary(){
  const summary=document.getElementById('examSelectionSummary');
  if(!summary)return;
  const selectedQuestions=bank.filter(questionSelectedByBuilder);
  const modules=new Set([...examBuilderSelection].map(k=>parseExamPathKey(k)[1]));
  const subjects=new Set([...examBuilderSelection].map(k=>{const p=parseExamPathKey(k);return p[1]+'|||'+p[2];}));
  const lectures=new Set([...examBuilderSelection].map(k=>{const p=parseExamPathKey(k);return p[1]+'|||'+p[2]+'|||'+p[3];}));
  const countEl=document.getElementById('examSelectedCount');
  if(countEl) countEl.textContent=examBuilderSelection.size
    ? `${modules.size} module${modules.size===1?'':'s'} · ${subjects.size} subject${subjects.size===1?'':'s'} · ${lectures.size} lecture${lectures.size===1?'':'s'} · ${selectedQuestions.length} questions`
    : 'No specific selection — all questions';
  const groupedModules=new Set(), groupedSubjects=new Set();
  [...examBuilderSelection].forEach(k=>{const p=parseExamPathKey(k); if(p[0]==='l'){groupedModules.add(p[1]); groupedSubjects.add(p[1]+'|||'+p[2]);}});
  const chips=[...examBuilderSelection].slice(0,10).map(k=>{const p=parseExamPathKey(k); return `<span class="exam-selection-chip">${esc(p[1])} → ${esc(p[2])} → ${esc(p[3])}</span>`;}).join('');
  const more=examBuilderSelection.size>10?`<span class="mini">+${examBuilderSelection.size-10} more selected lecture groups</span>`:'';
  document.getElementById('examSelectionPaths').innerHTML=chips+more;
}

function startExam(customList=null, overrides=null, customLabel=null, setupAnswerMode=null){
  if(!customList && !bank.length){toast('No questions are loaded. Refresh from GitHub first.','error');return;}
  if(customList && !customList.length){toast('No questions to practice.','error');return;}

  let list=customList||[...bank];
  let answerMode=(setupAnswerMode==='finish'||setupAnswerMode==='immediate') ? setupAnswerMode : (settings.showAnswerImmediately?'immediate':'finish');
  let label=customLabel||'Random review', moduleFilter='', subjectFilter='', lectureFilter='';
  let moduleFilters=[], subjectFilters=[], lectureFilters=[], selectionPaths=[];
  let minutesValue=0;

  if(customList){
    label=customLabel||'Mistakes practice';
  }

  if(!customList){
    let m,s,l,n;
    if(overrides){
      moduleFilters=Array.isArray(overrides.modules)?overrides.modules.slice(): (overrides.module?[overrides.module]:[]);
      subjectFilters=Array.isArray(overrides.subjects)?overrides.subjects.slice(): (overrides.subject?[overrides.subject]:[]);
      lectureFilters=Array.isArray(overrides.lectures)?overrides.lectures.slice(): (overrides.lecture?[overrides.lecture]:[]);
      m=moduleFilters[0]||'';
      s=subjectFilters[0]||'';
      l=lectureFilters[0]||'';
      n=Math.max(1,Number(overrides.count)||20);
      answerMode=overrides.answerMode||answerMode;
      minutesValue=Number(overrides.minutes)||0;
    } else {
      n=Math.max(1,Number(document.getElementById('examCount').value)||1);
      answerMode=(document.querySelector('input[name="answerMode"]:checked')?.value==='finish')?'finish':'immediate';
      minutesValue=Number(document.getElementById('examMinutes').value)||0;
      if(examBuilderMode==='simple'){
        const sm=document.getElementById('simpleModule')?.value||'';
        const ss=document.getElementById('simpleSubject')?.value||'';
        const sl=document.getElementById('simpleLecture')?.value||'';
        moduleFilters=sm?[sm]:[];
        subjectFilters=ss?[ss]:[];
        lectureFilters=sl?[sl]:[];
      }else{
        selectionPaths=[...examBuilderSelection];
        const selected=selectedExamQuestions();
        moduleFilters=[...new Set(selected.map(q=>String(q.module)))];
        subjectFilters=[...new Set(selected.map(q=>String(q.subject)))];
        lectureFilters=[...new Set(selected.map(q=>String(q.lecture)))];
      }
    }

    moduleFilter=moduleFilters.join(', ');
    subjectFilter=subjectFilters.join(', ');
    lectureFilter=lectureFilters.join(', ');

    if(overrides){
      list=list.filter(q=>
        (!moduleFilters.length||moduleFilters.includes(String(q.module)))&&
        (!subjectFilters.length||subjectFilters.includes(String(q.subject)))&&
        (!lectureFilters.length||lectureFilters.includes(String(q.lecture)))
      );
    } else if(examBuilderMode==='simple'){
      list=list.filter(q=>
        (!moduleFilters.length||moduleFilters.includes(String(q.module)))&&
        (!subjectFilters.length||subjectFilters.includes(String(q.subject)))&&
        (!lectureFilters.length||lectureFilters.includes(String(q.lecture)))
      );
    } else if(selectionPaths.length){
      list=list.filter(questionSelectedByBuilder);
    }

    if(!list.length){
      toast('No questions match those filters.','error');
      return;
    }

    /*
      Adaptive question pool:
      - Never answered questions are always eligible.
      - Questions answered incorrectly remain eligible and can repeat.
      - Questions answered correctly are removed from future exams.
      - Reset Progress clears this memory and makes all questions eligible again.
    */
    list=list.filter(q=>q && q.id && Array.isArray(q.options) && q.options.length>=2 && Number.isInteger(Number(q.correctIndex)) && Number(q.correctIndex)>=0 && Number(q.correctIndex)<q.options.length);
    if(!list.length){
      toast('No valid questions are available for this exam selection.','error');
      return;
    }

    const eligible=list.filter(q=>{
      const p=progress[key(q)];
      return !p || p.last!=='correct';
    });

    if(!eligible.length){
      toast('All questions in this selection have been answered correctly. Reset progress to practice them again.','ok');
      return;
    }

    list=shuffle([...eligible]).slice(0,Math.min(n,eligible.length));

    // Always randomize answer order for every exam.
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });

    label=[moduleFilters.length?moduleFilters.join(', '):'All modules',subjectFilters.length?subjectFilters.join(', '):'All subjects',lectureFilters.length?lectureFilters.join(', '):'All lectures'].join(' · ');
  } else {
    // Mistakes practice is also randomized, including answer order.
    list=shuffle([...list]);
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });
  }

  exam={
    list,
    index:0,
    answers:{},
    started:Date.now(),
    minutes:customList?Number(overrides?.minutes||0):minutesValue,
    answerMode,
    submitted:false,
    label,
    moduleFilter,
    subjectFilter,
    lectureFilter,
    moduleFilters,
    subjectFilters,
    lectureFilters,
    selectionPaths
  };

  if(exam.minutes>0) startTimer(exam.minutes*60);
  saveActiveExam();
  renderQuiz();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTimer(sec){
  clearInterval(timerId);

    const left=Math.max(0,sec-Math.floor((Date.now()-exam.started)/1000));
    const t=document.getElementById('timer');if(t)t.textContent=formatTime(left);

function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

let examDrawingTool='pen';
let examDrawingColor='#101826';
const examPenColors=['#101826','#ffffff','#d32f2f','#f59e0b','#16a34a','#2563eb','#7c3aed','#ec4899'];
let examDrawingSize=3;
let examDrawingEnabled=false;
let examDrawingResizeObserver=null;

function annotationData(q){
  if(!exam||!q)return null;
  exam.annotations=exam.annotations||{};
  const id=String(q.id);
  if(!exam.annotations[id]) exam.annotations[id]={strokes:[],note:''};
  return exam.annotations[id];
}
function annotationPointsForCanvas(points,canvas){
  // Stored points are normalized to the drawing box's *unzoomed* coordinate
  // system. Never use getBoundingClientRect() here because CSS pinch-zoom
  // changes that rectangle and would scale the stored coordinates a second
  // time, making drawings jump away from the place where they were made.
  const w=Math.max(1,canvas.clientWidth||canvas.offsetWidth||1);
  const h=Math.max(1,canvas.clientHeight||canvas.offsetHeight||1);
  return points.map(p=>[p[0]*w,p[1]*h]);
}
function drawExamAnnotations(){
  const canvas=document.getElementById('examAnnotationCanvas');
  if(!canvas||!exam)return;
  const stage=canvas.parentElement;
  const rect=stage.getBoundingClientRect();
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(stage.offsetWidth||rect.width)), h=Math.max(1,Math.round(stage.offsetHeight||rect.height));
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const data=annotationData(exam.list[exam.index]);
  if(!data)return;
  for(const stroke of data.strokes||[]){
    const pts=annotationPointsForCanvas(stroke.points||[],canvas);
    if(!pts.length)continue;
    ctx.save();
    ctx.globalAlpha=stroke.tool==='highlighter'?.32:1;
    ctx.globalCompositeOperation=stroke.tool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle=stroke.tool==='highlighter'?(stroke.color||'#f2c94c'):(stroke.color||'#101826');
    ctx.lineWidth=Number(stroke.size||3)*(stroke.tool==='highlighter'?5:1);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    if(pts.length===1)ctx.lineTo(pts[0][0]+.01,pts[0][1]+.01);
    else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke(); ctx.restore();
  }
}
function initExamDrawing(){
  const canvas=document.getElementById('examAnnotationCanvas');
  const note=document.getElementById('examAnnotationNote');
  const stage=document.querySelector('.exam-annotation-stage');
  const viewport=document.querySelector('.exam-annotation-viewport');
  const surface=document.querySelector('.exam-annotation-surface');
  if(!canvas||!exam||!stage||!viewport||!surface)return;

  const data=annotationData(exam.list[exam.index]);
  if(note){
    note.value=data?.note||'';
    note.oninput=()=>{if(data){data.note=note.value;saveActiveExam();}};
  }

  drawExamAnnotations();
  if(examDrawingResizeObserver)examDrawingResizeObserver.disconnect();
  if(window.ResizeObserver){
    examDrawingResizeObserver=new ResizeObserver(()=>drawExamAnnotations());
    examDrawingResizeObserver.observe(stage);
  }

  // Drawing input is intentionally simple and stable:
  //   • exactly ONE finger draws
  //   • TWO OR MORE fingers NEVER draw and NEVER zoom the drawing box
  //   • mouse/pen remain usable as normal single-pointer input
  // There is deliberately NO pinch-zoom/pan logic here. This avoids the
  // coordinate/layout changes that previously made the question collapse or
  // made strokes jump to another location on iPad/touch devices.
  const touchPointers=new Set();
  let drawingPointerId=null;
  let blockedByMultiTouch=false;

  const syncTouchAction=()=>{
    // While drawing is enabled, keep the browser from turning the single
    // finger stroke into page scrolling/zooming. The drawing box itself has
    // no custom zoom gesture.
    viewport.style.touchAction=examDrawingEnabled?'none':'auto';
  };

  const cancelStroke=()=>{
    if(canvas._activeStroke){
      data.strokes.pop();
      canvas._activeStroke=null;
    }
    drawingPointerId=null;
    drawExamAnnotations();
  };

  const pointInDrawingBox=e=>{
    const rect=canvas.getBoundingClientRect();
    const w=Math.max(1,canvas.clientWidth||rect.width||1);
    const h=Math.max(1,canvas.clientHeight||rect.height||1);
    return [
      Math.max(0,Math.min(1,(e.clientX-rect.left)/w)),
      Math.max(0,Math.min(1,(e.clientY-rect.top)/h))
    ];
  };

  const finishStroke=()=>{
    if(canvas._activeStroke){
      canvas._activeStroke=null;
      drawingPointerId=null;
      saveActiveExam();
      drawExamAnnotations();
    }else{
      drawingPointerId=null;
    }
  };

  const releaseTouchPointer=e=>{
    if(e.pointerType==='touch'){
      touchPointers.delete(e.pointerId);
      if(touchPointers.size===0){
        blockedByMultiTouch=false;
      }
    }
  };

  const onPointerDown=e=>{
    if(e.pointerType==='touch'){
      touchPointers.add(e.pointerId);

      // The moment a second finger appears, permanently block the current
      // gesture until ALL fingers leave the drawing box. In particular, do
      // not start a second stroke and do not perform any zoom operation.
      if(touchPointers.size>=2){
        e.preventDefault();
        blockedByMultiTouch=true;
        cancelStroke();
        return;
      }

      // A new touch cannot draw if the previous gesture was already
      // classified as multi-touch.
      if(blockedByMultiTouch){
        e.preventDefault();
        return;
      }
    }

    if(!examDrawingEnabled||blockedByMultiTouch||drawingPointerId!==null)return;

    e.preventDefault();
    try{viewport.setPointerCapture?.(e.pointerId);}catch(_){ }
    drawingPointerId=e.pointerId;
    const point=pointInDrawingBox(e);
    data.strokes.push({
      tool:examDrawingTool,
      color:examDrawingTool==='highlighter'?'#f2c94c':examDrawingColor,
      size:examDrawingTool==='eraser'?Math.max(12,examDrawingSize*5):examDrawingSize,
      points:[point]
    });
    canvas._activeStroke=data.strokes[data.strokes.length-1];
    drawExamAnnotations();
  };

  const onPointerMove=e=>{
    if(e.pointerType==='touch' && touchPointers.has(e.pointerId)){
      if(blockedByMultiTouch || touchPointers.size>=2){
        e.preventDefault();
        return;
      }
    }

    if(drawingPointerId!==e.pointerId||blockedByMultiTouch||!canvas._activeStroke||!examDrawingEnabled)return;
    e.preventDefault();
    canvas._activeStroke.points.push(pointInDrawingBox(e));
    drawExamAnnotations();
  };

  const onPointerUp=e=>{
    const wasDrawing=drawingPointerId===e.pointerId;
    releaseTouchPointer(e);
    if(wasDrawing){
      if(e.pointerType==='touch' && blockedByMultiTouch){
        drawingPointerId=null;
      }else{
        finishStroke();
      }
    }
  };

  const onPointerCancel=e=>{
    const wasTouch=e.pointerType==='touch';
    if(drawingPointerId===e.pointerId)cancelStroke();
    if(wasTouch)releaseTouchPointer(e);
    if(touchPointers.size===0)blockedByMultiTouch=false;
  };

  viewport.addEventListener('pointerdown',onPointerDown,{passive:false});
  viewport.addEventListener('pointermove',onPointerMove,{passive:false});
  viewport.addEventListener('pointerup',onPointerUp,{passive:false});
  viewport.addEventListener('pointercancel',onPointerCancel,{passive:false});
  viewport.addEventListener('lostpointercapture',onPointerCancel,{passive:false});
  syncTouchAction();

  // Always restore a plain, unscaled drawing surface when the question is
  // rendered. No transform, scroll offset, or zoom state is carried between
  // questions.
  surface.style.width='100%';
  surface.style.height='auto';
  surface.style.transform='none';
  surface.style.transformOrigin='initial';
  surface.style.marginRight='0';
  surface.style.marginBottom='0';
  surface.dataset.zoom='1';
  viewport.scrollLeft=0;
  viewport.scrollTop=0;
}

  const q=exam.list.find(x=>String(x.id)===String(qid))||exam.list[exam.index];

      else if(i===selected) feedback='wrong';

          <button type="button" class="btn tool-btn ${examDrawingTool==='eraser'?'tool-active':''}" data-tool="eraser" onclick="setExamDrawingTool('eraser')" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.8 15.8 8.9-8.9a2.1 2.1 0 0 1 3 0l2.4 2.4a2.1 2.1 0 0 1 0 3l-7.1 7.1H8.1a2.2 2.2 0 0 1-1.6-.7l-1.7-1.7a.9.9 0 0 1 0-1.2Z"/><path d="m12.5 9.1 5.4 5.4"/><path d="M12 19.4h8"/></svg></button>

          <button type="button" class="btn" id="examDrawingNote" onclick="toggleExamNote()" title="Private note" aria-label="Private note"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
