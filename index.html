<head>

<title>MedEX — Medical Examination Platform</title>

<style>
:root{
  --bg:#eef2f0;--card:#ffffff;--text:#101826;--muted:#5b6b72;--line:#dbe3e1;
  --primary:#0c7c8c;--primary2:#095f6c;--primary-rgb:12,124,140;--primary-soft:#e1f0f0;
  --danger:#c0392b;--danger-soft:#fbeae7;
  --ok:#1f8a55;--ok-soft:#e7f5ec;
  --warn:#b4780a;--warn-soft:#fbf0de;
  --ink:#101826;
  --shadow:0 20px 40px -18px rgba(16,24,38,.35);
  --shadow-sm:0 1px 2px rgba(16,24,38,.06);
  --radius:16px;--radius-sm:10px;
  --topbar-h:58px;--sidebar-w:264px;
  --font-sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0f1517;--card:#182023;--text:#e7edee;--muted:#8fa0a5;--line:#2b363a;
  --primary:#20b6c9;--primary2:#57cddc;--primary-rgb:32,182,201;--primary-soft:rgba(32,182,201,.16);
  --danger:#e5695a;--danger-soft:rgba(229,105,90,.16);
  --ok:#3fcf85;--ok-soft:rgba(63,207,133,.16);
  --warn:#e0a63f;--warn-soft:rgba(224,166,63,.16);
  --ink:#05090a;
  --shadow:0 20px 40px -18px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em;margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40}
.app.sidebar-open .scrim{opacity:1;pointer-events:auto}
.appshell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 18px;background:rgba(238,242,240,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-brand{font-family:var(--font-serif);font-size:17px;font-weight:600}
.topbar-brand small{display:block;font-family:var(--font-sans);font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.icon-btn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:10px;transition:border-color .15s ease,background .15s ease}
.section-start-btn{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--primary);background:var(--primary-soft);border-radius:50%;cursor:pointer;transition:transform .12s ease,background .15s ease}
.section-start-btn:hover{background:var(--primary);transform:scale(1.08)}
.section-start-btn:hover svg{stroke:#fff;fill:#fff}
.section-start-btn svg{width:13px;height:13px;stroke:var(--primary);fill:var(--primary);margin-left:1px}
.icon-btn:hover{border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none}
.main{flex:1;padding:24px;max-width:1500px;width:100%}

/* ---------- Sidebar window ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);max-width:86vw;background:var(--ink);color:#fff;z-index:50;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
.app.sidebar-open .sidebar{transform:translateX(0)}
.sidebar-inner{width:var(--sidebar-w);max-width:86vw;height:100%;display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto}
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 6px 20px}
.brand{font-family:var(--font-serif);font-size:20px;font-weight:600;line-height:1.15}
.brand small{display:block;font-family:var(--font-sans);font-size:11px;font-weight:500;color:#93a6ab;margin-top:6px;letter-spacing:.01em}
.sidebar .icon-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.sidebar .icon-btn svg{stroke:#fff}
.sidebar .icon-btn:hover{border-color:var(--primary)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c6d1d5;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:0 0 auto;opacity:.85;stroke:currentColor;fill:none}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(var(--primary-rgb),.28);color:#fff}
.nav button.active svg{opacity:1}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:#93a6ab;border-top:1px solid rgba(255,255,255,.12)}
@media(min-width:881px){
  .sidebar{position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0 16px 16px;border-radius:var(--radius);width:var(--sidebar-w);transform:none;transition:width .22s ease,opacity .18s ease,margin .22s ease;overflow:hidden}
  .app:not(.sidebar-open) .sidebar{width:0;margin-left:0;opacity:0;box-shadow:none;pointer-events:none}
  .scrim{display:none}
}

/* ---------- Page header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons & fields ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;transition:border-color .15s ease,background .15s ease,transform .1s ease}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary2);border-color:var(--primary2)}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn.btn-lg{padding:15px 28px;font-size:16px;border-width:2px}
.btn.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:130px;resize:vertical;font-family:var(--font-mono);font-size:13px}

/* ---------- Cards & readouts ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.stat{position:relative;overflow:hidden;padding-top:20px}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary)}
.stat .label{color:var(--muted);font-size:12.5px}
.stat .value{font-family:var(--font-mono);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.section-title{margin:28px 0 12px;font-size:17px}
.bar{height:8px;background:#e3e9e7;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.progress-row{display:grid;grid-template-columns:180px 1fr 70px 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.progress-row:last-child{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary2);font-family:var(--font-mono)}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.table th{color:var(--muted);font-size:12px;background:var(--bg)}
.hidden{display:none!important}

/* ---------- Quiz ---------- */
.quiz{max-width:980px;margin:auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-weight:600;color:var(--primary);font-size:17px}
.question{font-family:var(--font-serif);font-size:21px;line-height:1.5;font-weight:600;margin:18px 0}
.options{display:grid;gap:10px}
.option{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:14px;text-align:left;transition:border-color .15s ease,background .15s ease}
.option:hover{border-color:var(--primary)}
.option.selected{border-color:var(--primary);background:var(--primary-soft)}
.option.correct{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--danger);background:var(--danger-soft)}

/* ---------- Exam question navigator ---------- */
.question-nav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.qnav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all .15s ease}
.qnav-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.qnav-btn.current{border:2px solid var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.qnav-btn.answered{background:var(--ok);border-color:var(--ok);color:#fff}
.qnav-btn.current.answered{box-shadow:0 0 0 2px var(--ok-soft),0 0 0 4px var(--primary)}
.qnav-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff}
.qnav-btn.current.wrong{box-shadow:0 0 0 2px var(--danger-soft),0 0 0 4px var(--primary)}
.nav-legend{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
.nav-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line);background:var(--card);margin-right:4px}
.nav-dot.answered{background:var(--ok);border-color:var(--ok)}
.nav-dot.wrong{background:var(--danger);border-color:var(--danger)}
.nav-dot.current{border:2px solid var(--primary)}
.review-choice{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:7px;background:var(--card)}
.review-choice.selected{border-color:var(--primary);background:var(--primary-soft)}
.review-choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.selected.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.wrong{border-color:var(--danger);background:var(--danger-soft)}

.review{margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line)}
.review.good{border-left:4px solid var(--ok)}
.review.bad{border-left:4px solid var(--danger)}
.quiz-footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.notice{padding:11px 13px;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--primary2);font-size:13px}
.notice.error{background:var(--danger-soft);color:#8a291d}
.notice.ok{background:var(--ok-soft);color:#136b40}
.empty{text-align:center;padding:38px;color:var(--muted)}
.category-card{padding:15px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px}
.category-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mini{font-size:12px;color:var(--muted)}

/* ---------- AI assistant ---------- */
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--primary2);background:var(--primary-soft);border-radius:999px;padding:3px 10px}
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabbar button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button:hover{color:var(--text)}
.tabbar button.active{color:var(--primary);border-bottom-color:var(--primary)}
.chat-log{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.chat-msg{padding:11px 14px;border-radius:14px;max-width:82%;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg.error{align-self:flex-start;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.chat-input-row{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.chat-input-row textarea{flex:1;min-height:46px;max-height:140px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite;margin-right:7px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.diff-pill{font-family:var(--font-mono);font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;text-transform:capitalize}
.diff-pill.easy{background:var(--ok-soft);color:var(--ok)}
.diff-pill.medium{background:var(--warn-soft);color:var(--warn)}
.diff-pill.hard{background:var(--danger-soft);color:var(--danger)}

@media(max-width:1000px){.stats,.filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.main{padding:16px}.stats,.filters,.two,.three{grid-template-columns:1fr}.progress-row{grid-template-columns:1fr 1fr}}
</style>
</head>

</aside>

<script>
'use strict';

/* ============================================================
   MedEx + Supabase
   - Supabase stores questions, student attempts and exam history.
   - GitHub remains as a fallback question source.
   - Replace the two placeholders below after creating your project.
   ============================================================ */

const SUPABASE_URL = 'https://ywveooexkhmmmxwtmxxl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mkYMEw2AdqmBnHceGfo6cw_LAIcaIls';
const SUPABASE_ENABLED =
  window.supabase &&
  !SUPABASE_URL.includes('PASTE_YOUR_') &&
  !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_YOUR_');

const supabaseClient = SUPABASE_ENABLED
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;
let isAdmin=false;
let adminCheckLoaded=false;

async function checkAdminRole(){
  isAdmin=false;
  adminCheckLoaded=true;
  if(!SUPABASE_ENABLED || !currentUser) return false;
  try{
    const {data,error}=await supabaseClient.rpc('is_admin');
    if(!error) isAdmin=!!data;
  }catch(e){ isAdmin=false; }
  return isAdmin;
}
async function requireAdmin(){
  if(!currentUser){toast('Please sign in first.','error');go('account');return false;}
  if(!adminCheckLoaded) await checkAdminRole();
  if(!isAdmin){toast('Admin access required.','error');go('dashboard');return false;}
  return true;
}
async function refreshAuthUser(){
  if(!SUPABASE_ENABLED){ currentUser=null; return; }
  try{
    const {data,error}=await supabaseClient.auth.getUser();
    if(error) throw error;
    currentUser=data?.user||null;
  }catch(e){ console.warn('Supabase auth:',e.message); currentUser=null; }
}

async function signUpStudent(email,password){
  if(!SUPABASE_ENABLED){toast('Supabase is not connected.','error');return false;}
  email=(email||'').trim().toLowerCase();
  if(!email || !password){toast('Enter an email and password.','error');return false;}
  if(password.length<6){toast('Password must be at least 6 characters.','error');return false;}
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){toast(error.message,'error');return false;}
  if(data?.session){ currentUser=data.user; await afterAuthChanged(); toast('Account created and signed in.','ok'); }
  else toast('Account created. Check your email to confirm the account, then sign in.','ok');
  return true;
}

async function signInStudent(email,password){
  if(!SUPABASE_ENABLED){toast('Supabase is not connected.','error');return false;}
  email=(email||'').trim().toLowerCase();
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){toast(error.message,'error');return false;}
  currentUser=data.user;
  await afterAuthChanged();
  toast('Signed in successfully.','ok');
  return true;
}

async function signOutStudent(){
  if(SUPABASE_ENABLED){const {error}=await supabaseClient.auth.signOut();if(error)console.warn(error.message);}
  currentUser=null; progress=loadJSON(CONFIG.progressKey,{}); remoteHistory=[]; globalAnalytics={modules:[],lectures:[],students:0,submittedExams:0,averageScore:0};
  render(); toast('Signed out.','ok');
}

async function afterAuthChanged(){

  await loadActiveNotifications();
  applyModuleVisibility();
  await loadSupabaseProgress();

  await loadGlobalAnalytics();
  render();
}

async function syncLocalProgressToSupabase(){
  if(!SUPABASE_ENABLED || !currentUser)return;
  const rows=[];
  for(const q of bank){
    const p=progress[key(q)];
    if(!p || !p.attempts)continue;
    rows.push({
      user_id:currentUser.id,
      question_id:q.id,
      attempts:Number(p.attempts||0),
      correct_count:Number(p.correct||0),
      wrong_count:Number(p.wrong||0),
      last_result:p.last||null,
      updated_at:new Date().toISOString()
    });
  }
  if(!rows.length)return;
  const {error}=await supabaseClient.from('student_question_progress')
    .upsert(rows,{onConflict:'user_id,question_id'});
  if(error)console.warn('Progress sync failed:',error.message);
}

async function loadSupabaseProgress(){
  if(!SUPABASE_ENABLED || !currentUser)return;
  const {data,error}=await supabaseClient
    .from('student_question_progress')
    .select('question_id,attempts,correct_count,wrong_count,last_result')
    .eq('user_id',currentUser.id);
  if(error){console.warn('Progress load failed:',error.message);return;}
  const remote={};
  (data||[]).forEach(p=>{
    remote[p.question_id]={
      attempts:p.attempts||0,
      correct:p.correct_count||0,
      wrong:p.wrong_count||0,
      last:p.last_result||null
    };
  });
  progress=remote;
  saveState();
}

async function recordAttemptToSupabase(q, selectedIndex, isCorrect, examId){

  const {error}=await supabaseClient.from('question_attempts').insert({
    user_id:currentUser.id,
    exam_id:examId,
    question_id:q.id,
    module:q.module,
    subject:q.subject,
    lecture:q.lecture,
    selected_index:selectedIndex,
    is_correct:isCorrect
  });
  if(error)console.warn('Attempt sync failed:',error.message);
}

  const {error}=await supabaseClient.from('exams').insert({
    id:result.id,
    user_id:currentUser.id,
    started_at:new Date(Date.now()-result.durationSec*1000).toISOString(),
    finished_at:result.date,
    label:result.label,
    module_filter:result.moduleFilter||null,
    subject_filter:result.subjectFilter||null,
    lecture_filter:result.lectureFilter||null,

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function attrJs(v){
  return String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'\\u003c');
}
function uid(q){ return String(q.id || '').trim(); }
function key(q){ return uid(q); }

function normalizeQuestion(q, source=''){
  const options = Array.isArray(q.options) ? q.options.map(x=>String(x)) : [];
  let ci = Number.isInteger(q.correctIndex) ? q.correctIndex : Number(q.correctIndex);
  if(!Number.isInteger(ci)) ci = -1;
  return {
    id: uid(q),
    module: String(q.module || q.section || 'General').trim() || 'General',
    subject: String(q.subject || q.category || 'General').trim() || 'General',
    lecture: String(q.lecture || 'General').trim() || 'General',
    difficulty: String(q.difficulty || '').trim(),
    reference: String(q.reference || '').trim(),
    question: String(q.question || '').trim(),
    options,
    correctIndex: ci,
    explanation: String(q.explanation || '').trim(),
    source: source || String(q.source || '')
  };
}
function validateQuestion(q, i){
  if(!q.id) return 'Missing id';
  if(!q.question) return 'Missing question';
  if(!Array.isArray(q.options) || q.options.length < 2) return 'At least 2 options required';
  if(!Number.isInteger(q.correctIndex) || q.correctIndex < 0 || q.correctIndex >= q.options.length) return 'Invalid correctIndex';
  if(!q.module) return 'Missing module';
  if(!q.subject) return 'Missing subject';
  if(!q.lecture) return 'Missing lecture';
  return '';
}
function validateBank(list){
  const errors=[], seen=new Set();
  list.forEach((raw,i)=>{
    const q=normalizeQuestion(raw, raw.source);
    const err=validateQuestion(q,i);
    if(err) errors.push(`Question ${i+1} (${q.id||'no id'}): ${err}`);
    if(q.id && seen.has(q.id)) errors.push(`Duplicate question ID: ${q.id}`);
    if(q.id) seen.add(q.id);
  });
  return errors;
}

async function fetchJSON(url){
  const r = await fetch(url + (url.includes('?')?'&':'?') + 'v=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status} while loading ${url}`);
  return await r.json();
}
async function loadQuestionsFromSupabase(){
  if(!SUPABASE_ENABLED)return false;
  try{
    const PAGE_SIZE=1000;
    const allRows=[];
    for(let from=0;;from+=PAGE_SIZE){
      const to=from+PAGE_SIZE-1;
      const {data,error}=await supabaseClient
        .from('questions')
        .select('id,module,subject,lecture,question,options,correct_index,explanation,difficulty,reference')
        .order('id',{ascending:true})
        .range(from,to);
      if(error)throw error;
      if(!Array.isArray(data))throw new Error('Invalid questions response.');
      allRows.push(...data);
      if(data.length<PAGE_SIZE)break;
    }
    const data=allRows;
    const all=data.map(q=>normalizeQuestion({
      id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,question:q.question,
      options:q.options,correctIndex:q.correct_index,explanation:q.explanation,
      difficulty:q.difficulty,reference:q.reference,source:'Supabase'
    },'Supabase'));
    const errors=validateBank(all);
    if(errors.length)throw new Error(errors.slice(0,8).join('\n'));
    const githubIds=new Set(all.map(q=>q.id));
    const retainedLocal=localQuestions.filter(q=>!githubIds.has(q.id));
    allQuestionBank=[...all,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    sourceFiles=['Supabase'];
    lastSync=new Date();
    localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
    localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:lastSync.toISOString(),sourceFiles,bank}));
    return true;
  }catch(e){
    console.warn('Supabase question load failed:',e.message);
    return false;
  }
}

async function loadQuestions(){
  const loaded=await loadQuestionsFromSupabase();
  if(!loaded) await loadFromGitHub();
}


async function loadFromGitHub(){
  const status = document.getElementById('syncStatus');
  if(status) status.textContent='Loading latest questions…';
  try{
    const manifest = await fetchJSON(CONFIG.manifest);
    let files = Array.isArray(manifest) ? manifest : manifest.files;
    if(!Array.isArray(files)) throw new Error('questions/index.json must contain a "files" array.');
    sourceFiles = files.map(x => typeof x === 'string' ? x : x.file).filter(Boolean);
    if(!sourceFiles.length) throw new Error('No question files are listed in questions/index.json.');

    const all=[];
    for(const file of sourceFiles){
      const data=await fetchJSON('./questions/'+file);
      const list=Array.isArray(data) ? data : data.questions;
      if(!Array.isArray(list)) throw new Error(`${file} must contain an array or { "questions": [...] }`);
      list.forEach(q=>all.push(normalizeQuestion(q,file)));
    }
    const errors=validateBank(all);
    if(errors.length) throw new Error(errors.slice(0,8).join('\\n'));
    const githubIds = new Set(all.map(q=>q.id));
    const retainedLocal = localQuestions.filter(q=>!githubIds.has(q.id));
    allQuestionBank=[...all,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
    localStorage.setItem(CONFIG.cacheKey, JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
    lastSync=new Date();
    render();
    toast(`Loaded ${all.length} GitHub questions${retainedLocal.length?` + ${retainedLocal.length} local questions`:''}.`, 'ok');
  }catch(e){
    const cached=loadJSON(CONFIG.cacheKey,null);
    if(cached && Array.isArray(cached.bank)){
      const cachedIds = new Set(cached.bank.map(q=>q.id));
      const retainedLocal = localQuestions.filter(q=>!cachedIds.has(q.id));
      allQuestionBank=[...cached.bank,...retainedLocal];
      localQuestions=retainedLocal;
      applyModuleVisibility();
      localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
      sourceFiles=cached.sourceFiles||[];
      lastSync=cached.updatedAt ? new Date(cached.updatedAt) : null;
      render();
      toast(`GitHub update failed. Using last saved bank. ${e.message}`, 'error');
    }else{
      bank=[];
      render();
      toast(`Could not load questions: ${e.message}`, 'error');
    }
  }
}

function getModules(){ return [...new Set(bank.map(q=>q.module))].sort((a,b)=>a.localeCompare(b)); }
function getSubjects(module=''){
  return [...new Set(bank.filter(q=>!module||q.module===module).map(q=>q.subject))].sort((a,b)=>a.localeCompare(b));
}
function getLectures(module='',subject=''){
  return [...new Set(bank.filter(q=>(!module||q.module===module)&&(!subject||q.subject===subject)).map(q=>q.lecture))].sort((a,b)=>a.localeCompare(b));
}
function pct(a,b){ return b ? Math.round((a/b)*100) : 0; }
function practicedCount(list){ return list.filter(q=>progress[key(q)] && progress[key(q)].attempts>0).length; }
function accuracyStats(list){
  let attempts=0, correct=0;
  list.forEach(q=>{
    const p=progress[key(q)];
    if(p){attempts+=p.attempts||0;correct+=p.correct||0;}
  });
  return {correct,attempts,pct:pct(correct,attempts)};
}
function accuracyFor(list){ return accuracyStats(list).pct; }
function progressStats(list){
  const practiced=practicedCount(list);
  return {done:practiced,total:list.length,pct:pct(practiced,list.length)};
}
function progressFor(list){ return progressStats(list).pct; }

function toast(text,type=''){
  const el=document.getElementById('toast');
  if(!el)return;
  el.className='notice '+(type||'');
  el.textContent=text;
  el.classList.remove('hidden');
  clearTimeout(window._toast);
  window._toast=setTimeout(()=>el.classList.add('hidden'),5000);
}

  <div id="toast" class="notice hidden"></div>${body}`;
}

  updateSidebarFoot();
  const view=location.hash.replace('#','')||'dashboard';
  const allowed=['dashboard','exam','progress','mistakes','bank','import','ai','aiquestions','settings','account','results','history'];
  const v=allowed.includes(view)?view:'dashboard';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const adminNav=document.getElementById('adminNav'); if(adminNav) adminNav.style.display=isAdmin?'flex':'none';
  const bankNav=document.getElementById('bankNav'); if(bankNav) bankNav.style.display=isAdmin?'flex':'none';
  if(v==='bank' && !isAdmin){ location.hash='dashboard'; return; }
  if(v==='dashboard') renderDashboard();
  else if(v==='exam') renderExamSetup();
  else if(v==='progress') renderProgress();
  else if(v==='history') renderHistory();
  else if(v==='mistakes') renderMistakes();
  else if(v==='bank') renderBank();
  else if(v==='import') renderImport();
  else if(v==='ai') renderAIAssistant();
  else if(v==='aiquestions') renderAIQuestions();
  else if(v==='settings') renderSettings();
  else if(v==='account') renderAccount();
  else renderResults();
}

function startExam(customList=null, overrides=null, customLabel=null){
  if(!customList && !bank.length){toast('No questions are loaded. Refresh from GitHub first.','error');return;}
  if(customList && !customList.length){toast('No questions to practice.','error');return;}

  let list=customList||[...bank];
  let answerMode=settings.showAnswerImmediately?'immediate':'finish';
  let label=customLabel||'Random review', moduleFilter='', subjectFilter='', lectureFilter='';
  let minutesValue=0;

  if(customList){
    label=customLabel||'Mistakes practice';
  }

  if(!customList){
    let m,s,l,n;
    if(overrides){
      m=overrides.module||'';
      s=overrides.subject||'';
      l=overrides.lecture||'';
      n=Math.max(1,Number(overrides.count)||20);
      answerMode=overrides.answerMode||answerMode;
      minutesValue=Number(overrides.minutes)||0;
    } else {
      m=document.getElementById('examModule').value;
      s=document.getElementById('examSubject').value;
      l=document.getElementById('examLecture').value;
      n=Math.max(1,Number(document.getElementById('examCount').value)||1);
      answerMode=document.getElementById('answerMode').value;
      minutesValue=Number(document.getElementById('examMinutes').value)||0;
    }

    moduleFilter=m;
    subjectFilter=s;
    lectureFilter=l;

    list=list.filter(q=>
      (!m||q.module===m)&&
      (!s||q.subject===s)&&
      (!l||q.lecture===l)
    );

    if(!list.length){
      toast('No questions match those filters.','error');
      return;
    }

    /*
      Adaptive question pool:
      - Never answered questions are always eligible.
      - Questions answered incorrectly remain eligible and can repeat.
      - Questions answered correctly are removed from future exams.
      - Reset Progress clears this memory and makes all questions eligible again.
    */
    const eligible=list.filter(q=>{
      const p=progress[key(q)];
      return !p || p.last!=='correct';
    });

    if(!eligible.length){
      toast('All questions in this selection have been answered correctly. Reset progress to practice them again.','ok');
      return;
    }

    list=shuffle([...eligible]).slice(0,Math.min(n,eligible.length));

    // Always randomize answer order for every exam.
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });

    label=[m||'All modules',s||'All subjects',l||'All lectures'].join(' · ');
  } else {
    // Mistakes practice is also randomized, including answer order.
    list=shuffle([...list]);
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });
  }

  exam={
    list,
    index:0,
    answers:{},
    started:Date.now(),
    minutes:customList?0:minutesValue,
    answerMode,
    submitted:false,
    label,
    moduleFilter,
    subjectFilter,
    lectureFilter
  };

  if(exam.minutes>0) startTimer(exam.minutes*60);
  renderQuiz();
}
function startModuleExam(module){
  startExam(null,{module,count:20});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTimer(sec){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!exam)return clearInterval(timerId);
    const left=Math.max(0,sec-Math.floor((Date.now()-exam.started)/1000));
    const t=document.getElementById('timer');if(t)t.textContent=formatTime(left);
    if(left<=0){
      clearInterval(timerId);
      if(settings.autoSubmit) submitExam(true);
      else {
        const t=document.getElementById('timer');
        if(t)t.textContent='00:00';
        toast('Time is up. Review your answers and submit the exam.','error');
      }
    }
  },250);
}
function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function renderQuiz(){
  if(!exam)return go('exam');
  const q=exam.list[exam.index], selected=exam.answers[q.id];
  const opts=q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="chooseAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');
  const nav=exam.list.map((item,i)=>{
    const answered=exam.answers[item.id]!==undefined;
    const wrong=answered && exam.answers[item.id]!==item.correctIndex;
    const state=wrong?'wrong':answered?'answered':'';
    return `<button class="qnav-btn ${i===exam.index?'current ':''}${state}" onclick="jumpToQuestion(${i})" title="Question ${i+1}${wrong?' — Wrong answer':answered?' — Correct answer':''}">${i+1}</button>`;
  }).join('');
  const remaining=exam.minutes?Math.max(0,exam.minutes*60-Math.floor((Date.now()-exam.started)/1000)):0;
  const answeredCount=exam.list.filter(item=>exam.answers[item.id]!==undefined).length;
  const body=`<div class="quiz"><div class="card">
    <div class="qhead"><span class="pill">${exam.index+1} / ${exam.list.length}</span><span class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</span>${exam.minutes?`<span class="timer" id="timer">${formatTime(remaining)}</span>`:''}</div>
    <div class="bar"><i style="width:${pct(exam.index,exam.list.length-1)}%"></i></div>
    <div class="question-nav" aria-label="Question navigation">
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
        <strong>Questions</strong><span class="mini">${answeredCount}/${exam.list.length} answered</span>
      </div>

      <div class="nav-legend" style="width:100%">
        <span><i class="nav-dot"></i>Not answered</span>
        <span><i class="nav-dot answered"></i>Correct</span><span><i class="nav-dot wrong"></i>Wrong</span>
        <span><i class="nav-dot current"></i>Current</span>
      </div>
    </div>
    <div class="question">${esc(q.question)}</div>
    <div class="options">${opts}</div>
    <div class="quiz-footer"><button class="btn" onclick="prevQ()" ${exam.index===0?'disabled':''}>Previous</button>
    <button class="btn primary" onclick="${exam.index===exam.list.length-1?'submitExam(false)':'nextQ()'}">${exam.index===exam.list.length-1?'Submit Exam':'Next'}</button></div>
  </div></div>`;
  document.getElementById('app').innerHTML=layout('Exam','Use the numbered buttons to move between questions. Answered questions turn green.',body);
}
function jumpToQuestion(i){
  if(!exam||exam.submitted||i<0||i>=exam.list.length)return;
  exam.index=i;
  renderQuiz();
}
function chooseAnswer(i){
  if(!exam||exam.submitted)return;
  const q=exam.list[exam.index];
  if(exam.answerMode==='immediate' && exam.answers[q.id]!==undefined)return;

  // Exactly one answer is stored. A new selection replaces the previous one.
  exam.answers[q.id]=i;

  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,j)=>b.classList.toggle('selected',j===i));

  if(exam.answerMode==='immediate'){
    buttons.forEach((b,j)=>{
      b.disabled=true;
      if(j===q.correctIndex)b.classList.add('correct');
      if(j===i&&i!==q.correctIndex)b.classList.add('wrong');
    });
    const box=document.createElement('div');
    box.className='review '+(i===q.correctIndex?'good':'bad');
    box.innerHTML=`<b>${i===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}`;
    document.querySelector('.options').after(box);
  }
}
function nextQ(){if(exam.index<exam.list.length-1){exam.index++;renderQuiz();}}
function prevQ(){if(exam.index>0){exam.index--;renderQuiz();}}
async function submitExam(auto){
  if(!exam)return;
  if(!auto && !confirm('Submit this exam now?'))return;
  clearInterval(timerId);
  let correct=0;
  exam.list.forEach(q=>{
    const a=exam.answers[q.id];
    if(a===undefined)return;
    const k=key(q);
    if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
    progress[k].attempts++;
    if(a===q.correctIndex){progress[k].correct++;correct++;progress[k].last='correct';}
    else {progress[k].wrong++;progress[k].last='wrong';}
  });
  saveState();
  const unanswered=exam.list.filter(q=>exam.answers[q.id]===undefined).length;
  const durationSec=Math.round((Date.now()-exam.started)/1000);
  const result={
    id:'exam_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    date:new Date().toISOString(),
    label:exam.label||'Exam',
    moduleFilter:exam.moduleFilter||'',
    subjectFilter:exam.subjectFilter||'',
    lectureFilter:exam.lectureFilter||'',
    total:exam.list.length,
    answered:exam.list.length-unanswered,
    correct,
    unanswered,
    accuracy:pct(correct,exam.list.length-unanswered),
    durationSec,
    list:exam.list,
    answers:exam.answers,
    auto
  };

  if(SUPABASE_ENABLED && currentUser){
    await saveExamToSupabase(result);
    for(const q of exam.list){
      const a=exam.answers[q.id];
      if(a===undefined)continue;
      await recordAttemptToSupabase(q,a,a===q.correctIndex,result.id);
    }
    await syncLocalProgressToSupabase();
    await loadGlobalAnalytics();
  }
  exam=null;
  localStorage.setItem(CONFIG.lastResultKey,JSON.stringify(result));
  saveHistory(result);
  go('results');
}

let bankPage=0;
const BANK_PAGE_SIZE=500;
function filterBank(resetPage=true){
  const s=(document.getElementById('bankSearch')?.value||'').toLowerCase(),mod=document.getElementById('bankModule')?.value||'',subj=document.getElementById('bankSubject')?.value||'',lect=document.getElementById('bankLecture')?.value||'',src=document.getElementById('bankSource')?.value||'';
  if(resetPage) bankPage=0;
  const list=bank.filter(q=>(!s||[q.id,q.question,q.subject,q.module,q.lecture].join(' ').toLowerCase().includes(s))&&(!mod||q.module===mod)&&(!subj||q.subject===subj)&&(!lect||q.lecture===lect)&&(!src||q.source===src));
  const rows=document.getElementById('bankRows');if(!rows)return;
  const totalPages=Math.max(1,Math.ceil(list.length/BANK_PAGE_SIZE));
  if(bankPage>=totalPages) bankPage=totalPages-1;
  const start=bankPage*BANK_PAGE_SIZE;
  const pageRows=list.slice(start,start+BANK_PAGE_SIZE);
  rows.innerHTML=pageRows.map(q=>`<tr><td><b>${esc(q.id)}</b></td><td>${esc(q.module)}</td><td>${esc(q.subject)}</td><td>${esc(q.lecture)}</td><td>${esc(q.question)}</td><td>${progressFor([q])}% · ${accuracyFor([q])}% acc.</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching questions.</td></tr>';
  const table=rows.closest('.table-wrap');
  if(table){
    let pager=document.getElementById('bankPager');
    if(!pager){ pager=document.createElement('div'); pager.id='bankPager'; pager.className='actions'; table.parentElement.appendChild(pager); }
    pager.innerHTML=`<span class="mini">Showing ${list.length?start+1:0}–${Math.min(start+BANK_PAGE_SIZE,list.length)} of ${list.length} matching questions</span><button class="btn" ${bankPage<=0?'disabled':''} onclick="bankPage--;filterBank(false)">Previous</button><span class="mini">Page ${bankPage+1} / ${totalPages}</span><button class="btn" ${bankPage>=totalPages-1?'disabled':''} onclick="bankPage++;filterBank(false)">Next</button>`;
  }
}

async function loadAdminNotifications(){

async function deleteAdminQuestion(id){

async function addBuiltInQuestion(){
  if(!(await requireAdmin())) return;
  const q=normalizeQuestion({
    id:document.getElementById('newQId').value,
    module:document.getElementById('newQModule').value,
    subject:document.getElementById('newQSubject').value,
    lecture:document.getElementById('newQLecture').value,
    question:document.getElementById('newQText').value,
    options:[
      document.getElementById('newQOpt0').value,
      document.getElementById('newQOpt1').value,
      document.getElementById('newQOpt2').value,
      document.getElementById('newQOpt3').value
    ],
    correctIndex:Number(document.getElementById('newQCorrect').value),
    explanation:document.getElementById('newQExplanation').value
  });

  const error=validateQuestion(q,0);
  if(error){toast('Cannot add question: '+error,'error');return}
  if(bank.some(x=>x.id===q.id) || localQuestions.some(x=>x.id===q.id)){
    toast('A question with this ID already exists. Use a unique ID.','error');return;
  }

  q.source=SUPABASE_ENABLED && currentUser ? 'Supabase' : 'Built in';

  if(SUPABASE_ENABLED && currentUser){
    const {error}=await supabaseClient.from('questions').insert({
      id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,
      question:q.question,options:q.options,correct_index:q.correctIndex,
      explanation:q.explanation,difficulty:q.difficulty||null,reference:q.reference||null
    });
    if(error){toast('Could not save to Supabase: '+error.message,'error');return;}
    bank.push(q);
    clearQuestionForm();
    await loadQuestionsFromSupabase();
    await loadGlobalAnalytics();
    render();
    toast(`Question "${q.id}" added to the shared database.`,'ok');
    return;
  }

  localQuestions.push(q);
  bank.push(q);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  clearQuestionForm();
  render();
  toast(`Question "${q.id}" added locally. Sign in to Supabase to make it available to everyone.`,'ok');
}

function clearQuestionForm(){
  ['newQId','newQModule','newQSubject','newQLecture','newQText','newQOpt0','newQOpt1','newQOpt2','newQOpt3','newQExplanation'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });

function removeLocalQuestion(id){
  if(!confirm(`Remove local question "${id}" from this browser?`))return;
  localQuestions=localQuestions.filter(q=>q.id!==id);
  bank=bank.filter(q=>q.id!==id);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast('Local question removed.','ok');
}

function clearLocalQuestions(){
  if(!localQuestions.length)return;
  if(!confirm(`Remove all ${localQuestions.length} locally added questions from this browser?`))return;
  const ids=new Set(localQuestions.map(q=>q.id));
  localQuestions=[];
  bank=bank.filter(q=>!ids.has(q.id));
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast('Local questions removed.','ok');
}

function getImportList(data){
  const list=Array.isArray(data)?data:data?.questions;
  return Array.isArray(list)?list:null;
}
function showImportPreview(data){
  const list=getImportList(data);
  const preview=document.getElementById('importPreview');
  if(!preview)return;
  pendingImportQuestions=[];
  if(!list){
    preview.innerHTML='<div class="notice error">JSON must be an array of questions, or an object containing a <b>questions</b> array.</div>';
    toast('The JSON structure is not supported.','error');
    return;
  }
  const normalized=list.map((q,i)=>normalizeQuestion(q, 'JSON upload'));
  const errors=validateBank(list);
  pendingImportQuestions=normalized;
  const duplicateIds=[]; const seen=new Set();
  normalized.forEach(q=>{if(seen.has(q.id))duplicateIds.push(q.id);seen.add(q.id);});
  const allErrors=[...errors];
  if(duplicateIds.length) allErrors.push(`Duplicate ID(s) inside this JSON: ${[...new Set(duplicateIds)].slice(0,20).join(', ')}`);
  const existingIds=new Set(bank.map(q=>q.id));
  const updates=normalized.filter(q=>existingIds.has(q.id)).length;
  const additions=normalized.length-updates;
  const errorHtml=allErrors.length
    ? `<div class="notice error"><b>Fix these problems before uploading:</b><div style="white-space:pre-wrap;margin-top:6px">${esc(allErrors.slice(0,30).join('\n'))}</div>${allErrors.length>30?`<div class="mini" style="margin-top:6px">Showing the first 30 errors.</div>`:''}</div>`
    : '<div class="notice ok"><b>Validation passed.</b> The questions are ready to upload.</div>';
  const cards=normalized.slice(0,20).map((q,i)=>`<div class="category-card"><div class="category-head"><div><b>${esc(q.id||`Question ${i+1}`)}</b><div class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</div></div><span class="pill">Correct: ${String.fromCharCode(65+(Number(q.correctIndex)||0))}</span></div><div style="margin-top:7px">${esc(q.question)}</div><div class="mini" style="margin-top:6px">A. ${esc(q.options?.[0]||'')} · B. ${esc(q.options?.[1]||'')} · C. ${esc(q.options?.[2]||'')} · D. ${esc(q.options?.[3]||'')}</div></div>`).join('');

async function uploadPreviewToSupabase(){
  if(!(await requireAdmin())) return;
  if(!currentUser || !SUPABASE_ENABLED){toast('Sign in to an administrator account first.','error');return;}
  if(!pendingImportQuestions.length){toast('Preview the JSON first.','error');return;}
  const errors=validateBank(pendingImportQuestions);
  if(errors.length){toast('Fix the validation errors before uploading.','error');return;}
  const rows=pendingImportQuestions.map(q=>({
    id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,
    question:q.question,options:q.options,correct_index:q.correctIndex,
    explanation:q.explanation||'',difficulty:q.difficulty||null,reference:q.reference||null
  }));
  const {error}=await supabaseClient.from('questions').upsert(rows,{onConflict:'id'});
  if(error){toast('Supabase upload failed: '+error.message,'error');return;}
  await loadQuestionsFromSupabase();
  await loadGlobalAnalytics();
  toast(`Uploaded ${rows.length} question${rows.length===1?'':'s'} to Supabase. Existing IDs were updated.`,'ok');
  pendingImportQuestions=[];
  render();
}

function addPreviewQuestions(list){
  const errors=validateBank(list);if(errors.length){toast('Cannot add invalid questions.','error');return}
  const existing=new Set(bank.map(q=>q.id));
  const added=[];
  for(const raw of list){
    const q=normalizeQuestion(raw,'Built in');
    if(existing.has(q.id))continue;
    existing.add(q.id);added.push(q);
  }
  if(!added.length){toast('No new questions were added. IDs already exist.','error');return}
  localQuestions.push(...added);
  bank.push(...added);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast(`Added ${added.length} new question${added.length===1?'':'s'} to this browser.`,'ok');
}
function replaceWithPreviewBank(list){
  const errors=validateBank(list);if(errors.length){toast('Cannot use invalid bank.','error');return}
  bank=list;sourceFiles=['local preview'];lastSync=new Date();
  localQuestions=list.filter(q=>q.source==='Built in');
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));

}

async function callAI(contents, generationConfig){
  let res, data;
  const headers={'Content-Type':'application/json'};
  if(aiSettings.accessCode) headers['x-access-code']=aiSettings.accessCode;
  try{
    res=await fetch('/api/ai',{
      method:'POST',
      headers,
      body:JSON.stringify({
        provider:aiSettings.provider||'groq',
        model:aiSettings.model,
        contents,
        generationConfig
      })
    });
  }catch(e){
    throw new Error('Could not reach the AI service. Check your connection.');
  }
  try{ data=await res.json(); }catch(e){ data=null; }
  if(!res.ok){
    throw new Error((data&&data.error)||`HTTP ${res.status} from the AI service.`);
  }
  const text=data&&data.text;
  if(!text) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned an empty response.`);
  return text;
}

function formatAIChatReply(reply){
  let text=String(reply||'').trim();
  if(!text)return text;
  // Remove accidental markdown code fences around a response.
  text=text.replace(/^```(?:json|text|plaintext)?\s*/i,'').replace(/\s*```$/,'').trim();
  try{
    const parsed=JSON.parse(text);
    if(typeof parsed==='string') return parsed.trim();
    if(Array.isArray(parsed)){
      return parsed.map((item,i)=>{
        if(typeof item==='string') return `• ${item}`;
        if(item && typeof item==='object'){
          const parts=[];
          if(item.question) parts.push(`Question: ${item.question}`);
          if(item.answer) parts.push(`Answer: ${item.answer}`);
          if(item.explanation) parts.push(`Explanation: ${item.explanation}`);
          if(item.text) parts.push(item.text);
          if(!parts.length) parts.push(Object.entries(item).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n'));
          return `${i+1}. ${parts.join('\n')}`;
        }
        return String(item);
      }).join('\n\n').trim();
    }
    if(parsed && typeof parsed==='object'){
      const preferred=['answer','response','text','message','explanation','content'];
      for(const key of preferred){ if(typeof parsed[key]==='string' && parsed[key].trim()) return parsed[key].trim(); }
      return Object.entries(parsed).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join('\n\n').trim();
    }
  }catch(e){}
  return text;
}

function parseAIQuestionJSON(text){
  let cleaned=String(text||'').trim();
  cleaned=cleaned.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();

  // First try the response exactly as returned.
  try{
    const parsed=JSON.parse(cleaned);
    if(Array.isArray(parsed)) return parsed;
    if(parsed && Array.isArray(parsed.questions)) return parsed.questions;
  }catch(_){}

  // Extract the largest complete JSON array from surrounding prose/code fences.
  const start=cleaned.indexOf('[');
  const end=cleaned.lastIndexOf(']');
  if(start!==-1 && end>start){
    const candidate=cleaned.slice(start,end+1).trim();
    try{
      const parsed=JSON.parse(candidate);
      if(Array.isArray(parsed)) return parsed;
    }catch(_){
      const repaired=candidate.replace(/,\s*([}\]])/g,'$1');
      try{
        const parsed=JSON.parse(repaired);
        if(Array.isArray(parsed)) return parsed;
      }catch(_){}
    }
  }

  // Some models return a single object for a one-question batch.
  const objStart=cleaned.indexOf('{');
  const objEnd=cleaned.lastIndexOf('}');
  if(objStart!==-1 && objEnd>objStart){
    try{
      const parsed=JSON.parse(cleaned.slice(objStart,objEnd+1));
      if(parsed && parsed.question && Array.isArray(parsed.options)) return [parsed];
    }catch(_){}
  }

  throw new Error('The AI returned invalid JSON. MedEx now uses OpenRouter structured-output routing for MCQ generation. Please retry.');
}

async function generateAIQuestions(){
  if(aiBusy) return;
  const module=document.getElementById('genModule').value.trim();
  const subject=document.getElementById('genSubject').value.trim();
  const lecture=document.getElementById('genLecture').value.trim();
  const difficulty=document.getElementById('genDifficulty').value;
  const thinkingLevel=document.getElementById('genThinking')?.value||'Higher-order thinking';
  const count=Math.max(1,Math.min(100,Number(document.getElementById('genCount').value)||5));
  const sourceType=document.getElementById('genSourceType').value;
  const sourcePool=getAIGeneratorPool();

  if(!module||!subject||!lecture){toast('Select a module, subject and lecture from the website lists.','error');return;}
  if(sourceType==='website'&&!sourcePool.length){toast('No website questions exist for this exact lecture. Choose another lecture or use AI medical knowledge.','error');return;}

  const btn=document.getElementById('genBtn');
  const resultBox=document.getElementById('genResult');
  aiBusy=true;
  if(btn){btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Generating…';}

  let sourceBlock='';
  let reference=`${aiProviderLabel(aiSettings.provider)} · ${aiSettings.model} medical knowledge`;
  if(sourceType==='website'){
    const sourceQuestions=sourcePool.slice(0,80).map((q,i)=>({
      number:i+1, question:q.question, options:q.options, correctAnswer:q.options[q.correctIndex], explanation:q.explanation
    }));
    sourceBlock=`Use the following existing questions from this website as the source.
Create NEW questions that test the same lecture content. Do not copy, paraphrase, or reproduce any source question.
Website source questions:
${JSON.stringify(sourceQuestions)}`;
    reference=`Website question bank · ${sourcePool.length} questions in ${module} / ${subject} / ${lecture}`;
  } else {
    sourceBlock='Use your medical knowledge to create accurate original questions for the selected topic. Do not invent facts or cite nonexistent sources.';
  }

  // Generate in small batches. OpenRouter free/low-credit keys can reject a request
  // before generation if max output tokens exceed the remaining credit allowance.
  // Keep OpenRouter batches smaller and the requested output budget conservative.
  const batchSize=aiSettings.provider==='openrouter' ? 1 : Math.min(10,count);
  const batches=[];
  for(let n=0;n<count;n+=batchSize) batches.push(Math.min(batchSize,count-n));
  const allRaw=[];

  try{
    for(let bi=0;bi<batches.length;bi++){
      const batchCount=batches[bi];
      if(resultBox) resultBox.innerHTML=`<div class="card" style="margin-top:14px"><div class="mini">Generating batch ${bi+1} of ${batches.length} (${allRaw.length}/${count} questions completed) with ${esc(aiProviderLabel(aiSettings.provider))}…</div></div>`;

      const prompt=`You are the medical question generator for Med64, a medical examination platform.
Generate exactly ${batchCount} original multiple-choice questions for medical students.
Module: ${module}
Subject: ${subject}
Lecture: ${lecture}
Difficulty: ${difficulty}
Thinking level: ${thinkingLevel}
Question source: ${sourceType==='website'?'questions already in this website':'selected AI medical knowledge'}

${sourceBlock}

Rules:
- Each question must have exactly 4 answer options and exactly one correct answer.
- The questions must be clinically and medically accurate.
- Prioritize higher-order thinking (Bloom-style Apply, Analyze, and Evaluate): use clinical vignettes, interpretation of signs/labs/images or mechanisms, comparison of related concepts, prediction of outcomes, and best-next-step reasoning when appropriate.
- Do NOT make questions that can be answered by simple definition/recall unless a small amount of recall is necessary to support a higher-order decision.
- Make distractors plausible and based on common misconceptions or clinically relevant alternatives.
- Avoid duplicate questions and avoid copying source wording.
- Keep the questions focused on the selected lecture.
- Return ONLY a valid JSON array. No markdown fences, no commentary, and no text before or after the array.
- Each item must have exactly this shape:
{"question":"...","options":["A","B","C","D"],"correctIndex":0,"explanation":"Brief justification.","difficulty":"${difficulty}"}
- correctIndex is zero-based.
- Keep each question concise and each explanation to 1–2 sentences.
- For this batch, return exactly ${batchCount} complete objects.
- Do not stop in the middle of an object. Return the complete JSON array.`;

      const text=await callAI([{role:'user',parts:[{text:prompt}]}],{
        maxOutputTokens: aiSettings.provider==='openrouter'
          ? 2200
          : Math.min(16000, Math.max(5000, batchCount*700)),
        jsonMode: aiSettings.provider==='openrouter'
      });
      const rawList=parseAIQuestionJSON(text);
      if(!rawList.length) throw new Error(`Batch ${bi+1} returned no questions.`);
      allRaw.push(...rawList.slice(0,batchCount));
      if(rawList.length<batchCount) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned only ${rawList.length} of ${batchCount} questions in batch ${bi+1}. Please try again.`);
    }

    const stamped=allRaw.slice(0,count).map((raw,i)=>normalizeQuestion({
      id:`ai-${Date.now()}-${i}-${Math.random().toString(36).slice(2,6)}`,
      module: `${module} AI generated`, subject, lecture,
      difficulty: raw.difficulty || difficulty,
      reference,
      question: raw.question,
      options: raw.options,
      correctIndex: raw.correctIndex,
      explanation: raw.explanation
    },'AI generated'));

    const errors=stamped.map((q,i)=>validateQuestion(q,i)).filter(Boolean);
    if(errors.length) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned a malformed question: ${errors[0]}`);
    if(stamped.length<count) throw new Error(`${aiProviderLabel(aiSettings.provider)} returned ${stamped.length} questions instead of ${count}. Please try again.`);

    aiQuestions.push(...stamped);
    localStorage.setItem(CONFIG.aiQuestionsKey,JSON.stringify(aiQuestions));

    if(resultBox) resultBox.innerHTML=`<div class="card" style="margin-top:14px"><div class="notice ok">Generated ${stamped.length} question${stamped.length===1?'':'s'} from ${sourceType==='website'?'your website question bank':'AI medical knowledge'}.</div>
    <div class="mini" style="margin-top:8px">${esc(module+' AI generated')} · ${esc(subject)} · ${esc(lecture)} · ${esc(aiProviderLabel(aiSettings.provider))}</div>
    <div style="margin-top:12px">${stamped.map(q=>aiQuestionPreviewCard(q)).join('')}</div>
    <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="go('aiquestions')">Review in AI Questions</button></div></div>`;
    toast(`Generated ${stamped.length} questions with ${aiProviderLabel(aiSettings.provider)}.`,'ok');
  }catch(e){
    if(resultBox) resultBox.innerHTML=`<div class="card" style="margin-top:14px"><div class="notice error">Generation failed: ${esc(e.message)}</div></div>`;
    toast(`${aiProviderLabel(aiSettings.provider)} generation failed: `+e.message,'error');
  }finally{
    aiBusy=false;
    if(btn){btn.disabled=false; btn.textContent='Generate questions';}
  }
}

async function sendAIChat(){
  if(aiBusy) return;
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text) return;

  aiChat.push({role:'user',text});
  localStorage.setItem(CONFIG.aiChatKey,JSON.stringify(aiChat));
  input.value='';
  renderAIAssistant();
  scrollChatToBottom();

  aiBusy=true;
  const sendBtn=document.getElementById('chatSendBtn');
  if(sendBtn){sendBtn.disabled=true; sendBtn.innerHTML='<span class="spinner"></span>…';}

  try{
    const contents=aiChat.filter(m=>m.role==='user'||m.role==='ai').map(m=>({
      role:m.role==='ai'?'model':'user',
      parts:[{text:m.role==='user'
        ? `Answer the user's message in ordinary, readable text. Do NOT return JSON, JSON arrays, code blocks, or a machine-readable object. Use normal sentences, short paragraphs, and bullet points when useful. If the user asks for an explanation, explain it clearly rather than formatting it as JSON.\n\nUser message:\n${m.text}`
        : m.text}]
    }));
    const reply=await callAI(contents,{maxOutputTokens:4096,responseMimeType:'text/plain'});
    aiChat.push({role:'ai',text:formatAIChatReply(reply)});
  }catch(e){
    aiChat.push({role:'error',text:'Error: '+e.message});
  }finally{
    localStorage.setItem(CONFIG.aiChatKey,JSON.stringify(aiChat));
    aiBusy=false;
    renderAIAssistant();
    scrollChatToBottom();
  }
}
function clearAIChat(){
  if(!aiChat.length)return;
  if(!confirm('Clear this chat conversation?'))return;
  aiChat=[];
  localStorage.removeItem(CONFIG.aiChatKey);
  renderAIAssistant();
}
function scrollChatToBottom(){
  const el=document.getElementById('chatLog');
  if(el) el.scrollTop=el.scrollHeight;
}

function renderAIQuestions(){
  const body=`<div class="card"><div class="category-head"><strong>${aiQuestions.length} AI-generated question${aiQuestions.length===1?'':'s'}</strong><span class="mini">Kept separately until you add them to the main question bank.</span></div>
  ${aiQuestions.length?`<div class="actions" style="margin-top:12px">
    <button class="btn primary" onclick="startExam(aiQuestions,null,'AI questions practice')">Practice these questions</button>
    <button class="btn ok" onclick="addAllAIQuestionsToBank()">Add all to Question Bank</button>
    ${isAdmin?'<button class="btn primary" onclick="uploadAIQuestionsToSupabase()">Upload JSON to Supabase</button>':''}
    <button class="btn" onclick="exportAIQuestions()">Export as JSON</button>
    <button class="btn danger" onclick="clearAllAIQuestions()">Delete all</button>
  </div>`:''}</div>
  <div style="margin-top:16px">${aiQuestions.length?aiQuestions.slice().reverse().map(q=>renderAIQuestionRow(q)).join(''):'<div class="card empty">No AI questions yet. Generate some from the AI Assistant page.</div>'}</div>`;
  document.getElementById('app').innerHTML=layout('AI Questions','Every question Groq has generated for you, independent of the main bank.',body,`<button class="btn primary" onclick="go('ai')">+ Generate more</button>`);
}
function renderAIQuestionRow(q){
  const diffClass=(q.difficulty||'').toLowerCase();
  const inBank=bank.some(b=>b.id===q.id);
  return `<div class="category-card">
    <div class="category-head"><b>${esc(q.id)}</b>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${q.difficulty?`<span class="diff-pill ${esc(diffClass)}">${esc(q.difficulty)}</span>`:''}
        ${inBank?'<span class="pill">In bank</span>':`<button class="btn" onclick="addAIQuestionToBank('${attrJs(q.id)}')">Add to bank</button>`}
        <button class="btn danger" onclick="removeAIQuestion('${attrJs(q.id)}')">Delete</button>
      </div>
    </div>
    <div class="mini" style="margin-top:6px">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}${q.reference?` · Source: ${esc(q.reference)}`:''}</div>
    <div style="margin-top:8px">${esc(q.question)}</div>
    <div class="mini" style="margin-top:8px">Correct answer: <b>${esc(q.options[q.correctIndex]||'')}</b></div>
  </div>`;
}
function addAIQuestionToBank(id){
  const q=aiQuestions.find(x=>x.id===id);
  if(!q)return;
  if(bank.some(x=>x.id===q.id)){toast('This question is already in the bank.','error');return;}
  localQuestions.push(q);
  bank.push(q);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast('Question added to the question bank.','ok');
}
function addAllAIQuestionsToBank(){
  const existing=new Set(bank.map(q=>q.id));
  const toAdd=aiQuestions.filter(q=>!existing.has(q.id));
  if(!toAdd.length){toast('All AI questions are already in the bank.','error');return;}
  localQuestions.push(...toAdd);
  bank.push(...toAdd);
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast(`Added ${toAdd.length} question${toAdd.length===1?'':'s'} to the question bank.`,'ok');
}
function removeAIQuestion(id){
  if(!confirm('Delete this AI-generated question?'))return;
  aiQuestions=aiQuestions.filter(q=>q.id!==id);
  localQuestions=localQuestions.filter(q=>q.id!==id);
  bank=bank.filter(q=>q.id!==id);
  localStorage.setItem(CONFIG.aiQuestionsKey,JSON.stringify(aiQuestions));
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast('AI question deleted.','ok');
}
function clearAllAIQuestions(){
  if(!aiQuestions.length)return;
  if(!confirm(`Delete all ${aiQuestions.length} AI-generated questions? This also removes any of them already added to the bank.`))return;
  const ids=new Set(aiQuestions.map(q=>q.id));
  aiQuestions=[];
  localQuestions=localQuestions.filter(q=>!ids.has(q.id));
  bank=bank.filter(q=>!ids.has(q.id));
  localStorage.setItem(CONFIG.aiQuestionsKey,JSON.stringify(aiQuestions));
  localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
  localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
  render();
  toast('All AI questions deleted.','ok');
}
async function uploadAIQuestionsToSupabase(){
  if(!(await requireAdmin())) return;
  if(!SUPABASE_ENABLED || !currentUser){toast('Sign in to an administrator account first.','error');return;}
  if(!aiQuestions.length){toast('There are no AI-generated questions to upload.','error');return;}
  const errors=aiQuestions.map((q,i)=>validateQuestion(q,i)).filter(Boolean);
  if(errors.length){toast('Cannot upload: '+errors[0],'error');return;}
  const rows=aiQuestions.map(q=>({
    id:q.id,
    module:q.module,
    subject:q.subject,
    lecture:q.lecture,
    question:q.question,
    options:q.options,
    correct_index:q.correctIndex,
    explanation:q.explanation||'',
    difficulty:q.difficulty||null,
    reference:q.reference||'AI generated'
  }));
  const {error}=await supabaseClient.from('questions').upsert(rows,{onConflict:'id'});
  if(error){toast('Supabase upload failed: '+error.message,'error');return;}
  await loadQuestionsFromSupabase();
  await loadGlobalAnalytics();
  toast(`Uploaded ${rows.length} AI-generated question${rows.length===1?'':'s'} to Supabase.`,'ok');
  renderAIQuestions();
}

function exportAIQuestions(){downloadBlob(JSON.stringify(aiQuestions,null,2),'med64-ai-questions.json','application/json');}

document.addEventListener('DOMContentLoaded',()=>{
  applyTheme();
  if(SUPABASE_ENABLED){
    supabaseClient.auth.onAuthStateChange((event,session)=>{
      setTimeout(()=>{
        currentUser=session?.user||null;
        adminCheckLoaded=false;
        if(!currentUser){ isAdmin=false; remoteHistory=[]; remoteHistoryLoaded=false; }
        render();
      },0);
    });
  }
  refreshAuthUser().then(async()=>{
    await loadModuleVisibility();
    await loadActiveNotifications();
    await loadQuestions();
    if(currentUser) await afterAuthChanged();
    else { await loadGlobalAnalytics(); applyModuleVisibility(); render(); }
  });
});
</script>
