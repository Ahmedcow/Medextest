<style>
:root{
  --bg:#eef2f0;--card:#ffffff;--text:#101826;--muted:#5b6b72;--line:#dbe3e1;
  --primary:#0c7c8c;--primary2:#095f6c;--primary-rgb:12,124,140;--primary-soft:#e1f0f0;
  --danger:#c0392b;--danger-soft:#fbeae7;
  --ok:#1f8a55;--ok-soft:#e7f5ec;
  --warn:#b4780a;--warn-soft:#fbf0de;
  --ink:#101826;
  --shadow:0 20px 40px -18px rgba(16,24,38,.35);
  --shadow-sm:0 1px 2px rgba(16,24,38,.06);
  --radius:16px;--radius-sm:10px;
  --topbar-h:58px;--sidebar-w:264px;
  --font-sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0f1517;--card:#182023;--text:#e7edee;--muted:#8fa0a5;--line:#2b363a;
  --primary:#20b6c9;--primary2:#57cddc;--primary-rgb:32,182,201;--primary-soft:rgba(32,182,201,.16);
  --danger:#e5695a;--danger-soft:rgba(229,105,90,.16);
  --ok:#3fcf85;--ok-soft:rgba(63,207,133,.16);
  --warn:#e0a63f;--warn-soft:rgba(224,166,63,.16);
  --ink:#05090a;
  --shadow:0 20px 40px -18px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em;margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}


/* ---------- Admin Question Bank PDF / print ---------- */
.admin-print-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--card),rgba(var(--primary-rgb),.035));box-shadow:var(--shadow-sm)}
.admin-print-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.admin-print-options{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.admin-print-check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;font-weight:600}
.admin-print-hint{padding:10px 12px;border-radius:10px;background:var(--primary-soft);color:var(--muted);border:1px solid rgba(var(--primary-rgb),.22);font-size:12.5px}
@media(max-width:900px){.admin-print-grid{grid-template-columns:1fr}.admin-print-options{align-items:flex-start;flex-direction:column}}

/* Print window generated by the admin question-bank exporter */
@media print{
  .medex-print-page{page-break-after:always;break-after:page;position:relative;min-height:297mm;height:297mm;padding:11mm 11mm 14mm;background:#fff;color:#111;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
  .medex-print-page:last-child{page-break-after:auto;break-after:auto}
  .medex-print-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8mm;border-bottom:1.5px solid #1a6f7d;padding-bottom:4mm;margin-bottom:4mm}
  .medex-print-brand{font-family:Georgia,'Times New Roman',serif;font-size:21pt;font-weight:700;color:#111}
  .medex-print-brand small{display:block;font-family:Arial,sans-serif;font-size:8.5pt;font-weight:400;color:#5b686d;margin-top:1.5mm}
  .medex-print-title{font-family:Arial,sans-serif;font-size:11pt;font-weight:700;text-align:right;color:#172025}
  .medex-print-section{font-family:Arial,sans-serif;font-size:9.5pt;font-weight:700;color:#0b6e7d;margin:0 0 2.5mm;text-transform:uppercase;letter-spacing:.06em}
  .medex-print-meta{font-family:Arial,sans-serif;font-size:9pt;color:#58656a;margin-bottom:4mm}
  .medex-print-questions{flex:1}
  .medex-print-q{display:grid;grid-template-columns:minmax(0,1fr) 15mm;border:1px solid #aeb9bd;border-bottom:0;break-inside:avoid}
  .medex-print-q:last-child{border-bottom:1px solid #aeb9bd}
  .medex-print-qbody{padding:3.4mm 4mm}
  .medex-print-qtext{font-family:Arial,sans-serif;font-size:10.5pt;line-height:1.45;font-weight:700;margin-bottom:2.5mm}
  .medex-print-opt{font-family:Arial,sans-serif;font-size:9.5pt;line-height:1.38;margin:1.2mm 0;padding-left:1mm}
  .medex-print-answer{border-left:1px solid #aeb9bd;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:12pt;font-weight:800;color:#0b6e7d;background:#f2f7f7}
  .medex-print-expl{font-family:Arial,sans-serif;font-size:8.5pt;line-height:1.35;color:#58656a;margin-top:2.5mm;border-top:1px dashed #c9d1d3;padding-top:2mm}
  .medex-print-footer{margin-top:auto;border-top:1px solid #c9d1d3;padding-top:3mm;display:flex;justify-content:space-between;gap:8mm;font-family:Arial,sans-serif;font-size:8pt;color:#5b686d}
  .medex-print-footer .sig{font-weight:700;color:#1a6f7d}
  .medex-print-footer .context{text-align:right}
}
@page{size:A4 portrait;margin:0}


/* Phase 2 learning + weekly notification system */
.weekly-notification-item{padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.weekly-notification-item.is-new{border-color:rgba(var(--primary-rgb),.42);box-shadow:0 0 0 1px rgba(var(--primary-rgb),.08)}.weekly-notification-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.weekly-notification-new{color:var(--primary);font-weight:800}.weekly-notification-message{white-space:pre-wrap;line-height:1.55;margin-top:6px;font-size:13px}
.site-notifications-card{margin-bottom:16px;background:var(--card);border:1px solid var(--line);color:var(--text)}
.site-notifications-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.site-notifications-title{display:flex;align-items:center;gap:8px;font-size:14px}.site-notifications-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--primary-soft);color:var(--primary)}.site-notifications-icon svg{width:17px;height:17px}.site-notification-count{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-size:10px;font-weight:800}.site-notifications-list{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}.site-notification-item{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text)}.site-notification-item.is-new{border-color:rgba(var(--primary-rgb),.42)}.site-notification-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10.5px;margin-bottom:4px}.site-notification-new{color:var(--primary);font-weight:800}.site-notification-message{white-space:pre-wrap;line-height:1.5;font-size:12.5px;margin-top:5px;color:var(--text)}

.study-phase2-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.study-hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.study-hub-action{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:5px}.study-hub-action:hover{border-color:var(--primary);background:var(--primary-soft)}.study-hub-action b{font-size:13px}.study-hub-action span{font-size:11px;color:var(--muted);line-height:1.45}.focus-timer-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:245px}.focus-timer{font-family:var(--font-mono);font-size:56px;font-weight:800;letter-spacing:.04em;margin:10px 0}.focus-status{font-size:11px;color:var(--muted)}.focus-presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}.focus-preset.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}.written-answer-box{min-height:130px;resize:vertical}.written-practice-shell{max-width:900px;margin:0 auto}.written-answer-feedback{margin-top:12px;line-height:1.6}.phase2-image-review{max-width:min(100%,720px);max-height:420px;display:block;margin:14px auto;border-radius:14px;border:1px solid var(--line);object-fit:contain;background:var(--bg)}
@media(max-width:850px){.study-phase2-grid{grid-template-columns:1fr}.study-hub-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.study-hub-grid{grid-template-columns:1fr}.focus-timer{font-size:44px}}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40}
.app.sidebar-open .scrim{opacity:1;pointer-events:auto}
.appshell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 18px;background:var(--card);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-brand{font-family:var(--font-serif);font-size:17px;font-weight:600}
.topbar-spacer{flex:1;min-width:0}
.topbar-actions{display:grid;grid-template-columns:max-content 44px 44px;align-items:center;column-gap:8px;position:relative;flex:0 0 auto;z-index:35}
.topbar-focus-cell{flex:0 1 auto;min-width:0;display:flex;align-items:center;justify-content:flex-end;position:relative;z-index:1}
.topbar-notification-wrap{position:relative;width:44px;height:44px;z-index:500;display:grid;place-items:center;pointer-events:auto}
.topbar-notification-btn{position:absolute!important;inset:2px!important;display:grid!important;place-items:center!important;width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important;margin:0!important;padding:0!important;z-index:1000!important;pointer-events:auto!important;cursor:pointer!important;touch-action:manipulation!important}
.topbar-theme-cell{flex:0 0 44px;width:44px;height:44px;display:grid;place-items:center;position:relative;z-index:1}
.topbar-notification-btn svg,.topbar-notification-btn .notification-unread-dot{pointer-events:none!important}
.topbar-notification-btn .notification-unread-dot{right:4px;top:4px;width:8px;height:8px;box-shadow:0 0 0 2px var(--card)}.topbar-notification-btn .notification-unread-dot{position:absolute!important;border-radius:50%!important;background:#e53935!important;display:block!important;animation:medexNotificationDotPulse 1.8s ease-in-out infinite!important}
@keyframes medexNotificationDotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.78}}
.topbar-theme-cell>*{position:relative;z-index:1}
.weekly-notifications-list{display:flex;flex-direction:column;gap:8px}
.global-notification-popover{position:fixed;right:18px;top:calc(var(--topbar-h) + 9px);width:min(390px,calc(100vw - 24px));max-height:min(70vh,520px);overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;z-index:10000}
.global-notification-popover .weekly-notification-item{background:var(--bg)}
.global-notification-popover .weekly-notifications-list{border:0;padding:0}
.global-notification-popover .notification-popover-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 4px 10px}
.global-notification-popover .notification-popover-head strong{font-size:13px}
.global-focus-timer{height:38px;display:flex;align-items:center;gap:7px;padding:0 9px 0 11px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--text);font-family:var(--font-mono);font-size:12px;white-space:nowrap;box-shadow:var(--shadow-sm)}
.global-focus-timer .focus-global-label{font-family:var(--font-sans);font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--primary);text-transform:uppercase}
.global-focus-timer .global-focus-timer-display{font-size:13px;font-weight:800;min-width:52px;text-align:center}
.global-focus-timer .global-focus-control{width:26px;height:26px;padding:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:7px;display:grid;place-items:center;position:relative;z-index:2;pointer-events:auto}
.global-focus-timer .global-focus-control:hover{border-color:var(--primary);color:var(--primary)}
@media(max-width:700px){.global-focus-timer{padding:0 6px 0 8px;gap:4px}.global-focus-timer .focus-global-label{display:none}.topbar{padding:0 10px}.topbar-actions{grid-template-columns:auto 44px 44px;column-gap:6px}.global-notification-popover{right:12px;width:min(390px,calc(100vw - 24px))}}

.topbar-brand small{display:block;font-family:var(--font-sans);font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.icon-btn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:10px;transition:border-color .15s ease,background .15s ease}
.section-start-btn{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--primary);background:var(--primary-soft);border-radius:50%;cursor:pointer;transition:transform .12s ease,background .15s ease}
.section-start-btn:hover{background:var(--primary);transform:scale(1.08)}
.section-start-btn:hover svg{stroke:#fff;fill:#fff}
.section-start-btn svg{width:13px;height:13px;stroke:var(--primary);fill:var(--primary);margin-left:1px}
.icon-btn:hover{border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none}
.main{flex:1;padding:24px;max-width:1500px;width:100%}

/* ---------- Sidebar window ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);max-width:86vw;background:var(--ink);color:#fff;z-index:50;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
.app.sidebar-open .sidebar{transform:translateX(0)}
.sidebar-inner{width:var(--sidebar-w);max-width:86vw;height:100%;display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto}
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 6px 20px}
.brand{font-family:var(--font-serif);font-size:20px;font-weight:600;line-height:1.15}
.brand small{display:block;font-family:var(--font-sans);font-size:11px;font-weight:500;color:#93a6ab;margin-top:6px;letter-spacing:.01em}
.sidebar .icon-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.sidebar .icon-btn svg{stroke:#fff}
.sidebar .icon-btn:hover{border-color:var(--primary)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c6d1d5;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:0 0 auto;opacity:.85;stroke:currentColor;fill:none}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(var(--primary-rgb),.28);color:#fff}
.nav button.active svg{opacity:1}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:#93a6ab;border-top:1px solid rgba(255,255,255,.12)}
@media(min-width:881px){
  .sidebar{position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0 16px 16px;border-radius:var(--radius);width:var(--sidebar-w);transform:none;transition:width .22s ease,opacity .18s ease,margin .22s ease;overflow:hidden}
  .app:not(.sidebar-open) .sidebar{width:0;margin-left:0;opacity:0;box-shadow:none;pointer-events:none}
  .scrim{display:none}
}

/* ---------- Page header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons & fields ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;transition:border-color .15s ease,background .15s ease,transform .1s ease}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary2);border-color:var(--primary2)}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn.btn-lg{padding:15px 28px;font-size:16px;border-width:2px}
.btn.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.answer-mode-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.answer-mode-option{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;min-height:72px}
.answer-mode-option:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.answer-mode-option input{margin-top:3px;accent-color:var(--primary)}
@media(max-width:700px){.answer-mode-list{grid-template-columns:1fr}}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:130px;resize:vertical;font-family:var(--font-mono);font-size:13px}

.multi-picker{position:relative}
.multi-picker-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;color:var(--text);text-align:left;font-size:13px;min-height:42px}
.multi-picker-toggle:hover{border-color:var(--primary)}
.multi-picker-toggle .multi-count{font-family:var(--font-mono);font-size:11px;color:var(--primary);font-weight:700}
.multi-picker-menu{position:absolute;z-index:80;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:8px;max-height:300px;overflow:auto}
.multi-picker-menu label{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text)}
.multi-picker-menu label:hover{background:var(--primary-soft)}
.multi-picker-menu input{width:16px;height:16px;accent-color:var(--primary);flex:0 0 auto}
.multi-picker-empty{padding:10px 8px;color:var(--muted);font-size:12px}

/* ---------- Smart exam builder ---------- */
.exam-builder{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.exam-builder-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.exam-builder-search{flex:1;min-width:220px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;color:var(--text)}
.exam-builder-actions{display:flex;gap:7px;flex-wrap:wrap}
.exam-tree{padding:8px;max-height:560px;overflow:auto}
.exam-node{border-radius:10px}
.exam-node + .exam-node{margin-top:2px}
.exam-node-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 8px;border-radius:9px}
.exam-node-row:hover{background:var(--primary-soft)}

.support-chat-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:9990;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px}
.support-chat{width:min(440px,100%);height:min(680px,calc(100vh - 40px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}

.support-admin-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}

@media(max-width:900px){.support-admin-layout{grid-template-columns:1fr}.support-admin-log{max-height:none}}

/* ---------- Cards & readouts ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.stat{position:relative;overflow:hidden;padding-top:20px}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary)}
.stat .label{color:var(--muted);font-size:12.5px}
.stat .value{font-family:var(--font-mono);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.section-title{margin:28px 0 12px;font-size:17px}
.bar{height:8px;background:#e3e9e7;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.progress-row{display:grid;grid-template-columns:180px 1fr 70px 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.progress-row:last-child{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary2);font-family:var(--font-mono)}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.table th{color:var(--muted);font-size:12px;background:var(--bg)}
.hidden{display:none!important}

/* ---------- Quiz ---------- */
.quiz{max-width:980px;margin:auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-weight:600;color:var(--primary);font-size:17px}
.question{font-family:var(--font-serif);font-size:21px;line-height:1.5;font-weight:600;margin:18px 0}
.options{display:grid;gap:10px}
.option{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:14px;text-align:left;transition:border-color .15s ease,background .15s ease}
.option:hover{border-color:var(--primary)}
.option.selected{border-color:var(--primary);background:var(--primary-soft)}
.option.correct{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--danger);background:var(--danger-soft)}
.question-illustration{display:block;width:100%;max-height:420px;object-fit:contain;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);margin:16px 0 18px;padding:6px}
.phase2-library-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.phase2-library-side,.phase2-library-main{min-width:0}.phase2-folder{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:8px;cursor:pointer}.phase2-folder.active{border-color:var(--primary);background:var(--primary-soft)}.phase2-folder-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.phase2-search-row{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px;gap:10px}.phase2-result{padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-top:10px}.phase2-result-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.phase2-result-meta{font-size:11px;color:var(--muted);margin-top:4px}.phase2-source{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--primary-soft);border:1px solid rgba(var(--primary-rgb),.18);font-size:12px;line-height:1.5}.phase2-note{width:100%;min-height:72px;resize:vertical}
@media(max-width:850px){.phase2-library-grid{grid-template-columns:1fr}.phase2-search-row{grid-template-columns:1fr}}
.report-panel{margin-top:10px;border:1px solid var(--danger);background:var(--danger-soft);border-radius:var(--radius-sm);padding:14px}
.report-panel h4{margin:0 0 10px}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.admin-reply{border-left:4px solid var(--primary);padding:10px 12px;background:var(--primary-soft);border-radius:var(--radius-sm);margin-top:10px}

/* ---------- Exam question navigator ---------- */
.question-nav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.qnav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all .15s ease}
.qnav-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.qnav-btn.current{border:2px solid var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.qnav-btn.answered{background:var(--ok);border-color:var(--ok);color:#fff}
.qnav-btn.current.answered{box-shadow:0 0 0 2px var(--ok-soft),0 0 0 4px var(--primary)}
.qnav-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff}
.qnav-btn.current.wrong{box-shadow:0 0 0 2px var(--danger-soft),0 0 0 4px var(--primary)}
.nav-legend{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
.nav-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line);background:var(--card);margin-right:4px}
.nav-dot.answered{background:var(--ok);border-color:var(--ok)}
.nav-dot.wrong{background:var(--danger);border-color:var(--danger)}
.nav-dot.current{border:2px solid var(--primary)}
.review-choice{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:7px;background:var(--card)}
.review-choice.selected{border-color:var(--primary);background:var(--primary-soft)}
.review-choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.selected.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.wrong{border-color:var(--danger);background:var(--danger-soft)}

.review{margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line)}
.review.good{border-left:4px solid var(--ok)}
.review.bad{border-left:4px solid var(--danger)}
.quiz-footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* ---------- Exam floating drawing & notes tools ---------- */

.exam-annotation-title,.exam-annotation-hint{display:none}

.exam-pen-color.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}

.exam-annotation-tools:not(.is-open) .tool-btn,.exam-annotation-tools:not(.is-open) #examDrawingNote{display:none}

/* v41.10: compact, theme-safe exam-builder picker */
.exam-builder-chooser{padding:0;margin:0 0 16px;background:transparent;border:0;box-shadow:none}
.exam-builder-chooser details{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}

.exam-builder-chooser .chooser-option.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 18%,transparent)}
.exam-builder-chooser .chooser-option-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);color:var(--primary);font-size:14px;flex:0 0 auto}

@media(max-width:700px){.exam-builder-chooser .chooser-menu{grid-template-columns:1fr}.exam-builder-chooser summary{min-height:46px}.exam-builder-chooser .chooser-summary-copy span{max-width:calc(100vw - 145px)}}

/* v41.9: clearer lateral drawing controls */
.exam-annotation-toolbar .tool-btn svg,.exam-annotation-toolbar .size-tool svg{width:19px;height:19px;display:block}
.exam-annotation-toolbar .size-tool{position:relative}
.exam-size-indicator{position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--card)}

/* Android scroll regression fix: the annotation viewport must use pan-y when drawing is off; only active drawing mode may set touch-action:none. */
/* v41.26: exam utility panels live inside the floating drawing rail */
.exam-tool-panel{display:none;position:fixed;right:82px;top:50%;transform:translateY(-50%);width:min(330px,calc(100vw - 100px));max-height:min(58vh,520px);overflow:auto;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);box-shadow:0 18px 42px rgba(0,0,0,.24);z-index:119}
.exam-tool-panel.is-open{display:block}
.exam-tool-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.exam-tool-panel-list{display:grid;gap:6px}.phase2-note-row{display:flex;align-items:flex-start;gap:7px}.phase2-note-jump{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;padding:0;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer}.phase2-note-jump span:last-child{overflow-wrap:anywhere}.progress-tree .bar{height:7px;margin:0}

}

.exam-note-editor-backdrop{position:fixed;inset:0;z-index:260;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(5,9,12,.58);backdrop-filter:blur(6px)}
.exam-note-editor{width:min(560px,calc(100vw - 32px));max-height:min(78vh,620px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.32);overflow:hidden}
.exam-note-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg)}

/* Detailed Module -> Subject -> Lecture progress */
.progress-tree{display:grid;gap:10px}
.progress-tree-module{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}

.progress-tree-module>summary::-webkit-details-marker{display:none}
.progress-tree-module>summary:hover{background:var(--primary-soft)}
.progress-tree-module .progress-tree-arrow{color:var(--muted);transition:transform .16s ease}
.progress-tree-module[open] .progress-tree-arrow{transform:rotate(90deg);color:var(--primary)}
.progress-tree-subjects{padding:0 12px 12px;display:grid;gap:8px}
.progress-tree-subject{border:1px solid var(--line);border-radius:11px;background:var(--bg);overflow:hidden}
.progress-tree-subject>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;cursor:pointer;color:var(--text)}

<script>
'use strict';

/* Storage wrappers: localStorage can throw (Safari private mode, blocked cookies, quota). */
function safeGetItem(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function safeRemoveItem(k){ try{ localStorage.removeItem(k); }catch(_){} }

/* ============================================================
   MedEx + Supabase
   - Supabase stores questions, student attempts and exam history.
   - GitHub remains as a fallback question source.
   - Replace the two placeholders below after creating your project.
   ============================================================ */

const SUPABASE_URL = 'https://ywveooexkhmmmxwtmxxl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mkYMEw2AdqmBnHceGfo6cw_LAIcaIls';
const SUPABASE_ENABLED =
  window.supabase &&
  !SUPABASE_URL.includes('PASTE_YOUR_') &&
  !SUPABASE_PUBLISHABLE_KEY.includes('PASTE_YOUR_');

const supabaseClient = SUPABASE_ENABLED
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;
let isAdmin=false;
let adminCheckLoaded=false;

const CONFIG = {
  cacheKey: 'med64_github_bank_v1',
  progressKey: 'med64_progress_v3',
  settingsKey: 'med64_settings_v3',
  lastResultKey: 'med64_last_result_v2',
  historyKey: 'med64_history_v1',
  localQuestionsKey: 'med64_local_questions_v1',
  aiSettingsKey: 'med64_ai_settings_v1',
  aiQuestionsKey: 'med64_ai_questions_v1',
  aiChatKey: 'med64_ai_chat_v1',
  favoritesKey: 'med64_favorite_questions_v1',
  visitorIdKey: 'med64_visitor_id_v1',
  visitorNameKey: 'med64_visitor_name_v1',
  activeExamKey: 'med64_active_exam_v1',
  supportChatKey: 'med64_support_chat_v1',
  supportReadKey: 'med64_support_read_at_v1',
  studyActivityKey: 'med64_study_activity_v1',
  flashcardStateKey: 'med64_flashcard_state_v1',
  flashcardCardsKey: 'med64_flashcard_cards_v3',
  flashcardAdminDraftsKey: 'med64_flashcard_admin_drafts_v1',
  questionNotesKey: 'med64_question_notes_v1',
  questionFoldersKey: 'med64_question_folders_v1',
  notificationReadKey: 'med64_notification_read_at_v1',
  weeklyNotificationReadKey: 'med64_weekly_notification_read_at_v1',
  siteNotificationReadKey: 'med64_site_notification_read_at_v1',
  focusStateKey: 'med64_focus_timer_v1',
};

const DEFAULT_SETTINGS = {
  showAnswerImmediately: true,
  autoSubmit: true,
  // Question and option randomization are always enabled.
  shuffleQuestions: true,
  shuffleOptions: true,
  darkMode: !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches),
  dailyGoal: 20,
  semester: null
};

const DEFAULT_AI_SETTINGS = {
  provider: 'groq',
  model: 'openai/gpt-oss-120b',
  accessCode: ''
};

let bank = [];
let sourceFiles = [];
let localQuestions = loadJSON(CONFIG.localQuestionsKey, []);
let aiQuestions = loadJSON(CONFIG.aiQuestionsKey, []);
let aiSettings = {...DEFAULT_AI_SETTINGS, ...loadJSON(CONFIG.aiSettingsKey, {})};
let aiChat = loadJSON(CONFIG.aiChatKey, []);
let favorites = new Set(loadJSON(CONFIG.favoritesKey, []));
let analyticsSummary = {total:0,signedIn:0,anonymous:0};
let aiBusy = false;
let examAIBusy = false;
let examAI = {open:false, questionId:null, messages:[]};
let progress = loadJSON(CONFIG.progressKey, {});
// Flashcard scheduling is intentionally independent from question progress and Supabase.
let flashcardState = loadJSON(CONFIG.flashcardStateKey, {});
let flashcardCards = loadJSON(CONFIG.flashcardCardsKey, []);
let flashcardAdminDrafts = loadJSON(CONFIG.flashcardAdminDraftsKey, []);
let publicFlashcardsLoaded = false;
let publicFlashcardsLoading = false;
let publicFlashcardsLastAttempt = 0;
let publicFlashcardsError = '';
let questionNotes = loadJSON(CONFIG.questionNotesKey, {});
let questionFolders = loadJSON(CONFIG.questionFoldersKey, {folders:[]});
let activeLibraryFolder='';
let librarySearchTerm='';
let librarySearchModule='';
let librarySearchSubject='';
let settings = {...DEFAULT_SETTINGS, ...loadJSON(CONFIG.settingsKey, {})};
let exam = null;
let examSubmitInProgress = false;
let timerId = null;
let lastSync = null;
let currentUser = null;
let visitorName = (safeGetItem(CONFIG.visitorNameKey)||'').trim();
let leaderboardCache = {users:[],visitors:[],updatedAt:null};
let remoteHistory = [];
let globalAnalytics = {modules:[], lectures:[], students:0, submittedExams:0, averageScore:0};
let pendingImportQuestions = [];
let remoteHistoryLoaded = false;
let moduleVisibility = {};
let allQuestionBank = [];
let activeNotifications = [];
let weeklyNotifications = [];
let studyMaterialsRows = [];
let activeStudyMaterial = null;
let studyMaterialReaderState = {page:1,zoom:100,url:'',signedUrl:'',fullscreen:false};
let studyMaterialsLoading = false;
let notificationPanelOpen=false;
let focusTimerId=null;
let focusTimerState=loadJSON(CONFIG.focusStateKey,{remaining:1500,running:false,label:'Focused study'});
let writtenPractice=null;
let studyHubFilter={module:'',subject:'',lecture:''};
if(!focusTimerState.preset)focusTimerState.preset=Number(focusTimerState.remaining||1500);
if(focusTimerState.running){
  if(!Number.isFinite(Number(focusTimerState.endTime)) && Number(focusTimerState.startedAt)){
    focusTimerState.endTime=Date.now()+Math.max(0,Number(focusTimerState.remaining||0)-Math.floor((Date.now()-Number(focusTimerState.startedAt))/1000))*1000;
  }
  focusTimerState.remaining=Math.max(0,Math.ceil(((Number(focusTimerState.endTime)||Date.now())-Date.now())/1000));
  focusTimerState.running=focusTimerState.remaining>0;
  if(!focusTimerState.running)focusTimerState.endTime=0;
  safeSetItem(CONFIG.focusStateKey,JSON.stringify(focusTimerState));
}
let examBuilderSelection = new Set();
let examBuilderExpanded = new Set();
let examBuilderSearch = '';
let flashcardSession = null;
let flashcardFilter = {module:'',subject:'',lecture:'',mode:'new',count:0};
let reportPanelOpen=false;
let examBuilderMode='simple';

function getVisitorId(){
  let id=safeGetItem(CONFIG.visitorIdKey);
  if(!id){ id='v_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12); safeSetItem(CONFIG.visitorIdKey,id); }
  return id;
}
function getVisitorName(){ return (visitorName||safeGetItem(CONFIG.visitorNameKey)||'').trim(); }
function visitorDisplayName(){ return getVisitorName() || 'Visitor'; }
async function saveVisitorName(name){
  name=String(name||'').trim().replace(/\s+/g,' ');
  if(!name){toast('Please enter a name.','error');return false;}
  if(name.length>40) name=name.slice(0,40).trim();
  visitorName=name; safeSetItem(CONFIG.visitorNameKey,name);
  if(SUPABASE_ENABLED && !currentUser){
    const {error}=await supabaseClient.rpc('save_visitor_profile',{p_visitor_id:getVisitorId(),p_display_name:name});
    if(error){console.warn('Visitor name sync failed:',error.message);toast('Name saved on this device, but could not sync to Supabase.','error');return false;}
  }
  render(); toast('Visitor name saved.','ok'); return true;
}
async function loadVisitorCloudData(){
  if(!SUPABASE_ENABLED || currentUser) return;
  const vid=getVisitorId();
  try{
    const {data:vp,error:ve}=await supabaseClient.rpc('get_visitor_profile',{p_visitor_id:vid});
    const row=Array.isArray(vp)?vp[0]:vp;
    if(!ve && row?.display_name){ visitorName=String(row.display_name).trim(); safeSetItem(CONFIG.visitorNameKey,visitorName); }
  }catch(e){console.warn('Visitor profile load failed:',e.message);}
  try{

function safeSetItem(key, value){
  try { localStorage.setItem(key, value); return true; }
  catch(error){
    // Free stale, rebuildable caches first, then retry once. Never throw a quota error into an exam flow.
    try {
      if (typeof CONFIG!=='undefined' && key!==CONFIG.cacheKey) safeRemoveItem(CONFIG.cacheKey);
      localStorage.setItem(key, value);
      return true;
    } catch(retryError){
      console.warn('Local save unavailable for', String(key||'storage key'), retryError?.message||retryError);
      return false;
    }
  }
}

function loadJSON(key, fallback){
  try { const x = JSON.parse(safeGetItem(key)); return x ?? fallback; }
  catch(e){ return fallback; }
}
function localDayKey(date=new Date()){
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function getStudyActivity(){
  return loadJSON(CONFIG.studyActivityKey, {});
}
function recordStudyAnswer(questionId, isCorrect){
  const id=String(questionId||'').trim();
  if(!id)return;
  const activity=getStudyActivity();
  const day=localDayKey();
  if(!activity[day])activity[day]={questions:{},attempts:0,correct:0,wrong:0};
  const row=activity[day];
  if(!row.questions)row.questions={};
  row.questions[id]=true;
  row.attempts=Number(row.attempts||0)+1;
  if(isCorrect){ row.correct=Number(row.correct||0)+1; }
  else { row.wrong=Number(row.wrong||0)+1; }
  row.solved=Number(row.solved||0)+1;
  safeSetItem(CONFIG.studyActivityKey,JSON.stringify(activity));
}
function studyStats(){
  const activity=getStudyActivity();
  const today=localDayKey();
  const todayRow=activity[today]||{};
  const todayQuestions=Number(todayRow.solved||todayRow.attempts||0);
  const days=Object.keys(activity).filter(d=>activity[d] && (Number(activity[d].solved||activity[d].attempts||0)>0 || Object.keys(activity[d].questions||{}).length>0)).sort();
  return {todayQuestions,daysStudied:days.length,days,activity};
}
function weekStudyData(baseDate=new Date()){
  const activity=getStudyActivity();
  const local=new Date(baseDate.getFullYear(),baseDate.getMonth(),baseDate.getDate());
  const dayOfWeek=local.getDay();
  const start=new Date(local); start.setDate(local.getDate()-dayOfWeek);
  const labels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return labels.map((label,i)=>{
    const d=new Date(start); d.setDate(start.getDate()+i);
    const key=localDayKey(d);
    const row=activity[key]||{};
    const total=Number(row.solved||row.attempts||0);
    const correct=Number(row.correct||0);
    const wrong=Number(row.wrong||0);
    return {label,key,total,correct,wrong};
  });
}
function getDailyGoal(){
  const n=Number(settings.dailyGoal);
  return Number.isFinite(n)&&n>0?Math.min(200,Math.max(1,Math.round(n))):20;
}
function studyStreak(){
  const activity=getStudyActivity();
  const hasStudy=d=>{const r=activity[d];return !!r && Number(r.solved||r.attempts||0)>0;};
  let streak=0;
  const d=new Date();
  while(true){
    const k=localDayKey(d);
    if(!hasStudy(k)){
      if(streak===0){ d.setDate(d.getDate()-1); if(!hasStudy(localDayKey(d)))break; }
      else break;
    }
    streak++; d.setDate(d.getDate()-1);
  }
  return streak;
}
function recentStudyDays(count=7){
  const activity=getStudyActivity(), out=[];
  const today=new Date();
  for(let i=count-1;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const k=localDayKey(d), r=activity[k]||{};
    out.push({key:k,label:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],solved:Number(r.solved||r.attempts||0)});
  }
  return out;
}
function spacedReviewState(q){
  const p=progress[key(q)]||{};
  return {intervalDays:Math.max(0,Number(p.reviewIntervalDays||0)),reviewStreak:Math.max(0,Number(p.reviewStreak||0)),nextReviewAt:Number(p.nextReviewAt||0),lastAnsweredAt:Number(p.lastAnsweredAt||0)};
}
function updateSpacedRepetition(q,isCorrect){
  const k=key(q);
  if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
  const p=progress[k];
  // The submit handler updates p.last before calling this function. Therefore p.last
  // cannot reliably tell us whether the *previous* review was correct; use the stored
  // streak and reset it on every wrong answer instead.
  const previousStreak=Math.max(0,Number(p.reviewStreak||0));
  let intervalDays=1, reviewStreak=0;
  if(isCorrect){
    reviewStreak=previousStreak+1;
    const ladder=[1,3,7,14,30,60,90];
    intervalDays=ladder[Math.min(reviewStreak-1,ladder.length-1)];
  }else{reviewStreak=0;intervalDays=1;}
  const now=Date.now();
  p.reviewIntervalDays=intervalDays;
  p.reviewStreak=reviewStreak;
  p.lastReviewCorrect=!!isCorrect;
  p.lastAnsweredAt=now;
  p.nextReviewAt=now+intervalDays*86400000;
}
function dueSpacedQuestions(){
  const now=Date.now();
  return bank.filter(q=>{
    const p=progress[key(q)];
    // Legacy attempts created before scheduling was added must enter the queue,
    // rather than becoming permanently invisible because nextReviewAt is absent.
    return p&&Number(p.attempts||0)>0&&(!Number(p.nextReviewAt||0)||Number(p.nextReviewAt)<=now);
  });
}
function nextSpacedReviewDate(){
  let soonest=0;
  bank.forEach(q=>{const p=progress[key(q)];if(!p||!Number(p.attempts||0))return;const t=Number(p.nextReviewAt||0);if(!t){soonest=Date.now();return;}if(t>0&&(!soonest||t<soonest))soonest=t;});
  return soonest;
}
function startSpacedReview(){
  const due=dueSpacedQuestions();
  if(!due.length){const next=nextSpacedReviewDate();toast(next?`No reviews are due yet. Next review: ${new Date(next).toLocaleString()}.`:'No spaced-repetition reviews are scheduled yet. Answer some questions first.','ok');return;}
  const list=shuffle([...due]).slice(0,Math.min(getDailyGoal(),due.length));
  startExam(list,null,'Spaced Repetition Review');

function renderStudyWeekChart(){
  const data=weekStudyData();
  // True + False already equals Total. Use stacked answer bars and a Total line
  // so the same questions are not visually counted three separate times.
  const max=Math.max(1,...data.map(d=>Number(d.total||0)));
  const baseY=230, plotH=190, groupW=82, startX=42, barW=34;
  const points=[];
  const groups=data.map((d,i)=>{
    const x=startX+i*groupW+24;
    const total=Number(d.total||0);
    const correct=Math.min(total,Number(d.correct||0));
    const wrong=Math.max(0,Math.min(total-correct,Number(d.wrong||0)));
    const correctH=Math.round((correct/max)*plotH);
    const wrongH=Math.round((wrong/max)*plotH);
    const totalH=Math.round((total/max)*plotH);
    const correctY=baseY-correctH;
    const wrongY=correctY-wrongH;
    const labelY=Math.max(18,baseY-totalH-10);
    points.push(`${x+barW/2},${labelY+4}`);
    return `${correct?`<rect class="study-bar bar-1" x="${x}" y="${correctY}" width="${barW}" height="${correctH}" rx="5"><title>${d.label}: ${correct} true</title></rect>`:''}${wrong?`<rect class="study-bar bar-2" x="${x}" y="${wrongY}" width="${barW}" height="${wrongH}" rx="5"><title>${d.label}: ${wrong} false</title></rect>`:''}<text class="study-total" x="${x+barW/2}" y="${labelY}" text-anchor="middle">${total}</text><text class="study-day" x="${x+barW/2}" y="252" text-anchor="middle">${d.label}</text>`;
  }).join('');
  const grid=[0,.25,.5,.75,1].map(t=>{
    const y=baseY-Math.round(plotH*t);
    const val=Math.round(max*t);
    return `<line class="study-grid" x1="32" y1="${y}" x2="622" y2="${y}"/><text class="study-axis" x="25" y="${y+4}" text-anchor="end">${val}</text>`;
  }).join('');
  const line=points.length>1?`<polyline class="study-total-line" points="${points.join(' ')}" fill="none"/>${points.map(p=>{const [cx,cy]=p.split(',');return `<circle class="study-total-dot" cx="${cx}" cy="${cy}" r="3.5"/>`;}).join('')}`:'';
  return `<div class="study-chart-wrap"><svg class="study-chart" viewBox="0 0 640 270" role="img" aria-label="Daily solved questions from Sunday through Saturday, with true and false stacked and total shown as a line">${grid}${groups}${line}</svg><div class="study-legend"><span><i class="legend-total"></i>Total solved</span><span><i class="legend-correct"></i>True</span><span><i class="legend-wrong"></i>False</span></div></div>`;
}

}
function uid(q){ return String(q.id || '').trim(); }

function sanitizeImageUrl(value){
  const v=String(value||'').trim();
  if(!v)return '';
  if(/^https?:\/\//i.test(v))return v;
  if(/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(v))return v;
  return '';
}
function normalizeQuestion(q, source=''){
  let rawOptions=q.options;
  if(typeof rawOptions==='string'){try{rawOptions=JSON.parse(rawOptions);}catch(_){rawOptions=[];}}
  const options = Array.isArray(rawOptions) ? rawOptions.map(x=>String(x)) : [];
  let ci = Number.isInteger(q.correctIndex) ? q.correctIndex : Number(q.correctIndex);
  if(!Number.isInteger(ci)) ci = -1;
  return {
    id: uid(q),
    module: String(q.module || q.section || 'General').trim() || 'General',
    semester: Number.isInteger(Number(q.semester)) && Number(q.semester)>=1 && Number(q.semester)<=10 ? Number(q.semester) : null,
    subject: String(q.subject || q.category || 'General').trim() || 'General',
    lecture: String(q.lecture || 'General').trim() || 'General',
    difficulty: String(q.difficulty || '').trim(),
    reference: String(q.reference || '').trim(),
    question: String(q.question || '').trim(),
    options,
    correctIndex: ci,
    explanation: String(q.explanation || '').trim(),
    imageUrl: sanitizeImageUrl(q.imageUrl || q.image_url || q.illustration || ''),
    source: source || String(q.source || '')
  };
}
function validateQuestion(q, i){
  if(!q.id) return 'Missing id';
  if(!q.question) return 'Missing question';
  if(!Array.isArray(q.options) || q.options.length < 2) return 'At least 2 options required';
  if(!Number.isInteger(q.correctIndex) || q.correctIndex < 0 || q.correctIndex >= q.options.length) return 'Invalid correctIndex';
  if(!q.module) return 'Missing module';
  if(!q.subject) return 'Missing subject';
  if(!q.lecture) return 'Missing lecture';
  return '';
}
function validateBank(list){
  const errors=[], seen=new Set();
  list.forEach((raw,i)=>{
    const q=normalizeQuestion(raw, raw.source);
    const err=validateQuestion(q,i);
    if(err) errors.push(`Question ${i+1} (${q.id||'no id'}): ${err}`);
    if(q.id && seen.has(q.id)) errors.push(`Duplicate question ID: ${q.id}`);
    if(q.id) seen.add(q.id);
  });
  return errors;
}

async function fetchJSON(url){
  // Let the browser reuse/revalidate responses instead of forcing a unique URL
  // and disabling HTTP cache on every request.
  const r = await fetch(url, {cache:'default'});

  return await r.json();
}

async function loadQuestionsFromSupabase(){
  if(!SUPABASE_ENABLED){
    const m=window.supabase?'Supabase is not configured.':'The Supabase library failed to load (blocked network or CDN). Showing saved questions.';
    window.__medexQuestionLoadError=m;setQuestionSyncStatus(m,true);return false;
  }
  try{
    const COLS='id,module,subject,lecture,question,options,correct_index,explanation,difficulty,reference,image_url,semester';
    const PAGE=250; // small pages: avoid response-size / statement-timeout failures
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const lastErrors=[];
    const runPage=async(from,to)=>{
      let last;
      for(let t=0;t<3;t++){
        try{
          const r=await supabaseClient.from('questions').select(COLS).order('id',{ascending:true}).range(from,to);
          if(r.error)throw r.error;
          return r.data||[];
        }catch(e){last=e;await sleep(400*(t+1));}
      }
      throw last;
    };
    // A failing range is split in halves so one bad/huge row cannot take its neighbours down with it.
    const fetchRange=async(from,to)=>{
      try{return await runPage(from,to);}
      catch(e){
        if(to-from<=0){lastErrors.push(`row ${from}: ${e.message||e}`);return [];}
        const mid=Math.floor((from+to)/2);
        const a=await fetchRange(from,mid), b=await fetchRange(mid+1,to);
        return a.concat(b);
      }
    };

    setQuestionSyncStatus('Syncing questions from Supabase…',false);
    let total=null,countError='';
    try{
      const head=await supabaseClient.from('questions').select('id',{count:'exact',head:true});
      if(head.error)countError=head.error.message||String(head.error);
      else if(Number.isFinite(head.count))total=head.count;
    }catch(e){countError=e.message||String(e);}

    const rowsById=new Map();
    let rawFetched=0,noId=0;
    const addRows=rows=>rows.forEach(r=>{rawFetched++;if(r&&r.id!=null)rowsById.set(String(r.id),r);else noId++;});

    if(total!==null&&total>0){
      const starts=[];for(let f=0;f<total;f+=PAGE)starts.push(f);
      for(let i=0;i<starts.length;i+=3){
        const chunk=await Promise.all(starts.slice(i,i+3).map(f=>fetchRange(f,f+PAGE-1)));
        chunk.forEach(addRows);
        setQuestionSyncStatus(`Syncing questions… ${rowsById.size}/${total}`,false);
      }
    }else{
      // Count unavailable: walk pages until one comes back empty/short.
      for(let f=0,guard=0;guard<400;guard++,f+=PAGE){
        const rows=await fetchRange(f,f+PAGE-1);
        addRows(rows);
        if(rows.length<PAGE)break;
      }
    }

    if(rowsById.size===0){
      const m='Supabase returned 0 questions'+(lastErrors.length?': '+lastErrors[0]:countError?': '+countError:' (check the SELECT policy / sign-in).');
      window.__medexQuestionLoadError=m;console.warn(m);setQuestionSyncStatus(m+' Showing saved questions.',true);return false;
    }

    const all=[],skipped=[];
    rowsById.forEach(row=>{
      const q=normalizeQuestion({
        id:row.id,module:row.module,semester:row.semester,subject:row.subject,lecture:row.lecture,question:row.question,
        options:row.options,correctIndex:row.correct_index,explanation:row.explanation,
        difficulty:row.difficulty,reference:row.reference,imageUrl:row.image_url,source:'Supabase'
      },'Supabase');
      const err=validateQuestion(q,0);
      if(err)skipped.push({id:row.id,reason:err}); else all.push(q);
    });
    if(!all.length)throw new Error('No valid questions were returned.');
    if(skipped.length)console.warn(`Skipped ${skipped.length} malformed question(s):`,skipped.slice(0,30));

    const partial=total!==null&&rowsById.size<total;
    const loadedIds=new Set(all.map(q=>q.id));
    // If some rows could not be fetched, keep their previously saved copies instead of losing them.
    const keepOld=partial?allQuestionBank.filter(q=>!loadedIds.has(q.id)&&q.source==='Supabase'):[];
    const retainedLocal=localQuestions.filter(q=>!loadedIds.has(q.id));
    allQuestionBank=[...all,...keepOld,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    sourceFiles=['Supabase'];
    lastSync=new Date();
    const duplicateIds=rawFetched-noId-rowsById.size;
    const unassigned=all.filter(q=>q.semester==null).length;
    const hiddenModules=all.filter(q=>!isModuleVisible(q.module)).length;
    const sel=getSelectedSemester();
    const otherSemester=sel?all.filter(q=>q.semester!=null&&Number(q.semester)!==sel).length:0;
    window.__medexQuestionLoadError=partial?`Only ${rowsById.size} of ${total} questions could be fetched. ${lastErrors[0]||''}`:'';
    window.__medexQuestionLoadInfo={total,rawFetched,duplicateIds,noId,fetched:rowsById.size,loaded:all.length,skipped,unassigned,hiddenModules,otherSemester,selectedSemester:sel,visible:bank.length,errors:lastErrors.slice(0,10)};
    console.info('MedEx question load:',window.__medexQuestionLoadInfo);
    safeSetItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
    safeSetItem(CONFIG.cacheKey,JSON.stringify({updatedAt:lastSync.toISOString(),sourceFiles,questions:allQuestionBank}));
    if(partial){
      setQuestionSyncStatus(`Partial sync: ${rowsById.size} of ${total} questions fetched. ${lastErrors[0]||''}`,true);
      setTimeout(()=>toast(`Only ${rowsById.size} of ${total} questions synced. ${lastErrors[0]||'Tap Refresh to retry.'}`,'error'),600);
    }else if(isAdmin){
      const bits=[`${all.length} loaded from Supabase`+(total!==null?` of ${total}`:'')];
      if(skipped.length)bits.push(`${skipped.length} malformed (skipped, see console)`);
      if(duplicateIds>0)bits.push(`${duplicateIds} share a duplicate ID (only one kept)`);
      if(noId)bits.push(`${noId} have no ID`);
      if(unassigned)bits.push(`${unassigned} have no semester`);
      setTimeout(()=>toast(bits.join(' · '),skipped.length||duplicateIds>0||noId?'error':'ok'),600);
    }
    return true;
  }catch(e){
    const m='Question sync failed: '+(e.message||e);
    console.warn(m);
    window.__medexQuestionLoadError=m;
    setQuestionSyncStatus(m+'. Showing saved questions.',true);
    setTimeout(()=>toast(m+'. Showing saved questions.','error'),600);
    return false;
  }
}

function total_visible_note(){const i=window.__medexQuestionLoadInfo;if(!i)return '.';return i.visible<allQuestionBank.length?` (${i.visible} available for your semester/modules).`:'.';}
async function loadQuestions(){
  // Render a saved copy immediately for faster startup, then refresh from Supabase only.
  try{
    const cached=safeGetItem(CONFIG.cacheKey);
    if(cached){
      const parsed=JSON.parse(cached);
      const bank=Array.isArray(parsed)?parsed:(parsed.questions||parsed.data||[]);
      if(Array.isArray(bank)&&bank.length){
        allQuestionBank=bank.map(q=>normalizeQuestion(q)).filter(Boolean);
        applyModuleVisibility();
        if(parsed.sourceFiles)sourceFiles=parsed.sourceFiles;
        if(parsed.lastSync)lastSync=parsed.lastSync;
        render();
        const status=document.getElementById('syncStatus');
        if(status)status.textContent='Showing saved questions while checking Supabase…';
      }
    }
  }catch(e){console.warn('Could not restore cached questions:',e);}
  const ok=await loadQuestionsFromSupabase();
  if(ok){
    render();
    const status=document.getElementById('syncStatus');
    if(status){ if(window.__medexQuestionLoadError)setQuestionSyncStatus(window.__medexQuestionSyncMsg||window.__medexQuestionLoadError,true); else status.textContent=`Loaded ${allQuestionBank.length} questions from Supabase`+total_visible_note(); }
    return;
  }
  // No GitHub fallback: question bank is Supabase-only.
  if(!allQuestionBank.length){
    allQuestionBank=[];
    applyModuleVisibility();
    render();
  }
  setQuestionSyncStatus((window.__medexQuestionLoadError||'Could not load questions from Supabase')+' Check your connection and Supabase permissions.',true);
}

function practicedCount(list){ return list.filter(q=>progress[key(q)] && progress[key(q)].attempts>0).length; }
function accuracyStats(list){

function go(v){
  // Leaving the Exam page intentionally ends the in-progress exam.
  // Switching apps/tabs or closing/reopening the browser does NOT call go(),
  // so the active exam remains recoverable from localStorage.
  if(v!=='exam' && exam && !exam.submitted){
    if(!confirm('You have an exam in progress. Leaving now will discard it. Leave anyway?')){ location.hash='exam'; return; }
    clearInterval(timerId);
    exam=null;
    reportPanelOpen=false;
    examAI={open:false,questionId:null,messages:[]};
    clearActiveExam();
  }
  location.hash=v;
  render();
}

function leaderboardRowsByXP(data){
  const rows=(Array.isArray(data?.participants)?data.participants:[]).slice();
  rows.sort((a,b)=>Number(b.correct_count||0)-Number(a.correct_count||0)
    ||String(a.display_name||'').localeCompare(String(b.display_name||'')));
  let lastXP=null,rank=0;
  rows.forEach((r,i)=>{const xp=Math.max(0,Number(r.correct_count||0));if(lastXP===null||xp!==lastXP)rank=i+1;r.rank=rank;r.xp=xp;lastXP=xp;});
  return rows;
}

async function refreshUnifiedLeaderboard(){
  const host=document.getElementById('leaderboardContent');
  if(!host)return;

  if(!document.getElementById('leaderboardContent'))return;
  if(data?.error){host.innerHTML=`<div class="notice error">Could not load leaderboard: ${esc(data.error)}</div>`;return;}
  const rows=leaderboardRowsByXP(data);
  if(!rows.length){host.innerHTML='<div class="empty">No ranked participants yet.</div>';return;}
  const topTen=rows.slice(0,10);
  const me=rows.find(leaderboardIsCurrentParticipant);
  const currentOutsideTopTen=me&&!topTen.some(r=>leaderboardIsCurrentParticipant(r));

  const html=shown.map((r,i)=>leaderboardRowHTML(r,rows.indexOf(r))).join('');
  host.innerHTML=`<div class="category-card"><div class="category-head"><strong>Top 10 Students</strong><span class="pill">${Math.min(10,rows.length)}</span></div>${html}</div>${currentOutsideTopTen?'<div class="mini" style="margin-top:12px">Your rank is shown below the top 10.</div>':''}<div class="mini" style="margin-top:10px">Students and visitors are ranked together by XP. Each correct answer = 1 XP. Tied XP shares the same rank. Updated ${data.updatedAt?new Date(data.updatedAt).toLocaleString():'now'}.</div>`;

  const firstUnpracticed=bank.find(q=>!Number(progress[key(q)]?.attempts||0));
  let plan;
  if(dueCards>0)plan={type:'flashcards',title:'Review your due flashcards',desc:`${dueCards} revision card${dueCards===1?' is':'s are'} due. A short recall session now helps keep previously learned material fresh.`,button:'Start revision cards',icon:'▤'};
  else if(dueQuestions.length)plan={type:'spaced',title:'Review questions due today',desc:`You have ${dueQuestions.length} previously studied question${dueQuestions.length===1?'':'s'} due for spaced repetition.`,button:'Start spaced review',icon:'↻'};
  else if(wrongQuestions.length)plan={type:'mistakes',title:'Strengthen your weak points',desc:`You have ${wrongQuestions.length} question${wrongQuestions.length===1?'':'s'} with previous mistakes. Revisit them before moving on.`,button:'Practice mistakes',icon:'◎'};
  else if(weakTopics.length){const t=weakTopics[0];plan={type:'topic',topic:t,title:`Focus on ${t.lecture||t.subject||t.module}`,desc:`${t.accuracy}% accuracy across ${t.attempts} attempts in ${[t.module,t.subject,t.lecture].filter(Boolean).join(' · ')}. Targeted practice may help improve retention.`,button:'Practice this topic',icon:'⌖'};}
  else if(firstUnpracticed)plan={type:'new',topic:firstUnpracticed,title:'Start with a new question',desc:`You have unpracticed questions available in ${[firstUnpracticed.module,firstUnpracticed.subject,firstUnpracticed.lecture].filter(Boolean).join(' · ')}.`,button:'Start practicing',icon:'→'};
  else if(bank.length)plan={type:'mixed',title:'Keep your knowledge sharp',desc:'You have no overdue revision or recorded mistakes. Try a mixed practice session to maintain your progress.',button:'Start a mixed exam',icon:'✓'};
  else plan={type:'empty',title:'Your next study session starts here',desc:'Questions will appear here when the question bank has loaded from Supabase.',button:'Refresh question bank',icon:'↻'};
  return {plan,dueQuestions:dueQuestions.length,dueCards,wrongQuestions:wrongQuestions.length,weakTopics};
}
function startSmartStudyAction(type){
  if(type==='flashcards'){flashcardFilter={module:'',subject:'',lecture:'',mode:'new',count:0};go('flashcards');return;}
  if(type==='spaced'){startSpacedReview();return;}
  if(type==='mistakes'){const list=bank.filter(q=>Number(progress[key(q)]?.wrong||0)>0);if(!list.length){toast('No recorded mistakes to practise yet.','ok');return;}startExam(list,null,'Mistakes Review');return;}
  if(type==='topic'){
    const plan=smartStudyPlan().plan,t=plan.topic;if(!t)return;
    const list=bank.filter(q=>String(q.module||'')===t.module&&String(q.subject||'')===t.subject&&String(q.lecture||'')===t.lecture);
    if(list.length)startExam(list,null,`Targeted practice · ${t.lecture||t.subject||t.module}`);else toast('No questions are available for this topic.','error');return;
  }
  if(type==='new'){const q=bank.find(x=>!Number(progress[key(x)]?.attempts||0));if(q){const list=bank.filter(x=>x.module===q.module&&x.subject===q.subject&&x.lecture===q.lecture);startExam(list,null,`New questions · ${q.lecture||q.subject||q.module}`);}else go('exam');return;}
  if(type==='mixed'){startExam();return;}
  if(type==='empty'){loadQuestions();return;}
}

function examPathKey(type,module='',subject='',lecture=''){
  return JSON.stringify([type,String(module||''),String(subject||''),String(lecture||'')]);
}
function parseExamPathKey(key){
  try{return JSON.parse(key);}catch(e){return []}
}
function examSelectionHasModule(module){
  const rows=bank.filter(q=>String(q.module)===String(module));
  return rows.length>0 && rows.every(q=>examSelectionHasLecture(q.module,q.subject,q.lecture));
}
function examSelectionHasSubject(module,subject){
  const rows=bank.filter(q=>String(q.module)===String(module)&&String(q.subject)===String(subject));
  return rows.length>0 && rows.every(q=>examSelectionHasLecture(q.module,q.subject,q.lecture));
}
function examSelectionHasLecture(module,subject,lecture){ return examBuilderSelection.has(examPathKey('l',module,subject,lecture)); }
function questionSelectedByBuilder(q){ return examSelectionHasLecture(q.module,q.subject,q.lecture); }
function examTreeData(){
  const map=new Map();
  bank.forEach(q=>{
    const m=String(q.module||'Uncategorized'), s=String(q.subject||'Uncategorized'), l=String(q.lecture||'General');
    if(!map.has(m))map.set(m,new Map());
    const sm=map.get(m);
    if(!sm.has(s))sm.set(s,new Map());
    const lm=sm.get(s);
    lm.set(l,(lm.get(l)||0)+1);
  });
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([module,subjects])=>({
    module, total:[...subjects.values()].reduce((n,lm)=>n+[...lm.values()].reduce((a,b)=>a+b,0),0),
    subjects:[...subjects.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([subject,lectures])=>({
      subject,total:[...lectures.values()].reduce((a,b)=>a+b,0),
      lectures:[...lectures.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([lecture,count])=>({lecture,count}))
    }))
  }));
}
function examNodeState(type,module,subject='',lecture=''){
  if(type==='module'){
    const descendants=bank.filter(q=>String(q.module)===String(module));
    const any=descendants.some(questionSelectedByBuilder), all=descendants.length>0&&descendants.every(questionSelectedByBuilder);
    return {checked:all,partial:any&&!all};
  }
  if(type==='subject'){
    const descendants=bank.filter(q=>String(q.module)===String(module)&&String(q.subject)===String(subject));
    const any=descendants.some(questionSelectedByBuilder), all=descendants.length>0&&descendants.every(questionSelectedByBuilder);
    return {checked:all,partial:any&&!all};
  }
  return {checked:examSelectionHasLecture(module,subject,lecture),partial:false};
}
function examTreeMatchesSearch(node,query){
  if(!query)return true;
  const q=query.toLowerCase();
  return node.module.toLowerCase().includes(q) || node.subjects.some(s=>s.subject.toLowerCase().includes(q)||s.lectures.some(l=>l.lecture.toLowerCase().includes(q)));
}

          '<input type="checkbox" data-exam-node="subject" data-module="'+esc(lv(m.module))+'" data-subject="'+esc(lv(s.subject))+'" '+(ss.checked?'checked':'')+'>'+
          '<span class="exam-node-title exam-node-clickable" data-exam-toggle="subject" data-module="'+esc(lv(m.module))+'" data-subject="'+esc(lv(s.subject))+'">'+esc(s.subject)+'</span><span class="exam-node-meta">'+s.total+' Q</span>'+

  });
  tree.innerHTML=parts.join('') || '<div class="exam-builder-hint">No module, subject, or lecture matches your search.</div>';

  // Use real DOM listeners instead of inline onclick handlers. The old version
  // embedded JSON inside an HTML onclick attribute; module names containing
  // quotes/special characters could break that handler and prevent expansion.
  tree.onclick=(event)=>{
    const toggle=event.target.closest('[data-exam-toggle]');

  tree.querySelectorAll('input[data-exam-node]').forEach(input=>{
    if(input.dataset.examNode==='module') input.indeterminate=examNodeState('module',input.dataset.module).partial;
    if(input.dataset.examNode==='subject') input.indeterminate=examNodeState('subject',input.dataset.module,input.dataset.subject).partial;
    input.addEventListener('change',()=>{

      // Selecting a module/subject also opens its children so the user can

      if(type==='s' && input.checked)examBuilderExpanded.add('s:'+input.dataset.module+'|||'+input.dataset.subject);
      toggleExamTreeNode(type,input.dataset.module,input.dataset.subject||'',input.dataset.lecture||'',input.checked);
    });
  });

function toggleExamTreeNode(type,module,subject='',lecture='',selected){
  if(type==='m'){
    const current=examNodeState('module',module).checked;
    const next=typeof selected==='boolean'?selected:!current;
    if(next)addAllLecturesForModule(module); else removeAllLecturesForModule(module);
  }else if(type==='s'){
    const current=examNodeState('subject',module,subject).checked;
    const next=typeof selected==='boolean'?selected:!current;
    if(next)addAllLecturesForSubject(module,subject); else removeAllLecturesForSubject(module,subject);
  }else{
    const k=examPathKey('l',module,subject,lecture);
    if(selected)examBuilderSelection.add(k); else examBuilderSelection.delete(k);

function startExam(customList=null, overrides=null, customLabel=null, setupAnswerMode=null){
  if(!customList && !bank.length){toast('No questions are loaded from Supabase. Check your connection and database permissions.','error');return;}
  if(customList && !customList.length){toast('No questions to practice.','error');return;}

  let list=customList||[...bank];
  let answerMode=(setupAnswerMode==='finish'||setupAnswerMode==='immediate') ? setupAnswerMode : (settings.showAnswerImmediately?'immediate':'finish');
  let label=customLabel||'Random review', moduleFilter='', subjectFilter='', lectureFilter='';
  let moduleFilters=[], subjectFilters=[], lectureFilters=[], selectionPaths=[];
  let minutesValue=0;

  if(customList){
    label=customLabel||'Mistakes practice';
  }

  if(!customList){
    let m,s,l,n;
    if(overrides){
      moduleFilters=Array.isArray(overrides.modules)?overrides.modules.slice(): (overrides.module?[overrides.module]:[]);
      subjectFilters=Array.isArray(overrides.subjects)?overrides.subjects.slice(): (overrides.subject?[overrides.subject]:[]);
      lectureFilters=Array.isArray(overrides.lectures)?overrides.lectures.slice(): (overrides.lecture?[overrides.lecture]:[]);
      m=moduleFilters[0]||'';
      s=subjectFilters[0]||'';
      l=lectureFilters[0]||'';
      n=Math.max(1,Number(overrides.count)||20);
      answerMode=overrides.answerMode||answerMode;
      minutesValue=Number(overrides.minutes)||0;
    } else {
      n=Math.max(1,Number(document.getElementById('examCount').value)||1);
      answerMode=(document.querySelector('input[name="answerMode"]:checked')?.value==='finish')?'finish':'immediate';
      minutesValue=Number(document.getElementById('examMinutes').value)||0;
      if(examBuilderMode==='simple'){
        const sm=document.getElementById('simpleModule')?.value||'';
        const ss=document.getElementById('simpleSubject')?.value||'';
        const sl=document.getElementById('simpleLecture')?.value||'';
        moduleFilters=sm?[sm]:[];
        subjectFilters=ss?[ss]:[];
        lectureFilters=sl?[sl]:[];
      }else{
        selectionPaths=[...examBuilderSelection];
        const selected=selectedExamQuestions();
        moduleFilters=[...new Set(selected.map(q=>String(q.module)))];
        subjectFilters=[...new Set(selected.map(q=>String(q.subject)))];
        lectureFilters=[...new Set(selected.map(q=>String(q.lecture)))];
      }
    }

    moduleFilter=moduleFilters.join(', ');
    subjectFilter=subjectFilters.join(', ');
    lectureFilter=lectureFilters.join(', ');

    if(overrides){
      list=list.filter(q=>
        (!moduleFilters.length||moduleFilters.includes(String(q.module)))&&
        (!subjectFilters.length||subjectFilters.includes(String(q.subject)))&&
        (!lectureFilters.length||lectureFilters.includes(String(q.lecture)))
      );
    } else if(examBuilderMode==='simple'){
      list=list.filter(q=>
        (!moduleFilters.length||moduleFilters.includes(String(q.module)))&&
        (!subjectFilters.length||subjectFilters.includes(String(q.subject)))&&
        (!lectureFilters.length||lectureFilters.includes(String(q.lecture)))
      );
    } else if(selectionPaths.length){
      list=list.filter(questionSelectedByBuilder);
    }

    if(!list.length){
      toast('No questions match those filters.','error');
      return;
    }

    /*
      Adaptive question pool:
      - Never answered questions are always eligible.
      - Questions answered incorrectly remain eligible and can repeat.
      - Questions answered correctly are removed from future exams.
      - Reset Progress clears this memory and makes all questions eligible again.
    */
    list=list.filter(q=>q && q.id && Array.isArray(q.options) && q.options.length>=2 && Number.isInteger(Number(q.correctIndex)) && Number(q.correctIndex)>=0 && Number(q.correctIndex)<q.options.length);
    if(!list.length){
      toast('No valid questions are available for this exam selection.','error');
      return;
    }

    let eligible=list.filter(q=>{
      const p=progress[key(q)];
      return !p || p.last!=='correct';
    });

    if(!eligible.length){
      if(!confirm('You have already answered every question in this selection correctly. Practise them again anyway?'))return;
      eligible=list.slice();
    }

    list=shuffle([...eligible]).slice(0,Math.min(n,eligible.length));

    // Always randomize answer order for every exam.
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });

    label=[moduleFilters.length?moduleFilters.join(', '):'All modules',subjectFilters.length?subjectFilters.join(', '):'All subjects',lectureFilters.length?lectureFilters.join(', '):'All lectures'].join(' · ');
  } else {
    // Mistakes practice is also randomized, including answer order.
    list=shuffle([...list]);
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });
  }

  exam={
    list,
    index:0,
    answers:{},
    started:Date.now(),
    minutes:customList?Number(overrides?.minutes||0):minutesValue,
    answerMode,
    submitted:false,
    label,
    moduleFilter,
    subjectFilter,
    lectureFilter,
    moduleFilters,
    subjectFilters,
    lectureFilters,
    selectionPaths
  };

  if(exam.minutes>0) startTimer(exam.minutes*60);
  saveActiveExam();
  renderQuiz();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function annotationData(q){
  if(!exam||!q)return null;
  exam.annotations=exam.annotations||{};
  const id=String(q.id);
  if(!exam.annotations[id]) exam.annotations[id]={strokes:[],note:''};
  return exam.annotations[id];
}
function annotationPointsForCanvas(points,canvas){
  // Stored points are normalized to the drawing box's *unzoomed* coordinate
  // system. Never use getBoundingClientRect() here because CSS pinch-zoom
  // changes that rectangle and would scale the stored coordinates a second
  // time, making drawings jump away from the place where they were made.
  const w=Math.max(1,canvas.clientWidth||canvas.offsetWidth||1);
  const h=Math.max(1,canvas.clientHeight||canvas.offsetHeight||1);
  return points.map(p=>[p[0]*w,p[1]*h]);
}
function drawExamAnnotations(){
  const canvas=document.getElementById('examAnnotationCanvas');
  if(!canvas||!exam)return;
  const stage=canvas.parentElement;
  const rect=stage.getBoundingClientRect();
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(stage.offsetWidth||rect.width)), h=Math.max(1,Math.round(stage.offsetHeight||rect.height));
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const data=annotationData(exam.list[exam.index]);
  if(!data)return;
  for(const stroke of data.strokes||[]){
    const pts=annotationPointsForCanvas(stroke.points||[],canvas);
    if(!pts.length)continue;
    ctx.save();
    ctx.globalAlpha=stroke.tool==='highlighter'?.32:1;
    ctx.globalCompositeOperation=stroke.tool==='eraser'?'destination-out':'source-over';
    ctx.strokeStyle=stroke.tool==='highlighter'?(stroke.color||'#f2c94c'):(stroke.color||'#101826');
    ctx.lineWidth=Number(stroke.size||3)*(stroke.tool==='highlighter'?5:1);
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    if(pts.length===1)ctx.lineTo(pts[0][0]+.01,pts[0][1]+.01);
    else for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke(); ctx.restore();
  }
}
